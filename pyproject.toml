[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nolane-aiv2"
version = "0.7.0"
description = "Nolane Living Model 100M research substrate and Stage-A falsification lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.7"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
