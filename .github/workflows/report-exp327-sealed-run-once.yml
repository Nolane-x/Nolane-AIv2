name: Report sealed EXP-327 run once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/report-exp327-sealed-run-once.yml"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest sealed EXP-327 dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${{ github.repository }}/actions/workflows/exp327-iterative-minimal-subset.yml/runs?event=workflow_dispatch&branch=exp327-iterative-minimal-failing-subset&per_page=1")"
          count="$(jq '.workflow_runs | length' <<<"$payload")"
          test "$count" -eq 1
          run_id="$(jq -r '.workflow_runs[0].id' <<<"$payload")"
          status="$(jq -r '.workflow_runs[0].status' <<<"$payload")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // "null"' <<<"$payload")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha' <<<"$payload")"
          event="$(jq -r '.workflow_runs[0].event' <<<"$payload")"
          created_at="$(jq -r '.workflow_runs[0].created_at' <<<"$payload")"
          body="EXP-327 dispatcher observation: run \`$run_id\`, status \`$status\`, conclusion \`$conclusion\`, event \`$event\`, head \`$head_sha\`, created \`$created_at\`. This is procedural run discovery only and does not itself seal a scientific disposition."
          gh api --method POST "repos/${{ github.repository }}/issues/100/comments" -f body="$body"
