name: EXP-333 complete 8-world pair-lattice projection court
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker
      - name: Resolve sealed source
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("marker/protocols/v017/exp333_execution_identity_v1.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"source_sha={payload['source_commit_sha']}\n")
              out.write(f"workflow_sha256={payload['workflow_sha256']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workflow and immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum frozen/.github/workflows/exp333-complete-eight-world-pair-lattice.yml | awk '{print $1}')" = "${{ steps.identity.outputs.workflow_sha256 }}"
          python - <<'PY'
          import json, os, urllib.request
          checks = (
              (10547681681, "exp323r-reconstruction-candidate-35345351869-0", "sha256:c0862235302243e6d9ef689ea6ef7214431ce44f41575aea12954524ad1ac621"),
              (10580076061, "exp332-portable-pair-lattice-final-35427969759", "sha256:7bdbb30570a98326af5a98effb7718c2f40d8430a1a2f5a115fb3590a901b141"),
          )
          for artifact_id, name, digest in checks:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/Nolane-x/Nolane-AIv2/actions/artifacts/{artifact_id}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exp333",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  item = json.load(response)
              if item["name"] != name or item.get("expired") is not False or item.get("digest") != digest:
                  raise SystemExit(f"artifact authority mismatch {artifact_id}")
          PY
      - name: Download reconstruction artifact by ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10547681681"
          path: reconstruction
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35345351869"
      - name: Download EXP-332 parent artifact by ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10580076061"
          path: exp332-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35427969759"
      - name: Verify downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum reconstruction/reconstruction.pt | awk '{print $1}')" = "4aa03459b5266a3455bcfbc8cb070d9ceaeb0e7b8390944e7d483b0953e567c5"
          test "$(sha256sum reconstruction/reconstruction-receipt.json | awk '{print $1}')" = "617ba665149a366d00782df5c4457a6a3d01081fe847aa144465377ee164bba3"
          test "$(sha256sum exp332-parent/exp332-final.json | awk '{print $1}')" = "02bf65b708e58837aa5b2a61c3af6acff09d000f8916bcda3a27a59ebdcd6355"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Run complete 8-world pair lattice
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp333_run.py \
            --reconstruction-checkpoint reconstruction/reconstruction.pt \
            --reconstruction-receipt reconstruction/reconstruction-receipt.json \
            --selection-lock frozen/protocols/v017/exp323r_reconstruction_selection_lock_v1.json \
            --parent-exp332 exp332-parent/exp332-final.json \
            --execution-identity marker/protocols/v017/exp333_execution_identity_v1.json \
            --output evidence/exp333-final.json
      - name: Fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence/exp333-final.json").read_text())
          for key in ("exp302_implementation_authorized","exp320_implementation_authorized","scale_authorized","authorized_30m","authorized_100m"):
              if payload.get(key) is not False:
                  raise SystemExit(f"forbidden authorization: {key}")
          print("EXP-333 disposition:", payload["decision"])
          print("EXP-333 evidence digest:", payload["evidence_digest"])
          print("parent anchor reproduced:", payload["parent_anchor_reproduced"])
          print("baseline failures:", payload["baseline_failures"])
          print("new baseline failures:", payload["new_baseline_failures"])
          print("rescued baseline failures:", payload["rescued_baseline_failures"])
          print("unresolved baseline failures:", payload["unresolved_baseline_failures"])
          print("project regressions:", payload["project_regressions"])
          print("baseline failures without projection trigger:", payload["baseline_failures_without_projection_trigger"])
          print("project pass pairs:", payload["project_pass_pairs"])
          print("projection event counts:", payload["projection_event_counts"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp333-complete-pair-lattice-final-${{ github.run_id }}
          path: evidence/exp333-final.json
          if-no-files-found: error
          retention-days: 90
