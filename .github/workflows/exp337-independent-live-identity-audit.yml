name: EXP-337 independent live identity audit

on:
  push:
    branches: [exp337-live-audit-runner]
    paths:
      - ".github/workflows/exp337-independent-live-identity-audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit-identity:
    runs-on: ubuntu-latest
    env:
      AUTHORITATIVE_RUN_ID: "35503733893"
      IDENTITY_ARTIFACT_ID: "10603451535"
      EXPECTED_IDENTITY_ZIP_SHA256: "a8c8feef319ba2988a1e518fbfaf3f448cd90259264e709cea8ef47ff38a6c5b"
      FROZEN_AUDITOR_SHA: "debc13fd4ec8f8ed443302ef0352d751661faafc"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_AUDITOR_SHA }}
          path: auditor
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download raw identity ZIP and verify frozen bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path
          from zipfile import ZipFile

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          artifact_id=int(os.environ["IDENTITY_ARTIFACT_ID"])
          run_id=int(os.environ["AUTHORITATIVE_RUN_ID"])
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"exp337-live-identity-audit",
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as response: return json.load(response)

          meta=get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}")
          assert meta["name"] == f"exp337-identity-{run_id}"
          assert meta["expired"] is False
          expected_meta=str(meta["digest"]).removeprefix("sha256:")
          assert expected_meta == os.environ["EXPECTED_IDENTITY_ZIP_SHA256"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,response_headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip",headers=headers)
          try:
              opener.open(req)
          except urllib.error.HTTPError as exc:
              if exc.code not in (301,302,303,307,308): raise
              location=exc.headers.get("Location")
          else:
              raise RuntimeError("artifact endpoint did not redirect")
          if not location: raise RuntimeError("artifact redirect missing Location")
          with urllib.request.urlopen(urllib.request.Request(location,headers={"User-Agent":"exp337-live-identity-audit"})) as response:
              raw=response.read()
          observed=hashlib.sha256(raw).hexdigest()
          assert observed == expected_meta
          Path("identity.zip").write_bytes(raw)

          with ZipFile("identity.zip") as z:
              members=[n for n in z.namelist() if n.endswith("exp337_execution_identity_v1.json")]
              assert len(members)==1, members
              identity_bytes=z.read(members[0])
          frozen=Path("auditor/protocols/v017/exp337_execution_identity_v1.json").read_bytes()
          assert identity_bytes == frozen
          identity=json.loads(identity_bytes)
          assert identity["source_commit_sha"]=="5a0fa8da3e3906a712bcb027d8d4e40ed60f026b"
          assert identity["source_tree_digest"]=="211179cb6c95308aa936efeb144ee8c9729e468b13cf7e13cdaf67ea3dbf1520"
          assert identity["workflow_sha256"]=="705319c2ab640308cbb36e8d118f7f1038644796d5099eb2f6964cee73860c9d"
          assert identity["exp337_execution_digest"]=="c7d9b0ad756a2417d5675a9203b3dd95b4ba3e2596a3a5c91b34b8dfd73e20d2"

          receipt={
              "schema":"EXP337-INDEPENDENT-LIVE-IDENTITY-AUDIT-V1",
              "authoritative_run_id":run_id,
              "artifact_id":artifact_id,
              "artifact_name":meta["name"],
              "artifact_zip_sha256":observed,
              "artifact_size_in_bytes":meta["size_in_bytes"],
              "identity_bytes_sha256":hashlib.sha256(identity_bytes).hexdigest(),
              "frozen_identity_bytes_equal":True,
              "source_commit_sha":identity["source_commit_sha"],
              "source_tree_digest":identity["source_tree_digest"],
              "workflow_sha256":identity["workflow_sha256"],
              "execution_digest":identity["exp337_execution_digest"],
              "scientific_disposition_assigned":False,
          }
          Path("audit-output/exp337-independent-live-identity-audit.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp337-independent-live-identity-audit-${{ github.run_id }}
          path: audit-output/exp337-independent-live-identity-audit.json
          if-no-files-found: error
          retention-days: 90
