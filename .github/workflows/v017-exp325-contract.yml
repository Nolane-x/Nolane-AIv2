name: v017-exp325-contract

on:
  pull_request:
    paths:
      - "docs/superpowers/specs/2026-09-18-exp325-single-world-memorization-design.md"
      - "protocols/v017/exp325_preregistration_v1.json"
      - "protocols/v017/exp325_preregistration_v1.sha256"
      - "src/nolane_ai/experiments/exp325_*.py"
      - "scripts/verify_exp325_contract.py"
      - "scripts/exp325_*.py"
      - "tests/test_exp325_*.py"
      - ".github/workflows/v017-exp325-contract.yml"
      - ".github/workflows/exp325-single-world-memorization.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,model]'
      - name: Verify preregistration
        run: >-
          python scripts/verify_exp325_contract.py
          --json protocols/v017/exp325_preregistration_v1.json
          --sha256 protocols/v017/exp325_preregistration_v1.sha256
      - name: Run complete EXP-325 court
        run: pytest -q tests/test_exp325_*.py
      - run: python -m compileall -q src scripts
