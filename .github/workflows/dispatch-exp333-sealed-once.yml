name: Dispatch sealed EXP-333 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp333-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-333 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp333-complete-eight-world-pair-lattice.yml/dispatches
          -f ref=exp333-complete-eight-world-pair-lattice
