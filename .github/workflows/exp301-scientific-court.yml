name: EXP-301 scientific court

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp301-scientific-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require frozen execution identity
        run: >-
          test -f protocols/v017/exp301_execution_identity_v1.json &&
          test -f protocols/v017/exp301_execution_identity_v1.sha256 &&
          sha256sum -c protocols/v017/exp301_execution_identity_v1.sha256

  root-court:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Execute frozen root court
        env:
          EXP301_ROOT: ${{ matrix.root }}
        run: >-
          python scripts/run_exp301.py
          --output-dir artifacts/root-${{ matrix.root }}
          --execution-identity protocols/v017/exp301_execution_identity_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp301-root-${{ matrix.root }}
          path: artifacts/root-${{ matrix.root }}
          if-no-files-found: error

  cross-root-reducer:
    needs: root-court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exp301-root-*
          path: artifacts/roots
          merge-multiple: true
      - name: Freeze-gated reducer boundary
        run: >-
          python -c 'raise SystemExit("EXP-301 cross-root reducer remains freeze-gated until the Task 11 execution identity is sealed")'
