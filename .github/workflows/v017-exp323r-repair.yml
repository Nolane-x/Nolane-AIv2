name: v017-exp323r-repair

on:
  pull_request:
    paths:
      - "protocols/v017/exp323r_reconstruction_selection_lock_v1.json"
      - "protocols/v017/exp323r_reconstruction_selection_lock_v1.sha256"
      - "src/nolane_ai/experiments/exp323r_*.py"
      - "scripts/exp323r_*.py"
      - "tests/test_exp323r_*.py"
      - ".github/workflows/v017-exp323r-repair.yml"
      - ".github/workflows/exp323r-second-decay-convergence.yml"
      - ".github/workflows/exp323r-reconstruction-materialization.yml"

permissions:
  contents: read

jobs:
  repair-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,model]'
      - name: Run complete EXP-323R repair court
        run: pytest -q tests/test_exp323r_*.py
      - run: python -m compileall -q src scripts
