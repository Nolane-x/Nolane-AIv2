name: Dispatch sealed EXP-331 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp331-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-331 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp331-pair-lattice-projection-safety.yml/dispatches
          -f ref=exp331-pair-lattice-projection-safety
