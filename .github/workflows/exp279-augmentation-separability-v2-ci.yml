name: exp279-augmentation-separability-v2-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-augmentation-separability-v2-ci.yml
      - src/nolane_ai/experiments/exp279_augmentation_separability_v2.py
      - tests/test_exp279_augmentation_separability_v2.py
      - tests/test_exp279_augmentation_separability_v2_cli.py
      - scripts/run_exp279_augmentation_separability_v2_dev.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run augmentation separability V2 RED contract
        run: pytest -q tests/test_exp279_augmentation_separability_v2.py
      - name: Compile analysis surface
        run: python -m compileall -q src scripts
