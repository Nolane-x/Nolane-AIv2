name: Dispatch sealed EXP-328 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp328-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-328 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp328-p02-order-geometry.yml/dispatches
          -f ref=exp328-p02-order-geometry
