name: exp335-independent-current-artifact-audit

on:
  push:
    branches: [exp335-independent-artifact-auditor]
    paths:
      - .github/workflows/exp335-independent-current-artifact-audit.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download authoritative chunk ZIPs without extraction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-input
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          artifacts = {
              0: 10586346937,
              1: 10586443959,
              2: 10587006784,
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "exp335-independent-auditor",
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          api_opener = urllib.request.build_opener(NoRedirect)

          for index, artifact_id in artifacts.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip",
                  headers=headers,
              )
              try:
                  api_opener.open(request)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get("Location")
              else:
                  raise RuntimeError("artifact endpoint unexpectedly did not redirect")
              if not location:
                  raise RuntimeError(f"artifact {artifact_id} redirect missing Location")

              # The redirect is a signed storage URL. Do not forward GitHub auth
              # to the storage host; doing so causes a 401.
              storage_request = urllib.request.Request(
                  location,
                  headers={"User-Agent": "exp335-independent-auditor"},
              )
              with urllib.request.urlopen(storage_request) as response:
                  payload = response.read()

              path = f"audit-input/chunk{index}.zip"
              with open(path, "wb") as handle:
                  handle.write(payload)
              print(f"downloaded chunk{index}: artifact={artifact_id} bytes={len(payload)}")
          PY

      - name: Verify GitHub artifact ZIP digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          expected = {
              0: "42db4c1f5389a9a566d02c212948df524fb0d1b74af87c0b778b4b2ce21461c9",
              1: "3baa5c052874c71811ea7545bf4517e3f60f024caa84280d173ada72a08a466a",
              2: "f1d0c7c5e02c23cee61a2d77dfb5db67c0f9acd7537a924ebecfac75111df042",
          }
          for index, wanted in expected.items():
              path = f"audit-input/chunk{index}.zip"
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              print(f"chunk{index} sha256={digest}")
              if digest != wanted:
                  raise SystemExit(f"chunk{index} GitHub artifact digest mismatch")
          PY

      - name: Run independent EXP-335 chain auditor
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/exp335_audit_chain.py \
            --execution-identity protocols/v017/exp335_execution_identity_v1.json \
            --chunk-zip audit-input/chunk0.zip \
            --chunk-zip audit-input/chunk1.zip \
            --chunk-zip audit-input/chunk2.zip \
            --output audit-input/exp335-independent-chain-audit-through-chunk2.json
          python - <<'PY'
          import json
          path = "audit-input/exp335-independent-chain-audit-through-chunk2.json"
          payload = json.load(open(path, encoding="utf-8"))
          chain = payload["chain"]
          assert chain["verified_chunk_count"] == 3
          assert chain["complete_chunk_chain"] is False
          assert chain["chunks"][0]["control_sham_exact"] is True
          assert chain["chunks"][1]["control_sham_exact"] is True
          assert chain["chunks"][2]["control_sham_exact"] is True
          assert all(
              value is False
              for value in chain["authorization_flags"].values()
          )
          print(json.dumps(chain, sort_keys=True, indent=2))
          PY

      - name: Hash independent audit report
        shell: bash
        run: |
          set -euo pipefail
          sha256sum audit-input/exp335-independent-chain-audit-through-chunk2.json

      - uses: actions/upload-artifact@v4
        with:
          name: exp335-independent-chain-audit-through-chunk2-${{ github.run_id }}
          path: audit-input/exp335-independent-chain-audit-through-chunk2.json
          if-no-files-found: error
          retention-days: 90
