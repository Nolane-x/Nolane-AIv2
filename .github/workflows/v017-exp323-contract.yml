name: v017-exp323-contract

on:
  pull_request:
    paths:
      - "docs/superpowers/specs/2026-09-18-exp323-second-decay-convergence-intervention-design.md"
      - "protocols/v017/exp323_preregistration_v1.json"
      - "protocols/v017/exp323_preregistration_v1.sha256"
      - "src/nolane_ai/experiments/exp323_*.py"
      - "scripts/verify_exp323_contract.py"
      - "scripts/verify_exp323_replay.py"
      - "scripts/exp323_*.py"
      - "tests/test_exp323_*.py"
      - ".github/workflows/v017-exp323-contract.yml"
      - ".github/workflows/v017-exp323-replay-authority.yml"
      - ".github/workflows/exp323-second-decay-convergence.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,model]'
      - name: Verify preregistration
        run: >-
          python scripts/verify_exp323_contract.py
          --json protocols/v017/exp323_preregistration_v1.json
          --sha256 protocols/v017/exp323_preregistration_v1.sha256
      - name: Run complete EXP-323 court
        run: pytest -q tests/test_exp323_*.py
      - run: python -m compileall -q src scripts
