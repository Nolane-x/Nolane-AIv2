name: EXP-325 single-world memorization

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  family:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family:
          - iterative-grid-and-maze
          - algorithmic-sequence-transform
          - generator-heldout-abstract-transformation
          - language-sequence-control
    steps:
      - name: Checkout sealed marker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker

      - name: Resolve frozen source identity
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("marker/protocols/v017/exp325_execution_identity_v1.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"source_sha={p['source_commit_sha']}\n")
              out.write(f"workflow_sha256={p['workflow_sha256']}\n")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum frozen/.github/workflows/exp325-single-world-memorization.yml | awk '{print $1}')" = "${{ steps.identity.outputs.workflow_sha256 }}"
          python - <<'PY'
          import json,os,urllib.request
          repo="Nolane-x/Nolane-AIv2"
          checks=(
            (35362450626,10554724648,"exp324-family-isolated-final-35362450626","sha256:70fae1e9d8b54df17f2a46740630cbb1861662a5ec3d2df756193e3cd6991965"),
            (35345351869,10547681681,"exp323r-reconstruction-candidate-35345351869-0","sha256:c0862235302243e6d9ef689ea6ef7214431ce44f41575aea12954524ad1ac621"),
          )
          for run_id,aid,name,digest in checks:
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"exp325"})
              with urllib.request.urlopen(req) as r: payload=json.load(r)
              matches=[x for x in payload["artifacts"] if int(x["id"])==aid]
              if len(matches)!=1: raise SystemExit(f"artifact missing: {aid}")
              x=matches[0]
              if x["name"]!=name or x.get("expired") is not False or x.get("digest")!=digest:
                  raise SystemExit(f"artifact metadata mismatch: {aid}")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: exp323r-reconstruction-candidate-35345351869-0
          path: reconstruction
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35345351869

      - uses: actions/download-artifact@v4
        with:
          name: exp324-family-isolated-final-35362450626
          path: parent-final
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35362450626

      - name: Verify downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum reconstruction/reconstruction.pt | awk '{print $1}')" = "4aa03459b5266a3455bcfbc8cb070d9ceaeb0e7b8390944e7d483b0953e567c5"
          test "$(sha256sum reconstruction/reconstruction-receipt.json | awk '{print $1}')" = "617ba665149a366d00782df5c4457a6a3d01081fe847aa144465377ee164bba3"
          test "$(sha256sum parent-final/exp324-final.json | awk '{print $1}')" = "9d8504d75f72f34ed65514f9d09ec7d26de584b9efd6a87e95fc4b2a2870e18d"

      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Run eight independent world clones for family
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          mkdir -p "family-${{ matrix.family }}"
          python frozen/scripts/exp325_run_family.py \
            --reconstruction-checkpoint reconstruction/reconstruction.pt \
            --reconstruction-receipt reconstruction/reconstruction-receipt.json \
            --selection-lock frozen/protocols/v017/exp323r_reconstruction_selection_lock_v1.json \
            --parent-final parent-final/exp324-final.json \
            --family "${{ matrix.family }}" \
            --execution-identity marker/protocols/v017/exp325_execution_identity_v1.json \
            --output "family-${{ matrix.family }}/evidence.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exp325-${{ matrix.family }}-${{ github.run_id }}
          path: family-${{ matrix.family }}/evidence.json
          if-no-files-found: error
          retention-days: 90

  reduce:
    needs: family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker
      - name: Resolve source
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("marker/protocols/v017/exp325_execution_identity_v1.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"source_sha={p['source_commit_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: exp325-iterative-grid-and-maze-${{ github.run_id }}
          path: a0
      - uses: actions/download-artifact@v4
        with:
          name: exp325-algorithmic-sequence-transform-${{ github.run_id }}
          path: a1
      - uses: actions/download-artifact@v4
        with:
          name: exp325-generator-heldout-abstract-transformation-${{ github.run_id }}
          path: a2
      - uses: actions/download-artifact@v4
        with:
          name: exp325-language-sequence-control-${{ github.run_id }}
          path: a3
      - run: python -m pip install -e './frozen[dev,model]'
      - name: Reduce world evidence
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp325_reduce.py \
            --arm-0 a0/evidence.json --arm-1 a1/evidence.json \
            --arm-2 a2/evidence.json --arm-3 a3/evidence.json \
            --output evidence/exp325-final.json
      - name: Fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/exp325-final.json").read_text())
          for k in ("exp302_implementation_authorized","exp320_implementation_authorized","scale_authorized","authorized_30m","authorized_100m"):
              if p.get(k) is not False: raise SystemExit(f"forbidden authorization: {k}")
          print("EXP-325 disposition:",p["decision"])
          print("EXP-325 evidence digest:",p["evidence_digest"])
          print("EXP-325 passed world count:",p["passed_world_count"])
          print("EXP-325 family pass counts:",p["family_pass_counts"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp325-single-world-final-${{ github.run_id }}
          path: evidence/exp325-final.json
          if-no-files-found: error
          retention-days: 90
