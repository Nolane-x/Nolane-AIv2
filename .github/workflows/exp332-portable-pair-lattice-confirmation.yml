name: EXP-332 portable pair-lattice projection confirmation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker
      - name: Resolve sealed source
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("marker/protocols/v017/exp332_execution_identity_v1.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"source_sha={payload['source_commit_sha']}\n")
              out.write(f"workflow_sha256={payload['workflow_sha256']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify workflow and immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum frozen/.github/workflows/exp332-portable-pair-lattice-confirmation.yml | awk '{print $1}')" = "${{ steps.identity.outputs.workflow_sha256 }}"
          python - <<'PY'
          import json, os, urllib.request
          checks = (
              (10547681681, "exp323r-reconstruction-candidate-35345351869-0", "sha256:c0862235302243e6d9ef689ea6ef7214431ce44f41575aea12954524ad1ac621"),
              (10577706134, "exp330-projection-rescue-final-35419828278", "sha256:cadf92521948973bb319e8280934e559526616097c75f74a1fc1a90d02c33ab7"),
              (10574837015, "exp327-minimal-subset-final-35413434081", "sha256:b4ddab033a85762c99451f6532f790fbf4cda9181ff67c1a2093613dd0156d77"),
              (10578071604, "exp327-minimal-subset-final-35413434081", "sha256:a5093c7b332f2a174336f3216ec878b09fc8fa0e5dcda9cd5f7651b796708b95"),
          )
          for artifact_id, name, digest in checks:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/Nolane-x/Nolane-AIv2/actions/artifacts/{artifact_id}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exp332",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  item = json.load(response)
              if item["name"] != name or item.get("expired") is not False or item.get("digest") != digest:
                  raise SystemExit(f"artifact authority mismatch {artifact_id}")
          PY
      - name: Download reconstruction artifact by ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10547681681"
          path: reconstruction
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35345351869"
      - name: Download EXP-330 parent artifact by ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10577706134"
          path: exp330-parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35419828278"
      - name: Download EXP-327 original artifact by exact artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exp327-original
          headers="$(mktemp)"
          curl --fail --silent --show-error --dump-header "$headers" --output /dev/null \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10574837015/zip"
          signed_url="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$headers")"
          test -n "$signed_url"
          curl --fail --silent --show-error --location "$signed_url" --output exp327-original.zip
          unzip -q exp327-original.zip -d exp327-original
          rm -f "$headers" exp327-original.zip
      - name: Download EXP-327 replay artifact by ID
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10578071604"
          path: exp327-replay
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35413434081"
      - name: Verify downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum reconstruction/reconstruction.pt | awk '{print $1}')" = "4aa03459b5266a3455bcfbc8cb070d9ceaeb0e7b8390944e7d483b0953e567c5"
          test "$(sha256sum reconstruction/reconstruction-receipt.json | awk '{print $1}')" = "617ba665149a366d00782df5c4457a6a3d01081fe847aa144465377ee164bba3"
          test "$(sha256sum exp330-parent/exp330-final.json | awk '{print $1}')" = "8aefca4b8fa4b6f814da219a2e58a4e97bab849a4f3291f95a6b2d19c35f4b2d"
          test "$(sha256sum exp327-original/exp327-final.json | awk '{print $1}')" = "27f8ef1fbe2bbb2a2a931d9dddd1409a6f3a0b9a8ecb06902f1e46bb07543279"
          test "$(sha256sum exp327-replay/exp327-final.json | awk '{print $1}')" = "cc608361850a524f6e82c06c8f65a5a7c0cb321a90b2c6d4686238a82233540f"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Run portable pair-lattice confirmation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp332_run.py \
            --reconstruction-checkpoint reconstruction/reconstruction.pt \
            --reconstruction-receipt reconstruction/reconstruction-receipt.json \
            --selection-lock frozen/protocols/v017/exp323r_reconstruction_selection_lock_v1.json \
            --exp330-parent exp330-parent/exp330-final.json \
            --exp327-original exp327-original/exp327-final.json \
            --exp327-replay exp327-replay/exp327-final.json \
            --execution-identity marker/protocols/v017/exp332_execution_identity_v1.json \
            --output evidence/exp332-final.json
      - name: Fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence/exp332-final.json").read_text())
          for key in ("exp302_implementation_authorized","exp320_implementation_authorized","scale_authorized","authorized_30m","authorized_100m"):
            if payload.get(key) is not False:
                raise SystemExit(f"forbidden authorization: {key}")
          print("EXP-332 disposition:", payload["decision"])
          print("EXP-332 evidence digest:", payload["evidence_digest"])
          print("witness behavior equal:", payload["witness_behavior_equal"])
          print("historical state divergence pairs:", payload["historical_state_divergence_pairs"])
          print("parent behavior reproduced:", payload["parent_behavior_reproduced"])
          print("pair sham match:", payload["pair_sham_match"])
          print("project pass pairs:", payload["project_pass_pairs"])
          print("project regressions:", payload["project_regressions"])
          print("P02 projection events:", payload["p02_projection_event_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp332-portable-pair-lattice-final-${{ github.run_id }}
          path: evidence/exp332-final.json
          if-no-files-found: error
          retention-days: 90
