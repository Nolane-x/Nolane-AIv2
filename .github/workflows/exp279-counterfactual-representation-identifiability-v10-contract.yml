name: exp279-counterfactual-representation-identifiability-v10-contract

on:
  pull_request:
    paths:
      - '.github/workflows/exp279-counterfactual-representation-identifiability-v10-contract.yml'
      - '.github/workflows/exp279-counterfactual-representation-identifiability-v10-scientific.yml'
      - '.github/workflows/exp279-counterfactual-representation-identifiability-v10-freeze-guard.yml'
      - 'src/nolane_ai/experiments/exp279_counterfactual_representation_identifiability_v10.py'
      - 'src/nolane_ai/experiments/exp279_counterfactual_representation_identifiability_v10_runner.py'
      - 'src/nolane_ai/experiments/exp279_counterfactual_representation_identifiability_v10_receipts.py'
      - 'scripts/*exp279_counterfactual_representation_identifiability_v10*.py'
      - 'tests/test_exp279_counterfactual_representation_identifiability_v10*.py'
      - 'docs/superpowers/specs/2026-09-12-exp279-v10-cric-design.md'
      - 'protocols/exp279-v10-cric-release.lock'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only V10 contract environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run V10 CRIC contract tests
        run: pytest -q tests/test_exp279_counterfactual_representation_identifiability_v10*.py
      - name: Compile V10 analysis surface
        run: python -m compileall -q src scripts
