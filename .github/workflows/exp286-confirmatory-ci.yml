name: exp286-confirmatory-ci

on:
  pull_request:
    paths:
      - 'src/nolane_ai/experiments/exp286_*.py'
      - 'scripts/*exp286*.py'
      - 'tests/test_exp286_*.py'
      - 'tests/test_matched_conflict_arms.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/exp286-confirmatory-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/nolane_ai/experiments/exp286_*.py'
      - 'scripts/*exp286*.py'
      - 'tests/test_exp286_*.py'
      - 'tests/test_matched_conflict_arms.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/exp286-confirmatory-ci.yml'

concurrency:
  group: exp286-confirmatory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Run EXP-286 focused contract
        run: pytest -q tests/test_exp286_*.py tests/test_matched_conflict_arms.py
      - name: Build EXP-286 Gate A DEVELOPMENT pilot
        run: >-
          python scripts/run_exp286_paired_dev.py
          --tiny
          --train-replicates 2
          --eval-replicates 32
          --eval-start-replicate 20000
          --batch-size 2
          --timesteps 3
          --variables 5
          --decoys 2
          --max-search-steps 8
          --output /tmp/nlm-exp286-gatea-dev.json
          --registry-output /tmp/nlm-exp286-gatea-registry.json
      - name: Prepare EXP-286 Gate A
        run: >-
          python scripts/prepare_exp286_confirmatory_gate_a.py
          --execution /tmp/nlm-exp286-gatea-dev.json
          --registry /tmp/nlm-exp286-gatea-registry.json
          --output /tmp/nlm-exp286-gatea-prep.json
      - name: Assert EXP-286 Gate A pre-beacon boundary
        run: >-
          python -c 'import json; from pathlib import Path; p=json.loads(Path("/tmp/nlm-exp286-gatea-prep.json").read_text()); assert p["evidence_level"] == "EV-E2"; assert p["decision"] == "UNVERIFIED"; assert p["challenge_materialized"] is False; assert p["confirmatory_data_consumed"] is False; assert p["decision_rule_executed"] is False; assert p["confirmatory_lineage"]["seed_materialization_status"] == "NOT_EXECUTED"; assert p["status"] in {"CONFIRMATORY_GATE_A_PREPARED", "NOT_READY_VARIANCE_EXCEEDS_MAX_N"}; f=p["sample_size_freeze"]; assert (p["confirmatory_ready"] is False and f["confirmatory_n"] is None and p["confirmatory_lineage"]["reserved_replicate_ids"] == []) if p["status"] == "NOT_READY_VARIANCE_EXCEEDS_MAX_N" else (p["confirmatory_ready"] is True and 32 <= f["confirmatory_n"] <= 128)'
      - name: Remove EXP-286 DEVELOPMENT Gate A smoke artifacts
        if: always()
        run: >-
          rm -f
          /tmp/nlm-exp286-gatea-dev.json
          /tmp/nlm-exp286-gatea-registry.json
          /tmp/nlm-exp286-gatea-prep.json
      - run: python scripts/verify_protocol.py
      - run: python -m compileall -q src scripts
