name: exp319r-tdd-helper

on:
  push:
    branches: [exp319r-tdd-helper]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: eb0574ed4504779c5c917b51fe4c51a74df5061f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_exp319_workflow.py -q
