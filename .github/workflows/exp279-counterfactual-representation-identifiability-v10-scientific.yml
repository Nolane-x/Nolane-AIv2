name: exp279-counterfactual-representation-identifiability-v10-scientific

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - protocols/exp279-v10-cric-release.lock

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require frozen V10 release marker at current branch head
        run: |
          MARKER=protocols/exp279-v10-cric-release.lock
          LAST_TOUCH=$(git log -1 --format=%H -- "$MARKER")
          test "$LAST_TOUCH" = "${{ github.event.pull_request.head.sha }}"
          python - <<'PY'
          from pathlib import Path

          expected = """EXP279_V10_CRIC_RELEASE_V1
          train_budgets=60,120
          canonical_indices=0,1,2,3
          fit_roots_per_canonical=2
          heldout_roots_per_canonical=2
          fit_replicates_per_root=128
          heldout_replicates_per_root=128
          views=V9_MEAN_BASELINE,FULL_PREBRANCH_STATE,EXECUTION_FRONTIER_STATE
          nearest_neighbor=k1_exact_squared_euclidean_fit_zscore
          query_chunk_size=256
          root_prefix=20260912-exp279-v10-cric-dev
          protocol_digest=c010d90b9d626cfde4f7727b76fcd053f1ebf7f2f7aa201d7d13d2d828cef440
          """
          expected = "\n".join(line.strip() for line in expected.splitlines() if line.strip()) + "\n"
          actual = Path("protocols/exp279-v10-cric-release.lock").read_text(encoding="utf-8")
          if actual != expected:
              raise SystemExit("V10 CRIC release marker content mismatch")
          PY
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py

  scientific-shard:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        train_replicates: [60, 120]
        canonical_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run frozen V10 CRIC shard
        run: |
          WORK=/tmp/exp279-v10-${{ matrix.train_replicates }}-${{ matrix.canonical_index }}
          mkdir -p "$WORK"
          python scripts/run_exp279_counterfactual_representation_identifiability_v10_dev.py \
            --train-replicates ${{ matrix.train_replicates }} \
            --canonical-index ${{ matrix.canonical_index }} \
            --scientific-branch-head ${{ github.event.pull_request.head.sha }} \
            --executed-commit ${{ github.sha }} \
            --output "$WORK/receipt.json"
      - name: Verify shard receipt, sidecar, provenance, and boundaries
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from nolane_ai.experiments.exp279_counterfactual_representation_identifiability_v10_receipts import canonical_receipt_bytes, validate_shard_receipt

          n = ${{ matrix.train_replicates }}
          c = ${{ matrix.canonical_index }}
          receipt = Path(f"/tmp/exp279-v10-{n}-{c}/receipt.json")
          payload = receipt.read_bytes()
          assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8").strip() == hashlib.sha256(payload).hexdigest()
          data = json.loads(payload.decode("utf-8"))
          assert payload == canonical_receipt_bytes(data)
          validate_shard_receipt(data)
          assert data["train_replicates"] == n
          assert data["canonical_index"] == c
          assert data["scientific_branch_head"] == "${{ github.event.pull_request.head.sha }}"
          assert data["executed_commit"] == "${{ github.sha }}"
          for key in ("scientific_evidence_eligible", "evaluation_rng_used", "evaluation_lineage_consumed", "confirmatory_data_consumed", "challenge_materialized", "promotion_claimed", "mechanism_successor_authorized", "raw_examples_exported", "raw_model_outputs_exported"):
              assert data[key] is False, key
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp279-v10-shard-${{ matrix.train_replicates }}-${{ matrix.canonical_index }}-${{ github.sha }}
          path: /tmp/exp279-v10-${{ matrix.train_replicates }}-${{ matrix.canonical_index }}
          if-no-files-found: error
          retention-days: 90

  budget:
    needs: scientific-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        train_replicates: [60, 120]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only reducer environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: exp279-v10-shard-${{ matrix.train_replicates }}-*-${{ github.sha }}
          path: /tmp/exp279-v10-shards-${{ matrix.train_replicates }}
      - name: Verify exactly four shards and aggregate budget
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from nolane_ai.experiments.exp279_counterfactual_representation_identifiability_v10_receipts import canonical_receipt_bytes, validate_shard_receipt

          n = ${{ matrix.train_replicates }}
          root = Path(f"/tmp/exp279-v10-shards-{n}")
          receipts = sorted(root.glob("*/receipt.json"))
          assert len(receipts) == 4, receipts
          indices = set()
          for receipt in receipts:
              payload = receipt.read_bytes()
              assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8").strip() == hashlib.sha256(payload).hexdigest()
              data = json.loads(payload.decode("utf-8"))
              assert payload == canonical_receipt_bytes(data)
              validate_shard_receipt(data)
              assert data["train_replicates"] == n
              indices.add(data["canonical_index"])
          assert indices == {0, 1, 2, 3}
          root.joinpath("paths.txt").write_text("\n".join(str(path) for path in receipts) + "\n", encoding="utf-8")
          PY
          mapfile -t SHARDS < /tmp/exp279-v10-shards-${{ matrix.train_replicates }}/paths.txt
          WORK=/tmp/exp279-v10-budget-${{ matrix.train_replicates }}
          mkdir -p "$WORK"
          python scripts/aggregate_exp279_counterfactual_representation_identifiability_v10_dev.py \
            --shard "${SHARDS[0]}" \
            --shard "${SHARDS[1]}" \
            --shard "${SHARDS[2]}" \
            --shard "${SHARDS[3]}" \
            --output "$WORK/receipt.json"
      - name: Verify budget receipt and byte sidecar
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from nolane_ai.experiments.exp279_counterfactual_representation_identifiability_v10_receipts import canonical_receipt_bytes, validate_budget_receipt

          n = ${{ matrix.train_replicates }}
          receipt = Path(f"/tmp/exp279-v10-budget-{n}/receipt.json")
          payload = receipt.read_bytes()
          assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8").strip() == hashlib.sha256(payload).hexdigest()
          data = json.loads(payload.decode("utf-8"))
          assert payload == canonical_receipt_bytes(data)
          validate_budget_receipt(data)
          assert data["train_replicates"] == n
          assert data["mechanism_successor_authorized"] is False
          assert data["evaluation_rng_used"] is False
          assert data["confirmatory_data_consumed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp279-v10-budget-${{ matrix.train_replicates }}-${{ github.sha }}
          path: /tmp/exp279-v10-budget-${{ matrix.train_replicates }}
          if-no-files-found: error
          retention-days: 90

  cross-cell:
    needs: budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only reducer environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: exp279-v10-budget-60-${{ github.sha }}
          path: /tmp/exp279-v10-cross/train60
      - uses: actions/download-artifact@v4
        with:
          name: exp279-v10-budget-120-${{ github.sha }}
          path: /tmp/exp279-v10-cross/train120
      - name: Verify budgets and classify cross-budget court
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from nolane_ai.experiments.exp279_counterfactual_representation_identifiability_v10_receipts import canonical_receipt_bytes, validate_budget_receipt

          for label in ("train60", "train120"):
              receipt = Path(f"/tmp/exp279-v10-cross/{label}/receipt.json")
              payload = receipt.read_bytes()
              assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8").strip() == hashlib.sha256(payload).hexdigest()
              data = json.loads(payload.decode("utf-8"))
              assert payload == canonical_receipt_bytes(data)
              validate_budget_receipt(data)
          PY
          WORK=/tmp/exp279-v10-cross/final
          mkdir -p "$WORK"
          python scripts/classify_exp279_counterfactual_representation_identifiability_v10_dev.py \
            --train60 /tmp/exp279-v10-cross/train60/receipt.json \
            --train120 /tmp/exp279-v10-cross/train120/receipt.json \
            --output "$WORK/receipt.json"
      - name: Verify final receipt, sidecar, and closed boundaries
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from nolane_ai.experiments.exp279_counterfactual_representation_identifiability_v10_receipts import canonical_receipt_bytes, validate_cross_receipt

          receipt = Path("/tmp/exp279-v10-cross/final/receipt.json")
          payload = receipt.read_bytes()
          assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8").strip() == hashlib.sha256(payload).hexdigest()
          data = json.loads(payload.decode("utf-8"))
          assert payload == canonical_receipt_bytes(data)
          validate_cross_receipt(data)
          assert data["mechanism_successor_authorized"] is False
          assert data["evaluation_rng_used"] is False
          assert data["evaluation_lineage_consumed"] is False
          assert data["confirmatory_data_consumed"] is False
          assert data["challenge_materialized"] is False
          assert data["promotion_claimed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp279-v10-cross-cell-${{ github.sha }}
          path: /tmp/exp279-v10-cross/final
          if-no-files-found: error
          retention-days: 90
