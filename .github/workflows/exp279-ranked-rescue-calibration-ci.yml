name: exp279-ranked-rescue-calibration-ci

on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp279_ranked_rescue_calibration.py"
      - "tests/test_exp279_ranked_rescue_calibration.py"
      - ".github/workflows/exp279-ranked-rescue-calibration-ci.yml"
      - "protocols/stage-a-confirmatory-v1.json"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - run: pytest -q tests/test_exp279_ranked_rescue_calibration.py
      - run: python scripts/verify_protocol.py
      - run: python -m compileall -q src scripts
