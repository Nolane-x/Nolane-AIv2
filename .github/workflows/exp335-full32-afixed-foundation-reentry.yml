          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-335 chunk 4 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk3.outputs.artifact_digest }}"
          python frozen/scripts/exp335_run_chunk.py --chunk-index 4 \
