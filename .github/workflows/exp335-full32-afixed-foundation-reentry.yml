            --execution-identity identity/exp335_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk0.outputs.artifact_digest }}" \
            --output-dir evidence/chunk1 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp335-chunk-1-${{ github.run_id }}
          path: evidence/chunk1
          if-no-files-found: error
