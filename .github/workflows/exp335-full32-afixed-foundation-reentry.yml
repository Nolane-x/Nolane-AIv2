      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Finalize preregistered reducer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp335_finalize.py \
            --execution-identity identity/exp335_execution_identity_v1.json \
            --parent-exp334 exp334-parent/exp334-final.json \
            --chunk-dir chunks/0 --chunk-dir chunks/1 --chunk-dir chunks/2 --chunk-dir chunks/3 \
            --chunk-dir chunks/4 --chunk-dir chunks/5 --chunk-dir chunks/6 --chunk-dir chunks/7 \
            --chunk-artifact-digest "${{ needs.chunk0.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk1.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk2.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk3.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk4.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk5.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk6.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk7.outputs.artifact_digest }}" \
            --output evidence/exp335-final.json
      - name: Fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/exp335-final.json").read_text())
          allowed={
            "INVALID_FULL32_FOUNDATION_REENTRY",
            "PARENT_AUTHORITY_MISMATCH",
            "SHAM_FULL32_MISMATCH",
            "AFIXED_FULL32_FOUNDATION_REENTERED_BOTH",
            "AFIXED_FULL32_FOUNDATION_REENTERED_CONTROL_ONLY_PROJECT_REGRESSION",
            "BASELINE_FULL32_FAILURE_WITHOUT_SUBSPACE_TRIGGER",
            "AFIXED_FULL32_FOUNDATION_REENTRY_RESCUED_NO_REGRESSION",
            "AFIXED_FULL32_FOUNDATION_REENTRY_NOT_ESTABLISHED",
          }
          if p.get("decision") not in allowed: raise SystemExit("unknown EXP-335 reducer state")
          for key in ("exp302_implementation_authorized","exp320_implementation_authorized","scale_authorized","authorized_30m","authorized_100m"):
              if p.get(key) is not False: raise SystemExit(f"forbidden authorization {key}")
          print("EXP-335 disposition:",p["decision"])
          print("evidence digest:",p["evidence_digest"])
          print("CONTROL failed worlds:",p["control_failed_worlds"])
          print("PROJECT failed worlds:",p["project_failed_worlds"])
