name: exp321-seal-helper

on:
  push:
    branches:
      - exp321-seal-helper-05918dee
    paths:
      - ".github/workflows/exp321-seal-helper.yml"

permissions:
  contents: read
  actions: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source tooling
        run: python -m pip install -e '.[dev]'
      - name: Materialize exact EXP-321 marker bytes
        env:
          SOURCE_SHA: 05918dee112e5672837fc94b04a0ad8fd7c920b7
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from nolane_ai.experiments.exp321_freeze import (
              build_exp321_identity_from_git,
              canonical_marker_json_bytes,
              marker_sidecar_bytes,
              validate_frozen_changed_paths,
              EXP321_BASE_SHA,
          )
          from nolane_ai.experiments.exp321_identity import (
              validate_exp321_execution_identity,
          )
          import subprocess

          source = os.environ["SOURCE_SHA"]
          base = EXP321_BASE_SHA
          merge_base = subprocess.check_output(
              ["git", "merge-base", base, source], text=True
          ).strip()
          if merge_base != base:
              raise SystemExit("source is not descended from frozen PR87 base")
          changed = tuple(
              line for line in subprocess.check_output(
                  ["git", "diff", "--name-only", base, source], text=True
              ).splitlines() if line
          )
          validate_frozen_changed_paths(changed)
          identity = build_exp321_identity_from_git(".", source)
          validate_exp321_execution_identity(identity)
          marker = canonical_marker_json_bytes(identity).decode("utf-8")
          sidecar = marker_sidecar_bytes(identity).decode("ascii")
          print("EXP321_MARKER_JSON_BEGIN")
          print(marker, end="")
          print("EXP321_MARKER_JSON_END")
          print("EXP321_MARKER_SIDECAR_BEGIN")
          print(sidecar, end="")
          print("EXP321_MARKER_SIDECAR_END")
          print(f"EXP321_SOURCE_SHA={identity.source_commit_sha}")
          print(f"EXP321_SOURCE_TREE_DIGEST={identity.source_tree_digest}")
          print(f"EXP321_WORKFLOW_SHA256={identity.workflow_sha256}")
          print(f"EXP321_EXECUTION_DIGEST={identity.exp321_execution_digest}")
          PY

      - name: Verify exact marker-only commit
        env:
          SOURCE_SHA: 05918dee112e5672837fc94b04a0ad8fd7c920b7
          MARKER_SHA: a2f1004206aeffb37c327fcd909f0c1564e67045
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$MARKER_SHA" --depth=100
          rm -rf /tmp/exp321-marker
          git worktree add --detach /tmp/exp321-marker "$MARKER_SHA"
          python /tmp/exp321-marker/scripts/verify_exp321_freeze.py \
            --repo-root /tmp/exp321-marker \
            --source-commit-sha "$SOURCE_SHA" \
            --marker-json /tmp/exp321-marker/protocols/v017/exp321_execution_identity_v1.json \
            --marker-sha256 /tmp/exp321-marker/protocols/v017/exp321_execution_identity_v1.sha256
          echo "EXP321_MARKER_VERIFIED=$MARKER_SHA"

      - name: Dispatch authoritative sealed EXP-321 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error \
              --output /tmp/dispatch-body \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Nolane-x/Nolane-AIv2/actions/workflows/exp321-afixed-failure-localization.yml/dispatches" \
              --data '{"ref":"exp321-afixed-failure-localization-design"}'
          )"
          cat /tmp/dispatch-body || true
          test "$status" = "204"
          echo "EXP321_WORKFLOW_DISPATCHED=1"
