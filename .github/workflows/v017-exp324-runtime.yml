name: v017-exp324-runtime

on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp324_*.py"
      - "scripts/exp324_*.py"
      - "tests/test_exp324_*.py"
      - ".github/workflows/v017-exp324-runtime.yml"
      - ".github/workflows/exp324-family-isolated-learnability.yml"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install numpy
          python -m pip install -e '.[dev,model]'
      - run: pytest -q tests/test_exp324_*.py
      - run: python -m compileall -q src scripts
