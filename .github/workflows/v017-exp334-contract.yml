name: v017-exp334-contract
on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp334_*"
      - "scripts/exp334_run.py"
      - "protocols/v017/exp334_*"
      - "tests/test_exp334_*"
      - ".github/workflows/exp334-*"
      - ".github/workflows/v017-exp334-contract.yml"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_exp334_contract.py tests/test_exp334_runtime_surface.py tests/test_exp334_workflow.py
