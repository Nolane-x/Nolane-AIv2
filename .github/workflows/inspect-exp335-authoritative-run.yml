name: inspect-exp335-authoritative-run

on:
  push:
    branches: [exp335-authoritative-dispatch-helper]
    paths:
      - .github/workflows/inspect-exp335-authoritative-run.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve authoritative EXP-335 run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          headers={
            "Authorization":f"Bearer {token}",
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "User-Agent":"exp335-inspector",
          }
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req) as r:
              return json.load(r)
          runs=get(f"https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&branch=exp335-full32-afixed-foundation-reentry-design&per_page=100")
          matches=[r for r in runs.get("workflow_runs",[]) if r.get("path")==".github/workflows/exp335-full32-afixed-foundation-reentry.yml"]
          if not matches:
            raise SystemExit("no authoritative EXP-335 workflow_dispatch run found")
          run=max(matches,key=lambda r:r["id"])
          jobs=get(run["jobs_url"])
          print("EXP335_RUN_ID="+str(run["id"]))
          print("EXP335_STATUS="+str(run["status"]))
          print("EXP335_CONCLUSION="+str(run.get("conclusion")))
          print("EXP335_URL="+str(run["html_url"]))
          print("EXP335_HEAD_SHA="+str(run["head_sha"]))
          print("EXP335_CREATED_AT="+str(run["created_at"]))
          print("EXP335_UPDATED_AT="+str(run["updated_at"]))
          for job in jobs.get("jobs",[]):
            print("JOB="+json.dumps({
              "id":job.get("id"),
              "name":job.get("name"),
              "status":job.get("status"),
              "conclusion":job.get("conclusion"),
              "started_at":job.get("started_at"),
              "completed_at":job.get("completed_at"),
            },sort_keys=True))
          PY
