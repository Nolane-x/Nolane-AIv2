name: EXP-323R reducer recovery

on:
  pull_request:
    paths:
      - ".github/workflows/exp323r-reducer-recovery.yml"
      - "docs/superpowers/specs/2026-09-18-exp323r-reducer-recovery.md"

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact sealed marker
        uses: actions/checkout@v4
        with:
          ref: 217477a911aabbb764741e76cca38e54013e7da6
          fetch-depth: 0
          path: marker

      - name: Checkout exact frozen source
        uses: actions/checkout@v4
        with:
          ref: 471d211e15b4840d06536e9b2edbc404958612b2
          fetch-depth: 1
          path: frozen

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify sealed source and marker
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/verify_exp323r_freeze.py \
            --repo-root marker \
            --source-commit-sha 471d211e15b4840d06536e9b2edbc404958612b2 \
            --marker-json marker/protocols/v017/exp323r_execution_identity_v1.json \
            --marker-sha256 marker/protocols/v017/exp323r_execution_identity_v1.sha256

      - name: Verify immutable arm artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          checks = (
              (
                  10551422072,
                  "exp323r-HOLD_5E5-35354410137",
                  "sha256:c71ff48acfe7de3e3b6a96b7a967e391a7746948385e707efaaf1b3598b12093",
              ),
              (
                  10551321837,
                  "exp323r-DECAY_2P5E5-35354410137",
                  "sha256:eda5e2fb46ecbe6b7e1bc6c8b6a3f014bfe4c72df31fad9e96d121163b516708",
              ),
          )
          url = "https://api.github.com/repos/%s/actions/runs/35354410137/artifacts" % repo
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp323r-reducer-recovery",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          by_id = {int(a["id"]): a for a in payload["artifacts"]}
          for artifact_id, name, digest in checks:
              artifact = by_id.get(artifact_id)
              if artifact is None:
                  raise SystemExit(f"missing artifact {artifact_id}")
              if artifact["name"] != name or artifact.get("expired") is not False:
                  raise SystemExit(f"artifact metadata mismatch: {artifact_id}")
              if artifact.get("digest") != digest:
                  raise SystemExit(f"artifact digest mismatch: {artifact_id}")
          PY

      - name: Download immutable HOLD evidence
        uses: actions/download-artifact@v4
        with:
          name: exp323r-HOLD_5E5-35354410137
          path: hold
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35354410137

      - name: Download immutable DECAY evidence
        uses: actions/download-artifact@v4
        with:
          name: exp323r-DECAY_2P5E5-35354410137
          path: decay
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35354410137

      - name: Install exact frozen reducer runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Run unchanged frozen reducer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp323r_reduce.py \
            --hold hold/evidence.json \
            --decay decay/evidence.json \
            --output evidence/exp323r-final.json

      - name: Verify recovered final evidence is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("evidence/exp323r-final.json").read_text(encoding="utf-8"))
          for key in (
              "exp302_implementation_authorized",
              "exp320_implementation_authorized",
              "scale_authorized",
              "authorized_30m",
              "authorized_100m",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"forbidden authorization: {key}")
          if p.get("schema") != "EXP323R-FINAL-EVIDENCE-V1":
              raise SystemExit("EXP-323R final schema mismatch")
          print("EXP-323R recovered disposition:", p["decision"])
          print("EXP-323R recovered evidence digest:", p["evidence_digest"])
          PY

      - name: Upload recovered final evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp323r-final-recovered-run-35354410137
          path: evidence/exp323r-final.json
          if-no-files-found: error
          retention-days: 90
