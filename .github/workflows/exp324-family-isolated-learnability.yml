name: EXP-324 family-isolated learnability

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  family:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family:
          - algorithmic-sequence-transform
          - generator-heldout-abstract-transformation
          - iterative-grid-and-maze
          - language-sequence-control
    steps:
      - name: Checkout sealed marker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker

      - name: Resolve frozen source identity
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("marker/protocols/v017/exp324_execution_identity_v1.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"source_sha={p['source_commit_sha']}\n")
              out.write(f"workflow_sha256={p['workflow_sha256']}\n")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum frozen/.github/workflows/exp324-family-isolated-learnability.yml | awk '{print $1}')" = "${{ steps.identity.outputs.workflow_sha256 }}"
          python - <<'PY'
          import json,os,urllib.request
          repo="Nolane-x/Nolane-AIv2"
          checks=(
            (35356470634,10552276255,"exp323r-final-recovered-run-35354410137","sha256:7155d72ab05b57f8b66284f83ed41e63057824a3288adcd27e2d5429f3e0a19c"),
            (35345351869,10547681681,"exp323r-reconstruction-candidate-35345351869-0","sha256:c0862235302243e6d9ef689ea6ef7214431ce44f41575aea12954524ad1ac621"),
          )
          for run_id,aid,name,digest in checks:
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"exp324"})
              with urllib.request.urlopen(req) as r: payload=json.load(r)
              matches=[x for x in payload["artifacts"] if int(x["id"])==aid]
              if len(matches)!=1: raise SystemExit(f"artifact missing: {aid}")
              x=matches[0]
              if x["name"]!=name or x.get("expired") is not False or x.get("digest")!=digest: raise SystemExit(f"artifact metadata mismatch: {aid}")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: exp323r-reconstruction-candidate-35345351869-0
          path: reconstruction
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35345351869

      - uses: actions/download-artifact@v4
        with:
          name: exp323r-final-recovered-run-35354410137
          path: parent-final
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35356470634

      - name: Verify reconstruction bytes
        shell: bash
        run: |
          test "$(sha256sum reconstruction/reconstruction.pt | awk '{print $1}')" = "4aa03459b5266a3455bcfbc8cb070d9ceaeb0e7b8390944e7d483b0953e567c5"
          test "$(sha256sum reconstruction/reconstruction-receipt.json | awk '{print $1}')" = "617ba665149a366d00782df5c4457a6a3d01081fe847aa144465377ee164bba3"

      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Run isolated family arm
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          mkdir -p "arm-${{ matrix.family }}"
          python frozen/scripts/exp324_run_family.py \
            --reconstruction-checkpoint reconstruction/reconstruction.pt \
            --reconstruction-receipt reconstruction/reconstruction-receipt.json \
            --selection-lock frozen/protocols/v017/exp323r_reconstruction_selection_lock_v1.json \
            --parent-final parent-final/exp323r-final.json \
            --family "${{ matrix.family }}" \
            --execution-identity marker/protocols/v017/exp324_execution_identity_v1.json \
            --output "arm-${{ matrix.family }}/evidence.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exp324-${{ matrix.family }}-${{ github.run_id }}
          path: arm-${{ matrix.family }}/evidence.json
          if-no-files-found: error
          retention-days: 90

  reduce:
    needs: family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker
      - name: Resolve source
        id: identity
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("marker/protocols/v017/exp324_execution_identity_v1.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"source_sha={p['source_commit_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: exp324-algorithmic-sequence-transform-${{ github.run_id }}
          path: a0
      - uses: actions/download-artifact@v4
        with:
          name: exp324-generator-heldout-abstract-transformation-${{ github.run_id }}
          path: a1
      - uses: actions/download-artifact@v4
        with:
          name: exp324-iterative-grid-and-maze-${{ github.run_id }}
          path: a2
      - uses: actions/download-artifact@v4
        with:
          name: exp324-language-sequence-control-${{ github.run_id }}
          path: a3
      - run: python -m pip install -e './frozen[dev,model]'
      - name: Reduce family evidence
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp324_reduce.py \
            --arm-0 a0/evidence.json --arm-1 a1/evidence.json \
            --arm-2 a2/evidence.json --arm-3 a3/evidence.json \
            --output evidence/exp324-final.json
      - name: Fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/exp324-final.json").read_text())
          for k in ("exp302_implementation_authorized","exp320_implementation_authorized","scale_authorized","authorized_30m","authorized_100m"):
              if p.get(k) is not False: raise SystemExit(f"forbidden authorization: {k}")
          print("EXP-324 disposition:",p["decision"])
          print("EXP-324 evidence digest:",p["evidence_digest"])
          print("EXP-324 passed families:",p["passed_families"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp324-family-isolated-final-${{ github.run_id }}
          path: evidence/exp324-final.json
          if-no-files-found: error
          retention-days: 90
