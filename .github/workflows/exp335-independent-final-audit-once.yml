name: EXP-335 independent final audit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/exp335-independent-final-audit-once.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUTHORITATIVE_RUN_ID: "35445927525"
      AUTHORITATIVE_HEAD_SHA: "57fdf3a38b42b41951639a35dbb3c0d82055846b"
      FROZEN_AUDITOR_SHA: "bb629e90fd7dc0755b3f60842bba6bc0aa846d03"
    steps:
      - name: Checkout frozen independent auditor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_AUDITOR_SHA }}
          path: auditor
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify authoritative run and download raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-input
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from zipfile import ZipFile

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["AUTHORITATIVE_RUN_ID"])
          expected_head = os.environ["AUTHORITATIVE_HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "exp335-frozen-final-audit",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          run = get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit(f"authoritative run not successful: {run.get('status')} / {run.get('conclusion')}")
          if run.get("head_sha") != expected_head:
              raise SystemExit("authoritative sealed head mismatch")
          if int(run.get("run_attempt", 0)) != 1:
              raise SystemExit("authoritative run attempt drift")

          listing = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          )
          by_name = {item["name"]: item for item in listing.get("artifacts", [])}
          expected_names = [
              f"exp335-identity-{run_id}",
              *[f"exp335-chunk-{i}-{run_id}" for i in range(8)],
              f"exp335-full32-foundation-reentry-final-{run_id}",
          ]
          missing = [name for name in expected_names if name not in by_name]
          if missing:
              raise SystemExit(f"missing authoritative artifacts: {missing}")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def download_artifact(name, destination):
              artifact = by_name[name]
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip",
                  headers=headers,
              )
              try:
                  opener.open(request)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get("Location")
              else:
                  raise RuntimeError("artifact endpoint unexpectedly did not redirect")
              if not location:
                  raise RuntimeError(f"artifact {artifact['id']} missing redirect Location")
              req = urllib.request.Request(
                  location,
                  headers={"User-Agent": "exp335-frozen-final-audit"},
              )
              with urllib.request.urlopen(req) as response:
                  payload = response.read()
              observed = hashlib.sha256(payload).hexdigest()
              expected = str(artifact["digest"])
              if expected.startswith("sha256:"):
                  expected = expected[7:]
              if observed != expected:
                  raise SystemExit(f"raw artifact digest mismatch for {name}: {observed} != {expected}")
              Path(destination).write_bytes(payload)
              return {
                  "artifact_id": artifact["id"],
                  "name": name,
                  "sha256": observed,
                  "size_in_bytes": artifact["size_in_bytes"],
                  "created_at": artifact["created_at"],
              }

          manifest = {}
          identity_name = f"exp335-identity-{run_id}"
          manifest[identity_name] = download_artifact(identity_name, "audit-input/identity.zip")

          for i in range(8):
              name = f"exp335-chunk-{i}-{run_id}"
              manifest[name] = download_artifact(name, f"audit-input/chunk{i}.zip")

          final_name = f"exp335-full32-foundation-reentry-final-{run_id}"
          manifest[final_name] = download_artifact(final_name, "audit-input/final.zip")

          with ZipFile("audit-input/identity.zip") as archive:
              members = [n for n in archive.namelist() if n.endswith("exp335_execution_identity_v1.json")]
              if len(members) != 1:
                  raise SystemExit(f"unexpected identity members: {archive.namelist()}")
              artifact_identity = json.loads(archive.read(members[0]))
          frozen_identity = json.loads(
              Path("auditor/protocols/v017/exp335_execution_identity_v1.json").read_text(encoding="utf-8")
          )
          if artifact_identity != frozen_identity:
              raise SystemExit("identity artifact differs from frozen auditor identity")

          with ZipFile("audit-input/final.zip") as archive:
              members = [n for n in archive.namelist() if n.endswith("exp335-final.json")]
              if len(members) != 1:
                  raise SystemExit(f"unexpected final members: {archive.namelist()}")
              Path("audit-input/exp335-final.json").write_bytes(archive.read(members[0]))

          Path("audit-input/github-artifact-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY

      - name: Run frozen independent 8-chunk and final verifier
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=auditor/src python auditor/scripts/exp335_audit_chain.py \
            --execution-identity auditor/protocols/v017/exp335_execution_identity_v1.json \
            --chunk-zip audit-input/chunk0.zip \
            --chunk-zip audit-input/chunk1.zip \
            --chunk-zip audit-input/chunk2.zip \
            --chunk-zip audit-input/chunk3.zip \
            --chunk-zip audit-input/chunk4.zip \
            --chunk-zip audit-input/chunk5.zip \
            --chunk-zip audit-input/chunk6.zip \
            --chunk-zip audit-input/chunk7.zip \
            --final-json audit-input/exp335-final.json \
            --output audit-input/exp335-independent-final-audit.json

      - name: Materialize independently verified receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path("audit-input/exp335-independent-final-audit.json")
          final_path = Path("audit-input/exp335-final.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          final = json.loads(final_path.read_text(encoding="utf-8"))
          manifest = json.loads(
              Path("audit-input/github-artifact-manifest.json").read_text(encoding="utf-8")
          )

          if report["chain"]["verified_chunk_count"] != 8:
              raise SystemExit("independent audit did not verify 8 chunks")
          if report["chain"]["complete_chunk_chain"] is not True:
              raise SystemExit("independent audit chain incomplete")
          if final.get("evidence_digest") != report["final"]["evidence_digest"]:
              raise SystemExit("independent evidence digest mismatch")
          if final.get("decision") != report["final"]["decision"]:
              raise SystemExit("independent reducer decision mismatch")
          if any(v is not False for v in report["final"]["authorization_flags"].values()):
              raise SystemExit("forbidden authorization drift")

          receipt = {
              "schema": "EXP335-FROZEN-INDEPENDENT-FINAL-AUDIT-RECEIPT-V1",
              "authoritative_run_id": int(os.environ["AUTHORITATIVE_RUN_ID"]),
              "authoritative_head_sha": os.environ["AUTHORITATIVE_HEAD_SHA"],
              "frozen_auditor_sha": os.environ["FROZEN_AUDITOR_SHA"],
              "decision": report["final"]["decision"],
              "evidence_digest": report["final"]["evidence_digest"],
              "final_json_sha256": hashlib.sha256(final_path.read_bytes()).hexdigest(),
              "independent_audit_report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "verified_chunk_count": 8,
              "complete_chunk_chain": True,
              "control_sham_exact_by_chunk": report["final"]["control_sham_exact_by_chunk"],
              "chunk_artifact_digests": report["final"]["chunk_artifact_digests"],
              "chunk_bundle_digests": report["final"]["chunk_bundle_digests"],
              "reducer_vectors": report["final"]["reducer_vectors"],
              "authorization_flags": report["final"]["authorization_flags"],
              "github_artifacts": manifest,
          }
          receipt_path = Path("audit-input/exp335-frozen-independent-final-audit-receipt.json")
          receipt_path.write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True, indent=2))
          print("receipt_sha256", hashlib.sha256(receipt_path.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: exp335-frozen-independent-final-audit-35445927525
          path: |
            audit-input/exp335-independent-final-audit.json
            audit-input/exp335-frozen-independent-final-audit-receipt.json
            audit-input/github-artifact-manifest.json
            audit-input/exp335-final.json
          if-no-files-found: error
          retention-days: 90

      - name: Record verified closure receipt on PR 110
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          r=json.loads(
              Path("audit-input/exp335-frozen-independent-final-audit-receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          print("EXP-335 frozen independent final audit: **SUCCESS**")
          print()
          print(f"- authoritative run: `{r['authoritative_run_id']}`")
          print(f"- sealed head: `{r['authoritative_head_sha']}`")
          print(f"- frozen auditor: `{r['frozen_auditor_sha']}`")
          print(f"- disposition: **`{r['decision']}`**")
          print(f"- evidence digest: `{r['evidence_digest']}`")
          print(f"- final JSON SHA-256: `{r['final_json_sha256']}`")
          print(f"- independent report SHA-256: `{r['independent_audit_report_sha256']}`")
          print(f"- audit artifact ID: `{os.environ['AUDIT_ARTIFACT_ID']}`")
          print("- verified chunks: `8/8`")
          print("- CONTROL/SHAM exact in every chunk: `true`")
          print()
          print("This receipt was produced by the pre-final frozen auditor after raw GitHub ZIP")
          print("digest verification, full artifact-chain verification, chunk7 boundary binding,")
          print("independent `reduce_full32` recomputation, and independent evidence-digest recomputation.")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/110/comments" -F body=@/tmp/comment.md
