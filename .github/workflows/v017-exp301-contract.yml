name: v017-exp301-contract

on:
  pull_request:
    paths:
      - "src/nolane_ai/model/v017_recursive.py"
      - "src/nolane_ai/experiments/exp301_*.py"
      - "src/nolane_ai/protocol/v017.py"
      - "src/nolane_ai/model/budget.py"
      - "protocols/v017/**"
      - "tests/test_v017_*.py"
      - "tests/test_exp301_*.py"
      - ".github/workflows/v017-exp301-contract.yml"
  workflow_dispatch:

concurrency:
  group: v017-exp301-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - run: >-
          pytest -q
          tests/test_v017_budget.py
          tests/test_exp301_protocol.py
          tests/test_v017_recursive_model.py
          tests/test_exp301_arms.py
      - run: python -m compileall -q src
