name: exp279-confirmatory-ci

on:
  pull_request:
    paths:
      - '.github/workflows/exp279-confirmatory-ci.yml'
      - 'protocols/stage_a_v1.json'
      - 'protocols/stage_a_v1.sha256'
      - 'src/nolane_ai/experiments/exp279_*.py'
      - 'src/nolane_ai/experiments/matched_routing_arms.py'
      - 'scripts/*exp279*.py'
      - 'tests/test_exp279_*.py'
      - 'tests/test_matched_routing_arms.py'
  push:
    branches: [exp279-confirmatory-gate-a]
    paths:
      - '.github/workflows/exp279-confirmatory-ci.yml'
      - 'protocols/stage_a_v1.json'
      - 'protocols/stage_a_v1.sha256'
      - 'src/nolane_ai/experiments/exp279_*.py'
      - 'src/nolane_ai/experiments/matched_routing_arms.py'
      - 'scripts/*exp279*.py'
      - 'tests/test_exp279_*.py'
      - 'tests/test_matched_routing_arms.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Run EXP-279 focused contract
        run: pytest -q tests/test_exp279_*.py tests/test_matched_routing_arms.py
      - run: python scripts/verify_protocol.py
      - run: python -m compileall -q src scripts
