name: exp319r-stage-a-finalization-recovery

on:
  push:
    branches:
      - exp319r-stage-a-finalization-recovery-source
    paths:
      - .github/workflows/exp319r-stage-a-finalization-recovery.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  recover-stage-a-finalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery lineage
        uses: actions/checkout@v4
        with:
          path: recovery

      - name: Checkout sealed repaired marker
        uses: actions/checkout@v4
        with:
          ref: 124584061616ab0864355219645ed00c1298c575
          path: marker
          fetch-depth: 2

      - name: Checkout exact frozen scientific source
        uses: actions/checkout@v4
        with:
          ref: 2002a42322c7b919c3c9dc3da7d9cb0f546d4431
          path: frozen
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify marker, source parent, and frozen workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/marker/src"
          python marker/scripts/verify_exp319_freeze.py \
            --repo-root marker \
            --source-commit-sha 2002a42322c7b919c3c9dc3da7d9cb0f546d4431 \
            --marker-json marker/protocols/v017/exp319_execution_identity_v1.json \
            --marker-sha256 marker/protocols/v017/exp319_execution_identity_v1.sha256
          test "$(sha256sum frozen/.github/workflows/exp319-learnability-foundation-diagnostic.yml | awk '{print $1}')" = "72b84f2fe32a7ded194b98620ac7e7701e0d18fdbb683aa4b3759145c268e237"
          test "$(git -C marker rev-parse HEAD^)" = "2002a42322c7b919c3c9dc3da7d9cb0f546d4431"

      - name: Verify immutable source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery-out
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          run_id = 35311529822
          expected_id = 10533822077
          expected_name = "exp319-stage-a-selection"
          expected_digest = "sha256:ee65f07a5f63c5b7f472eba5aea5ab17a624697138c23266d515810024bfb559"
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?"
              + urllib.parse.urlencode({"name": expected_name})
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp319r-stage-a-finalization-recovery",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          matches = [a for a in payload["artifacts"] if int(a["id"]) == expected_id]
          if len(matches) != 1:
              raise SystemExit(f"expected artifact id {expected_id} exactly once, found {len(matches)}")
          artifact = matches[0]
          if artifact["name"] != expected_name:
              raise SystemExit("Stage-A selection artifact name mismatch")
          if artifact.get("expired") is not False:
              raise SystemExit("Stage-A selection artifact is expired")
          if artifact.get("digest") != expected_digest:
              raise SystemExit(
                  f"Stage-A selection artifact digest mismatch: {artifact.get('digest')!r}"
              )
          Path("recovery-out/source-artifact-metadata.json").write_text(
              json.dumps(artifact, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Download only the sealed Stage-A selection from authoritative run
        uses: actions/download-artifact@v4
        with:
          name: exp319-stage-a-selection
          path: recovered-input
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35311529822

      - name: Install exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Reconstruct only the frozen Stage-A-stop root evidence
        env:
          SOURCE_DIGEST: ca4970a96b9eb9cb2a9b895683b8f623160b1d134e25e0e91ace6172c38b18a6
          TRAINING_DIGEST: cd2997f1899e21d3eee6f59e968bb4313db1d439258b6575d32357fe6c53a4e1
          SCORING_DIGEST: 13c6d3520330457135bd167a7f8c14806bc27ef3d445e1511c4adbeb0be4b0c1
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python - <<'PY'
          from dataclasses import asdict
          import hashlib
          import json
          import os
          from pathlib import Path

          from nolane_ai.experiments.exp319_contract import canonical_json_bytes
          from nolane_ai.experiments.exp319_evidence import StageASelectionSeal, _seal_root_evidence

          source = Path("recovered-input/stage-a-selection.json")
          raw = json.loads(source.read_text(encoding="utf-8"))
          if raw.get("schema") != "EXP319-STAGE-A-SELECTION-AUTHORITY-V1":
              raise SystemExit("unexpected Stage-A selection schema")
          by_arm = {item["arm_id"]: item for item in raw["selections"]}
          if set(by_arm) != {"A_FIXED", "B_LOOP_SIMPLE", "C_NRS_CORE"}:
              raise SystemExit("unexpected Stage-A selection arm coverage")

          primary = []
          for arm_id in ("A_FIXED", "C_NRS_CORE"):
              item = by_arm[arm_id]
              primary.append(
                  StageASelectionSeal(
                      arm_id=arm_id,
                      passes_floor=bool(item["passes_floor"]),
                      selected_learning_rate=float(item["selected_learning_rate"]),
                      selection_digest=str(item["selection_digest"]),
                  )
              )

          proceed = all(item.passes_floor for item in primary)
          if proceed:
              raise SystemExit("recovery is invalid because frozen Stage A does not stop")

          sentinel = hashlib.sha256(
              canonical_json_bytes(
                  {
                      "schema": "EXP319-STAGE-B-NOT-RUN-V1",
                      "reason": "frozen-stage-a-stop",
                  }
              )
          ).hexdigest()

          target = Path("recovery-out/stage-a-stop")
          target.mkdir(parents=True)
          for root in (1, 2, 3, 4):
              evidence = _seal_root_evidence(
                  root=root,
                  provenance_valid=True,
                  source_digest=os.environ["SOURCE_DIGEST"],
                  training_contract_digest=os.environ["TRAINING_DIGEST"],
                  scoring_contract_digest=os.environ["SCORING_DIGEST"],
                  stage_a_selections=tuple(primary),
                  stage_b_selection_authority_digest=sentinel,
                  stage_b_control_pass=False,
                  stage_b_nrs_pass=False,
                  stage_c_manifest_digest=None,
                  stage_c_commitment_grid_digest=None,
                  stage_c_scoring_digest=None,
                  stage_c_control_pass=None,
                  stage_c_nrs_pass=None,
              )
              (target / f"root-{root}.json").write_text(
                  json.dumps(asdict(evidence), sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )

          Path("recovery-out/source-stage-a-selection.json").write_bytes(source.read_bytes())
          PY

      - name: Run the unchanged frozen EXP-319 finalizer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp319_finalize.py \
            --root-evidence \
            recovery-out/stage-a-stop/root-1.json \
            recovery-out/stage-a-stop/root-2.json \
            recovery-out/stage-a-stop/root-3.json \
            recovery-out/stage-a-stop/root-4.json \
            --output recovery-out/final.json

      - name: Independently verify and seal recovery receipt
        env:
          SOURCE_RUN_ID: "35311529822"
          SOURCE_JOB_ID: "105499052525"
          SOURCE_ARTIFACT_ID: "10533822077"
          SOURCE_ARTIFACT_DIGEST: "sha256:ee65f07a5f63c5b7f472eba5aea5ab17a624697138c23266d515810024bfb559"
          SOURCE_MARKER: "124584061616ab0864355219645ed00c1298c575"
          SOURCE_COMMIT: "2002a42322c7b919c3c9dc3da7d9cb0f546d4431"
          SOURCE_TREE_DIGEST: "ca4970a96b9eb9cb2a9b895683b8f623160b1d134e25e0e91ace6172c38b18a6"
          SOURCE_WORKFLOW_SHA256: "72b84f2fe32a7ded194b98620ac7e7701e0d18fdbb683aa4b3759145c268e237"
          TRAINING_DIGEST: "cd2997f1899e21d3eee6f59e968bb4313db1d439258b6575d32357fe6c53a4e1"
          SCORING_DIGEST: "13c6d3520330457135bd167a7f8c14806bc27ef3d445e1511c4adbeb0be4b0c1"
          EXECUTION_DIGEST: "675655dfec9499ac8c49f3429771d1c5456e7ee652a3d7f309117bbc8691c9ba"
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical(payload):
              return json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode("utf-8")

          final_path = Path("recovery-out/final.json")
          final = json.loads(final_path.read_text(encoding="utf-8"))
          claimed = final["evidence_digest"]
          unsigned = dict(final)
          unsigned.pop("evidence_digest")
          reproduced = hashlib.sha256(canonical(unsigned)).hexdigest()
          if claimed != reproduced:
              raise SystemExit("final evidence digest does not reproduce")
          if final.get("roots") != [1, 2, 3, 4]:
              raise SystemExit("final roots mismatch")
          if int(final.get("stage_b_control_pass_roots", -1)) != 0:
              raise SystemExit("Stage-B control pass count must remain zero after Stage-A stop")
          if int(final.get("stage_b_nrs_pass_roots", -1)) != 0:
              raise SystemExit("Stage-B NRS pass count must remain zero after Stage-A stop")
          if final.get("stage_c_control_pass_roots") is not None or final.get("stage_c_nrs_pass_roots") is not None:
              raise SystemExit("Stage-C evidence must remain absent after Stage-A stop")
          if any(bool(value) for value in final["authorizations"].values()):
              raise SystemExit("frozen finalizer emitted forbidden authorization")
          for key in (
              "exp302_implementation_authorized",
              "exp320_implementation_authorized",
              "scale_authorized",
              "authorized_30m",
              "authorized_100m",
          ):
              if final.get(key) is not False:
                  raise SystemExit(f"forbidden authorization field {key} is not false")

          selection = json.loads(
              Path("recovery-out/source-stage-a-selection.json").read_text(encoding="utf-8")
          )
          selected_primary = {
              item["arm_id"]: (
                  bool(item["passes_floor"]),
                  float(item["selected_learning_rate"]),
                  str(item["selection_digest"]),
              )
              for item in selection["selections"]
              if item["arm_id"] in {"A_FIXED", "C_NRS_CORE"}
          }
          if set(selected_primary) != {"A_FIXED", "C_NRS_CORE"}:
              raise SystemExit("primary Stage-A seal coverage mismatch")

          root_digests = {}
          for root in (1, 2, 3, 4):
              path = Path(f"recovery-out/stage-a-stop/root-{root}.json")
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload["root"] != root or payload["provenance_valid"] is not True:
                  raise SystemExit(f"root-{root} provenance mismatch")
              if payload["source_digest"] != os.environ["SOURCE_TREE_DIGEST"]:
                  raise SystemExit(f"root-{root} source digest mismatch")
              if payload["training_contract_digest"] != os.environ["TRAINING_DIGEST"]:
                  raise SystemExit(f"root-{root} training digest mismatch")
              if payload["scoring_contract_digest"] != os.environ["SCORING_DIGEST"]:
                  raise SystemExit(f"root-{root} scoring digest mismatch")
              if payload["stage_b_control_pass"] is not False or payload["stage_b_nrs_pass"] is not False:
                  raise SystemExit(f"root-{root} Stage-B flags mismatch")
              for key in (
                  "stage_c_manifest_digest",
                  "stage_c_commitment_grid_digest",
                  "stage_c_scoring_digest",
                  "stage_c_control_pass",
                  "stage_c_nrs_pass",
              ):
                  if payload[key] is not None:
                      raise SystemExit(f"root-{root} unexpectedly contains Stage-C evidence")
              if payload.get("stage_c_summaries") != []:
                  raise SystemExit(f"root-{root} unexpectedly contains Stage-C summaries")

              root_primary = {
                  item["arm_id"]: (
                      bool(item["passes_floor"]),
                      float(item["selected_learning_rate"]),
                      str(item["selection_digest"]),
                  )
                  for item in payload["stage_a_selections"]
              }
              if root_primary != selected_primary:
                  raise SystemExit(f"root-{root} Stage-A selection seal mismatch")

              root_claimed = payload["artifact_digest"]
              root_unsigned = dict(payload)
              root_unsigned.pop("artifact_digest")
              root_reproduced = hashlib.sha256(canonical(root_unsigned)).hexdigest()
              if root_claimed != root_reproduced:
                  raise SystemExit(f"root-{root} artifact digest does not reproduce")
              root_digests[str(root)] = root_claimed

          recovery_workflow = Path(
              "recovery/.github/workflows/exp319r-stage-a-finalization-recovery.yml"
          )
          receipt = {
              "schema": "EXP319R-STAGE-A-FINALIZATION-RECOVERY-RECEIPT-V1",
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_job_id": int(os.environ["SOURCE_JOB_ID"]),
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "source_artifact_digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
              "source_marker": os.environ["SOURCE_MARKER"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_tree_digest": os.environ["SOURCE_TREE_DIGEST"],
              "source_workflow_sha256": os.environ["SOURCE_WORKFLOW_SHA256"],
              "training_contract_digest": os.environ["TRAINING_DIGEST"],
              "scoring_contract_digest": os.environ["SCORING_DIGEST"],
              "execution_digest": os.environ["EXECUTION_DIGEST"],
              "stage_a_selection_file_sha256": hashlib.sha256(
                  Path("recovery-out/source-stage-a-selection.json").read_bytes()
              ).hexdigest(),
              "recovery_commit_sha": os.environ["GITHUB_SHA"],
              "recovery_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "recovery_workflow_sha256": hashlib.sha256(
                  recovery_workflow.read_bytes()
              ).hexdigest(),
              "root_artifact_digests": root_digests,
              "final_json_sha256": hashlib.sha256(final_path.read_bytes()).hexdigest(),
              "final_evidence_digest": claimed,
              "final_decision": final["decision"],
              "no_training_rerun": True,
              "no_inference_rerun": True,
              "no_lr_selection_rerun": True,
              "no_scientific_selection_rerun": True,
              "exp302_implementation_authorized": False,
              "exp320_implementation_authorized": False,
              "scale_authorized": False,
              "authorized_30m": False,
              "authorized_100m": False,
          }
          receipt["receipt_digest"] = hashlib.sha256(canonical(receipt)).hexdigest()
          Path("recovery-out/recovery-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload recovered sealed final artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp319-final-recovered-run-35311529822
          path: recovery-out
          if-no-files-found: error
          retention-days: 90

      - name: Report recovery provenance to draft PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          UPLOAD_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          receipt_path = Path("recovery-out/recovery-receipt.json")
          if receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              body = (
                  "EXP-319R Stage-A finalization recovery completed.\n\n"
                  f"- recovery run: `{receipt['recovery_run_id']}`\n"
                  f"- recovery commit: `{receipt['recovery_commit_sha']}`\n"
                  f"- source scientific run: `{receipt['source_run_id']}`\n"
                  f"- source Stage-A artifact: `{receipt['source_artifact_id']}` / "
                  f"`{receipt['source_artifact_digest']}`\n"
                  f"- frozen finalizer decision: `{receipt['final_decision']}`\n"
                  f"- final evidence digest: `{receipt['final_evidence_digest']}`\n"
                  f"- final.json SHA-256: `{receipt['final_json_sha256']}`\n"
                  f"- recovery receipt digest: `{receipt['receipt_digest']}`\n"
                  f"- uploaded artifact id: `{os.environ.get('UPLOAD_ARTIFACT_ID', '')}`\n"
                  f"- uploaded artifact digest: `{os.environ.get('UPLOAD_ARTIFACT_DIGEST', '')}`\n"
                  f"- uploaded artifact URL: {os.environ.get('UPLOAD_ARTIFACT_URL', '')}\n\n"
                  "No training, inference, LR selection, or scientific selection was rerun. "
                  "EXP-302/EXP-320 implementation and all scale authorizations remain false."
              )
          else:
              body = (
                  "EXP-319R Stage-A finalization recovery workflow did not reach a sealed "
                  f"recovery receipt. Recovery run: `{os.environ['GITHUB_RUN_ID']}`. "
                  "No scientific authorization should be inferred from this procedural failure."
              )

          req = urllib.request.Request(
              "https://api.github.com/repos/Nolane-x/Nolane-AIv2/issues/87/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp319r-stage-a-finalization-recovery",
              },
          )
          with urllib.request.urlopen(req) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"comment API returned {response.status}")
          PY
