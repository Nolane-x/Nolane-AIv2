name: exp279-multiroot-support-stability-v7-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-multiroot-support-stability-v7-ci.yml
      - src/nolane_ai/experiments/exp279_multiroot_support_stability_v7.py
      - src/nolane_ai/experiments/exp279_multiroot_support_stability_v7_cross_cell.py
      - scripts/run_exp279_multiroot_support_stability_v7_dev.py
      - scripts/aggregate_exp279_multiroot_support_stability_v7_dev.py
      - scripts/classify_exp279_multiroot_support_stability_v7_dev.py
      - tests/test_exp279_multiroot_support_stability_v7.py
      - tests/test_exp279_multiroot_support_stability_v7_cli.py
      - tests/test_exp279_multiroot_support_stability_v7_cross_cell.py
      - docs/superpowers/specs/2026-09-12-exp279-multiroot-support-stability-v7-design.md
      - docs/superpowers/plans/2026-09-12-exp279-multiroot-support-stability-v7-implementation.md

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run V7 pre-data contracts
        run: |
          pytest -q \
            tests/test_exp279_multiroot_support_stability_v7.py \
            tests/test_exp279_multiroot_support_stability_v7_cli.py \
            tests/test_exp279_multiroot_support_stability_v7_cross_cell.py
      - name: Compile V7 analysis surfaces
        run: python -m compileall -q src scripts
