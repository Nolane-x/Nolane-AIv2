name: EXP-335 seal execution identity and dispatch
on:
  push:
    branches:
      - exp335-full32-afixed-foundation-reentry-design
    paths:
      - .github/workflows/exp335-seal-and-dispatch.yml

permissions:
  contents: write
  actions: write

env:
  EXP335_SOURCE_SHA: d29e20e5af3467d16123e224462b37ef9a2ebf9d
  EXP335_BRANCH: exp335-full32-afixed-foundation-reentry-design

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marker branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXP335_BRANCH }}
          fetch-depth: 0

      - name: Checkout frozen scientific source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXP335_SOURCE_SHA }}
          path: frozen
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sealed EXP-335 execution identity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=frozen/src python - <<'PY'
          from dataclasses import asdict, replace
          import hashlib
          import json
          from pathlib import Path

          from nolane_ai.experiments.exp335_contract import (
              APPROVED_PREREGISTRATION_DIGEST,
              PARENT_EXP334_ARTIFACT_ID,
              PARENT_EXP334_EVIDENCE_DIGEST,
              PARENT_EXP334_JSON_SHA256,
              PARENT_EXP334_RUN_ID,
              PARENT_EXP334_ZIP_DIGEST,
              RECONSTRUCTION_ARTIFACT_ID,
              RECONSTRUCTION_CHECKPOINT_SHA256,
              RECONSTRUCTION_RECEIPT_SHA256,
              RECONSTRUCTION_RUN_ID,
              RECONSTRUCTION_ZIP_DIGEST,
          )
          from nolane_ai.experiments.exp335_identity import (
              SCHEMA,
              Exp335ExecutionIdentity,
              execution_digest,
              validate_execution_identity,
          )
          from nolane_ai.protocol.identity import source_tree_digest

          root = Path("frozen")
          source_sha = "d29e20e5af3467d16123e224462b37ef9a2ebf9d"
          workflow = root / ".github/workflows/exp335-full32-afixed-foundation-reentry.yml"

          identity = Exp335ExecutionIdentity(
              schema=SCHEMA,
              source_commit_sha=source_sha,
              source_tree_digest=source_tree_digest(root),
              workflow_sha256=hashlib.sha256(workflow.read_bytes()).hexdigest(),
              approved_preregistration_digest=APPROVED_PREREGISTRATION_DIGEST,
              parent_exp334_run_id=PARENT_EXP334_RUN_ID,
              parent_exp334_artifact_id=PARENT_EXP334_ARTIFACT_ID,
              parent_exp334_zip_digest=PARENT_EXP334_ZIP_DIGEST,
              parent_exp334_final_json_sha256=PARENT_EXP334_JSON_SHA256,
              parent_exp334_evidence_digest=PARENT_EXP334_EVIDENCE_DIGEST,
              reconstruction_run_id=RECONSTRUCTION_RUN_ID,
              reconstruction_artifact_id=RECONSTRUCTION_ARTIFACT_ID,
              reconstruction_zip_digest=RECONSTRUCTION_ZIP_DIGEST,
              reconstruction_checkpoint_sha256=RECONSTRUCTION_CHECKPOINT_SHA256,
              reconstruction_receipt_sha256=RECONSTRUCTION_RECEIPT_SHA256,
              exp335_execution_digest="0" * 64,
          )
          identity = replace(identity, exp335_execution_digest=execution_digest(identity))
          validate_execution_identity(identity)

          out = Path("protocols/v017/exp335_execution_identity_v1.json")
          sidecar = Path("protocols/v017/exp335_execution_identity_v1.sha256")
          if out.exists() or sidecar.exists():
              raise SystemExit("EXP-335 execution identity already exists; refusing overwrite")

          raw = (json.dumps(asdict(identity), sort_keys=True, indent=2) + "\n").encode("utf-8")
          out.write_bytes(raw)
          sidecar.write_text(
              hashlib.sha256(raw).hexdigest() + "  exp335_execution_identity_v1.json\n",
              encoding="utf-8",
          )

          print("EXP335_EXECUTION_IDENTITY=" + json.dumps(asdict(identity), sort_keys=True))
          print("EXP335_IDENTITY_FILE_SHA256=" + hashlib.sha256(raw).hexdigest())
          PY

      - name: Commit sealed marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocols/v017/exp335_execution_identity_v1.json protocols/v017/exp335_execution_identity_v1.sha256
          git diff --cached --check
          git commit -m "protocol(exp335): seal execution identity"
          git push origin HEAD:"${EXP335_BRANCH}"

      - name: Dispatch sealed EXP-335 court
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["EXP335_BRANCH"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/exp335-full32-afixed-foundation-reentry.yml/dispatches"
          request = urllib.request.Request(
              url,
              data=json.dumps({"ref": branch}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp335-sealer",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise SystemExit(f"EXP-335 dispatch failed: HTTP {response.status}")
          print("EXP-335 sealed court dispatched")
          PY
