name: v017-exp331-contract
on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp331_*.py"
      - "scripts/exp331_run.py"
      - "protocols/v017/exp331_*"
      - "tests/test_exp331_*.py"
      - ".github/workflows/exp331-pair-lattice-projection-safety.yml"
      - ".github/workflows/v017-exp331-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_exp331_contract.py tests/test_exp331_runtime_surface.py tests/test_exp331_workflow.py
