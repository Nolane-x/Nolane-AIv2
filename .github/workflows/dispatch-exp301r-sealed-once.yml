name: Dispatch sealed EXP-301R once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp301r-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-301R branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp301r-standard-runner-sharded-recovery.yml/dispatches
          -f ref=exp301r-standard-runner-sharded-recovery-sealed-v2
