name: Dispatch sealed EXP-324 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp324-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-324 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp324-family-isolated-learnability.yml/dispatches
          -f ref=exp324-family-isolated-learnability
