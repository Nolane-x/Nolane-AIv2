name: EXP-337 C_NRS self-roll-in Stage-A recovery court

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve sealed identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path("marker/protocols/v017/exp337_execution_identity_v1.json")
          s=Path("marker/protocols/v017/exp337_execution_identity_v1.sha256")
          claimed=s.read_text().split()[0]
          observed=hashlib.sha256(p.read_bytes()).hexdigest()
          if claimed != observed: raise SystemExit("EXP-337 identity sidecar mismatch")
          payload=json.loads(p.read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"source_sha={payload['source_commit_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - name: Verify frozen source and scientific authority
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=frozen/src python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from nolane_ai.experiments.exp337_identity import Exp337ExecutionIdentity, validate_execution_identity
          from nolane_ai.protocol.identity import source_tree_digest
          p=json.loads(Path("marker/protocols/v017/exp337_execution_identity_v1.json").read_text())
          identity=Exp337ExecutionIdentity(**p)
          validate_execution_identity(identity)
          if source_tree_digest("frozen") != identity.source_tree_digest: raise SystemExit("EXP-337 source tree mismatch")
          workflow=Path("frozen/.github/workflows/exp337-self-rollin-stage-a.yml").read_bytes()
          if hashlib.sha256(workflow).hexdigest() != identity.workflow_sha256: raise SystemExit("EXP-337 workflow mismatch")
          prereg=Path("frozen/protocols/v017/exp337_preregistration_v1.json")
          if hashlib.sha256(prereg.read_bytes()).hexdigest() != "95857497dcc0cc264e5e9c76e1f8cb3a15a6b05f1e3bab90795a5f9be7f84423": raise SystemExit("EXP-337 prereg raw bytes mismatch")
          material=json.loads(prereg.read_text())
          canonical=json.dumps(material,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()
          if hashlib.sha256(canonical).hexdigest() != "5172c3f85d15d71e7fc4a16e3f00ae5d9a5031f09a97c1529f8fa6e25822c53a": raise SystemExit("EXP-337 prereg canonical mismatch")
          design=Path("frozen/protocols/v017/EXP337_SELF_ROLLIN_SEQUENCE_RECOVERY_DESIGN_V1.md")
          if hashlib.sha256(design.read_bytes()).hexdigest() != "2b251900e435f219a8d2cb48ecf486674bbb1831cf99b9e41d0396c8b0ef19bf": raise SystemExit("EXP-337 design mismatch")
          att=json.loads(Path("frozen/protocols/v017/exp337_operator_authorization_attestation_v1.json").read_text())
          if att["scientific_dispatch_authorized"] is not False: raise SystemExit("EXP-337 dispatch authority drift")
          lock=json.loads(Path("frozen/protocols/v017/exp337_preregistration_lock_v2.json").read_text())
          if lock["frozen_before_implementation"] is not True or lock["frozen_before_exp337_result_visibility"] is not True: raise SystemExit("EXP-337 lock drift")
          if not all(v is False for v in lock["downstream_authority"].values()): raise SystemExit("EXP-337 downstream authority drift")
          PY
      - name: Verify immutable EXP-336 parent artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          artifact_id=10601286249
          repo=os.environ["GITHUB_REPOSITORY"]
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"exp337"})
          with urllib.request.urlopen(req) as response: item=json.load(response)
          assert item["name"] == "exp336-chunk-7-35481336946"
          assert item["expired"] is False
          assert item["digest"] == "sha256:5a12a2e59e399bec993ee1597ddbf4f85546e1d5de0b26635cb1d7def5a9666d"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp337-identity-${{ github.run_id }}
          path: |
            marker/protocols/v017/exp337_execution_identity_v1.json
            marker/protocols/v017/exp337_execution_identity_v1.sha256
          if-no-files-found: error
          retention-days: 90

  chunk0:
    needs: [prepare]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download exact EXP-336 PROJECT parent
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10601286249"
          path: parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35481336946"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 0 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 0 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "5a12a2e59e399bec993ee1597ddbf4f85546e1d5de0b26635cb1d7def5a9666d" \
            --output-dir evidence/chunk0 \
            --parent-checkpoint parent/project.pt \
            --parent-receipt parent/project-receipt.json
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-0-${{ github.run_id }}
          path: evidence/chunk0
          if-no-files-found: error
          retention-days: 90

  chunk1:
    needs: [prepare, chunk0]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-0-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 1 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk0.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 1 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk0.outputs.artifact_digest }}" \
            --output-dir evidence/chunk1 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-1-${{ github.run_id }}
          path: evidence/chunk1
          if-no-files-found: error
          retention-days: 90

  chunk2:
    needs: [prepare, chunk1]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-1-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 2 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk1.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 2 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk1.outputs.artifact_digest }}" \
