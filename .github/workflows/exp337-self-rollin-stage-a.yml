  chunk3:
    needs: [prepare, chunk2]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-2-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 3 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk2.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 3 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk2.outputs.artifact_digest }}" \
            --output-dir evidence/chunk3 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-3-${{ github.run_id }}
          path: evidence/chunk3
          if-no-files-found: error
          retention-days: 90

  chunk4:
    needs: [prepare, chunk3]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-3-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 4 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk3.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 4 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk3.outputs.artifact_digest }}" \
            --output-dir evidence/chunk4 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-4-${{ github.run_id }}
          path: evidence/chunk4
          if-no-files-found: error
          retention-days: 90

  chunk5:
    needs: [prepare, chunk4]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-4-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 5 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk4.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 5 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk4.outputs.artifact_digest }}" \
            --output-dir evidence/chunk5 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-5-${{ github.run_id }}
          path: evidence/chunk5
          if-no-files-found: error
          retention-days: 90

  chunk6:
    needs: [prepare, chunk5]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-5-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 6 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk5.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 6 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk5.outputs.artifact_digest }}" \
            --output-dir evidence/chunk6 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-6-${{ github.run_id }}
          path: evidence/chunk6
          if-no-files-found: error
          retention-days: 90

  chunk7:
    needs: [prepare, chunk6]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp337-chunk-6-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Execute EXP-337 chunk 7 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk6.outputs.artifact_digest }}"
          python frozen/scripts/exp337_run_chunk.py --chunk-index 7 \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk6.outputs.artifact_digest }}" \
            --output-dir evidence/chunk7 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp337-chunk-7-${{ github.run_id }}
          path: evidence/chunk7
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: [prepare, chunk0, chunk1, chunk2, chunk3, chunk4, chunk5, chunk6, chunk7]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp337-identity-${{ github.run_id }}
          path: identity
      - name: Download exact EXP-336 PROJECT parent
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10601286249"
          path: parent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35481336946"
      - name: Download all immutable EXP-337 chunks
        uses: actions/download-artifact@v5
        with:
          pattern: exp337-chunk-*-${{ github.run_id }}
          path: chunks-all
      - name: Normalize chunk directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chunks
          for i in 0 1 2 3 4 5 6 7; do
            src="chunks-all/exp337-chunk-$i-${GITHUB_RUN_ID}"
            test -d "$src"
            mv "$src" "chunks/$i"
          done
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[model]'
      - name: Finalize preregistered reducer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp337_finalize.py \
            --execution-identity identity/exp337_execution_identity_v1.json \
            --parent-checkpoint parent/project.pt \
            --parent-receipt parent/project-receipt.json \
            --chunk-dir chunks/0 \
            --chunk-dir chunks/1 \
            --chunk-dir chunks/2 \
            --chunk-dir chunks/3 \
            --chunk-dir chunks/4 \
            --chunk-dir chunks/5 \
            --chunk-dir chunks/6 \
            --chunk-dir chunks/7 \
            --chunk-artifact-digest "${{ needs.chunk0.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk1.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk2.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk3.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk4.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk5.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk6.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk7.outputs.artifact_digest }}" \
            --output evidence/exp337-final.json
      - name: Fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/exp337-final.json").read_text())
          allowed={
            "INVALID_EXP337_SELF_ROLLIN_COURT",
            "EXP337_PARENT_AUTHORITY_MISMATCH",
            "EXP337_SHAM_MEASUREMENT_MISMATCH",
            "EXP337_STAGE_A_ESTABLISHED_BOTH",
            "EXP337_STAGE_A_ESTABLISHED_CONTROL_ONLY_RECOVERY_REGRESSION",
            "EXP337_STAGE_A_RESCUED_BY_SELF_ROLLIN_NO_REGRESSION",
            "EXP337_SELF_ROLLIN_NO_CAUSAL_RESCUE",
          }
          if p.get("decision") not in allowed: raise SystemExit("unknown EXP-337 reducer state")
          for key in ("exp302_implementation_authorized","exp320_implementation_authorized","stage_b_implementation_authorized","stage_c_implementation_authorized","scale_authorized","authorized_30m","authorized_100m"):
              if p.get(key) is not False: raise SystemExit(f"forbidden authorization {key}")
          print("EXP-337 disposition:",p["decision"])
          print("evidence digest:",p["evidence_digest"])
          print("CONTROL failed worlds:",p["control_failed_worlds"])
          print("RECOVERY failed worlds:",p["recovery_failed_worlds"])
          print("rescued CONTROL failures:",p["rescued_control_failures"])
          print("RECOVERY regressions:",p["recovery_regressions"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp337-self-rollin-stage-a-final-${{ github.run_id }}
          path: evidence/exp337-final.json
          if-no-files-found: error
          retention-days: 90
