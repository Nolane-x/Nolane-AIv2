name: Dispatch sealed EXP-326 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp326-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-326 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp326-balanced-multiworld-breakpoint.yml/dispatches
          -f ref=exp326-balanced-multiworld-breakpoint
