name: v017-exp333-contract
on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp333_*.py"
      - "scripts/exp333_run.py"
      - "protocols/v017/exp333_*"
      - "tests/test_exp333_*.py"
      - ".github/workflows/exp333-complete-eight-world-pair-lattice.yml"
      - ".github/workflows/v017-exp333-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_exp333_contract.py tests/test_exp333_runtime_surface.py tests/test_exp333_workflow.py
