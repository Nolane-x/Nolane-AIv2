name: EXP-323 second-decay convergence intervention

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intervention:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arm: [HOLD_5E5, DECAY_2P5E5]
    steps:
      - name: Checkout sealed marker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker

      - name: Resolve sealed source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path("marker/protocols/v017/exp323_execution_identity_v1.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_sha={p['source_commit_sha']}\n")
              out.write(f"workflow_sha256={p['workflow_sha256']}\n")
              out.write(f"execution_digest={p['exp323_execution_digest']}\n")
          PY

      - name: Checkout exact frozen EXP-323 source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify marker source workflow and preregistration
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/marker/src"
          python marker/scripts/verify_exp323_freeze.py \
            --repo-root marker \
            --source-commit-sha "${{ steps.identity.outputs.source_sha }}" \
            --marker-json marker/protocols/v017/exp323_execution_identity_v1.json \
            --marker-sha256 marker/protocols/v017/exp323_execution_identity_v1.sha256
          test "$(sha256sum frozen/.github/workflows/exp323-second-decay-convergence.yml | awk '{print $1}')" = "${{ steps.identity.outputs.workflow_sha256 }}"
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/verify_exp323_contract.py \
            --json frozen/protocols/v017/exp323_preregistration_v1.json \
            --sha256 frozen/protocols/v017/exp323_preregistration_v1.sha256

      - name: Verify immutable parent artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          checks = (
              (
                  35339004168,
                  10544985252,
                  "exp322-teacher-forced-intervention-35339004168",
                  "sha256:18eb23aa09086aea89bf9ab96e07c52270069b75e8dc276f7610148b46b2e4cc",
              ),
              (
                  35311529822,
                  10534351390,
                  "exp319-stage-a-A_FIXED-0.0001-c3",
                  "sha256:ee07280fee8379f39ccea16d38f1ff31482975cb39780a75a0592916e8d154c3",
              ),
          )
          for run_id, expected_id, expected_name, expected_digest in checks:
              url = (
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?"
                  + urllib.parse.urlencode({"name": expected_name})
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exp323-second-decay-convergence",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              matches = [a for a in payload["artifacts"] if int(a["id"]) == expected_id]
              if len(matches) != 1:
                  raise SystemExit(f"EXP-323 artifact id mismatch: {expected_name}")
              artifact = matches[0]
              if artifact["name"] != expected_name or artifact.get("expired") is not False:
                  raise SystemExit(f"EXP-323 artifact metadata mismatch: {expected_name}")
              if artifact.get("digest") != expected_digest:
                  raise SystemExit(f"EXP-323 artifact digest mismatch: {expected_name}")
          PY

      - name: Download sealed EXP-322 evidence
        uses: actions/download-artifact@v4
        with:
          name: exp322-teacher-forced-intervention-35339004168
          path: parent-exp322
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35339004168

      - name: Download immutable selected A_FIXED checkpoint
        uses: actions/download-artifact@v4
        with:
          name: exp319-stage-a-A_FIXED-0.0001-c3
          path: input
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35311529822

      - name: Install exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Run sealed EXP-323 replay plus continuation arm
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          mkdir -p "arm-${{ matrix.arm }}"
          python frozen/scripts/exp323_run_arm.py \
            --checkpoint input/checkpoint.pt \
            --receipt input/receipt.json \
            --parent-exp322 parent-exp322/exp322-final.json \
            --arm "${{ matrix.arm }}" \
            --execution-identity marker/protocols/v017/exp323_execution_identity_v1.json \
            --output "arm-${{ matrix.arm }}/evidence.json"

      - name: Upload sealed arm evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp323-${{ matrix.arm }}-${{ github.run_id }}
          path: arm-${{ matrix.arm }}/evidence.json
          if-no-files-found: error
          retention-days: 90

  reduce:
    needs: intervention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sealed marker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker

      - name: Resolve sealed source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path("marker/protocols/v017/exp323_execution_identity_v1.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_sha={p['source_commit_sha']}\n")
              out.write(f"execution_digest={p['exp323_execution_digest']}\n")
          PY

      - name: Checkout exact frozen EXP-323 source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download HOLD evidence
        uses: actions/download-artifact@v4
        with:
          name: exp323-HOLD_5E5-${{ github.run_id }}
          path: hold

      - name: Download second-decay evidence
        uses: actions/download-artifact@v4
        with:
          name: exp323-DECAY_2P5E5-${{ github.run_id }}
          path: decay

      - name: Install frozen reducer
        run: python -m pip install -e './frozen[dev]'

      - name: Reduce sealed EXP-323 evidence
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp323_reduce.py \
            --hold hold/evidence.json \
            --decay decay/evidence.json \
            --output evidence/exp323-final.json

      - name: Fail closed on authorization drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("evidence/exp323-final.json").read_text(encoding="utf-8"))
          for key in (
              "exp302_implementation_authorized",
              "exp320_implementation_authorized",
              "scale_authorized",
              "authorized_30m",
              "authorized_100m",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"forbidden authorization: {key}")
          print(f"EXP-323 sealed disposition: {p['decision']}")
          print(f"EXP-323 evidence digest: {p['evidence_digest']}")
          PY

      - name: Upload sealed EXP-323 evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp323-second-decay-convergence-${{ github.run_id }}
          path: evidence/exp323-final.json
          if-no-files-found: error
          retention-days: 90
