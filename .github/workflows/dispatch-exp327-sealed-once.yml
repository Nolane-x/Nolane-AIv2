name: Dispatch sealed EXP-327 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp327-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-327 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp327-iterative-minimal-subset.yml/dispatches
          -f ref=exp327-iterative-minimal-failing-subset
