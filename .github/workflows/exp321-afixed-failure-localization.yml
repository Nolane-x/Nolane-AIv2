name: EXP-321 A_FIXED failure localization

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sealed marker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker

      - name: Resolve sealed source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(
              Path("marker/protocols/v017/exp321_execution_identity_v1.json")
              .read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_sha={p['source_commit_sha']}\n")
              out.write(f"workflow_sha256={p['workflow_sha256']}\n")
              out.write(f"execution_digest={p['exp321_execution_digest']}\n")
          PY

      - name: Checkout exact frozen EXP-321 source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify marker, source tree, workflow and preregistration
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/marker/src"
          python marker/scripts/verify_exp321_freeze.py             --repo-root marker             --source-commit-sha "${{ steps.identity.outputs.source_sha }}"             --marker-json marker/protocols/v017/exp321_execution_identity_v1.json             --marker-sha256 marker/protocols/v017/exp321_execution_identity_v1.sha256
          test "$(sha256sum frozen/.github/workflows/exp321-afixed-failure-localization.yml | awk '{print $1}')" = "${{ steps.identity.outputs.workflow_sha256 }}"
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/verify_exp321_contract.py             --json frozen/protocols/v017/exp321_preregistration_v1.json             --sha256 frozen/protocols/v017/exp321_preregistration_v1.sha256

      - name: Verify immutable EXP-319 checkpoint artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          run_id = 35311529822
          expected_id = 10534351390
          expected_name = "exp319-stage-a-A_FIXED-0.0001-c3"
          expected_digest = "sha256:ee07280fee8379f39ccea16d38f1ff31482975cb39780a75a0592916e8d154c3"
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?"
              + urllib.parse.urlencode({"name": expected_name})
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp321-afixed-failure-localization",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          matches = [a for a in payload["artifacts"] if int(a["id"]) == expected_id]
          if len(matches) != 1:
              raise SystemExit("selected EXP-319 checkpoint artifact identity mismatch")
          artifact = matches[0]
          if artifact["name"] != expected_name:
              raise SystemExit("selected EXP-319 checkpoint artifact name mismatch")
          if artifact.get("expired") is not False:
              raise SystemExit("selected EXP-319 checkpoint artifact is expired")
          if artifact.get("digest") != expected_digest:
              raise SystemExit("selected EXP-319 checkpoint artifact digest mismatch")
          PY

      - name: Download immutable selected A_FIXED checkpoint
        uses: actions/download-artifact@v4
        with:
          name: exp319-stage-a-A_FIXED-0.0001-c3
          path: input
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35311529822

      - name: Install exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Run zero-gradient EXP-321 localization
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp321_localize_checkpoint.py             --checkpoint input/checkpoint.pt             --receipt input/receipt.json             --execution-identity marker/protocols/v017/exp321_execution_identity_v1.json             --output evidence/exp321-final.json

      - name: Fail closed on reproduction or authorization drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("evidence/exp321-final.json").read_text(encoding="utf-8"))
          if p.get("reproduction_valid") is not True:
              raise SystemExit("EXP-321 did not reproduce sealed EXP-319 anchors")
          if len(p.get("records", [])) != 128:
              raise SystemExit("EXP-321 measurement geometry mismatch")
          identity = p.get("execution_identity")
          if not isinstance(identity, dict):
              raise SystemExit("EXP-321 sealed evidence lacks execution identity")
          if identity.get("exp321_execution_digest") != "${{ steps.identity.outputs.execution_digest }}":
              raise SystemExit("EXP-321 execution identity digest drift")
          for key in (
              "exp302_implementation_authorized",
              "exp320_implementation_authorized",
              "scale_authorized",
              "authorized_30m",
              "authorized_100m",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"forbidden authorization: {key}")
          print(f"EXP-321 sealed disposition: {p['decision']}")
          print(f"EXP-321 evidence digest: {p['evidence_digest']}")
          PY

      - name: Upload sealed EXP-321 evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp321-afixed-failure-localization-${{ github.run_id }}
          path: evidence/exp321-final.json
          if-no-files-found: error
          retention-days: 90
