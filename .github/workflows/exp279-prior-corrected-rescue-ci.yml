name: exp279-prior-corrected-rescue-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-prior-corrected-rescue-ci.yml
      - src/nolane_ai/experiments/exp279_prior_corrected_rescue.py
      - scripts/run_exp279_prior_corrected_rescue_pair_dev.py
      - tests/test_exp279_prior_corrected_rescue.py
      - docs/superpowers/plans/2026-09-11-exp279-prior-corrected-rescue-replay.md

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run prior-corrected sparse-rescue contract
        run: pytest -q tests/test_exp279_prior_corrected_rescue.py
      - name: Compile analysis surface
        run: python -m compileall -q src scripts

  development-pair:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        train_replicates: [15, 60, 120]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify canonical frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run preregistered paired canonical vs prior-corrected rescue DEVELOPMENT control
        run: |
          WORK=/tmp/exp279-prior-corrected-pair-${{ matrix.train_replicates }}-fresh40000
          python scripts/run_exp279_prior_corrected_rescue_pair_dev.py \
            --root-seed 20260906-exp279-paired-dev \
            --d-model 64 \
            --hidden-size 48 \
            --target-parameters 500000 \
            --route-threshold 0.5 \
            --train-replicates ${{ matrix.train_replicates }} \
            --eval-replicates 33 \
            --eval-start-replicate 40000 \
            --batch-size 8 \
            --timesteps 4 \
            --variables 6 \
            --constraints 3 \
            --noise-std 0.05 \
            --lr 0.002 \
            --weight-decay 0.0 \
            --output-dir "$WORK"
      - name: Assert paired identity and DEVELOPMENT-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          n = ${{ matrix.train_replicates }}
          work = Path(f'/tmp/exp279-prior-corrected-pair-{n}-fresh40000')
          comparison = json.loads((work / 'comparison.json').read_text())
          baseline = json.loads((work / 'baseline.json').read_text())
          intervention = json.loads((work / 'prior-corrected.json').read_text())

          assert comparison['schema'] == 'NLM-EXP-279-PRIOR-CORRECTED-RESCUE-PAIR-DEV-V1'
          assert comparison['evidence_level'] == 'EV-E2'
          assert comparison['decision'] == 'UNVERIFIED'
          assert comparison['scientific_evidence_eligible'] is False
          assert comparison['lineage_role'] == 'fresh_primary_single_use'
          assert comparison['training_replicates'] == n
          assert comparison['evaluation_start_replicate'] == 40000
          assert comparison['evaluation_replicates'] == 33
          assert comparison['route_threshold'] == 0.5
          assert all(comparison['control_identity'].values())
          assert comparison['challenge_materialized'] is False
          assert comparison['confirmatory_data_consumed'] is False
          assert comparison['promotion_claimed'] is False

          for receipt in (baseline, intervention):
              assert receipt['evidence_level'] == 'EV-E2'
              assert receipt['decision'] == 'UNVERIFIED'
              assert receipt['challenge_materialized'] is False
              assert receipt['confirmatory_data_consumed'] is False
              assert receipt['route_config']['threshold'] == 0.5
              assert receipt['evaluation']['start_replicate'] == 40000
              assert receipt['evaluation']['replicates'] == 33

          replay = intervention['training']['prior_corrected_rescue_replay']
          assert replay['source'] == 'augmentation_training_only'
          assert replay['natural_total_count'] == n * 8
          assert replay['natural_positive_count'] == replay['final_anchor_episodes']
          assert replay['evaluation_examples_used'] is False
          assert replay['evaluation_targets_used'] is False
          assert replay['decision_threshold_changed'] is False
          assert replay['tunable_calibration_hyperparameters'] is False
          assert replay['stop_accounted_flops_per_episode'] == 110046
          assert replay['branch_accounted_flops_per_episode'] == 224766
          expected_ratio = (224766 - 110046) / 224766
          assert abs(replay['incremental_cost_ratio'] - expected_ratio) < 1e-12

          print(json.dumps({
              'train_replicates': n,
              'baseline': comparison['baseline'],
              'prior_corrected': comparison['prior_corrected'],
              'delta': comparison['delta_prior_corrected_minus_baseline'],
              'control_identity': comparison['control_identity'],
              'comparison_digest': comparison['comparison_digest'],
          }, sort_keys=True))
          PY
      - name: Upload paired DEVELOPMENT receipts
        uses: actions/upload-artifact@v4
        with:
          name: exp279-prior-corrected-pair-${{ matrix.train_replicates }}-fresh40000-${{ github.sha }}
          path: /tmp/exp279-prior-corrected-pair-${{ matrix.train_replicates }}-fresh40000
          if-no-files-found: error
          retention-days: 90
