name: Dispatch sealed EXP-329 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp329-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-329 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp329-p02-cross-update-interference.yml/dispatches
          -f ref=exp329-p02-cross-update-interference
