name: v017-exp324-contract

on:
  pull_request:
    paths:
      - "docs/superpowers/specs/2026-09-18-exp324-family-isolated-learnability-design.md"
      - "protocols/v017/exp324_preregistration_v1.json"
      - "protocols/v017/exp324_preregistration_v1.sha256"
      - "src/nolane_ai/experiments/exp324_*.py"
      - "scripts/verify_exp324_contract.py"
      - "scripts/verify_exp324_freeze.py"
      - "scripts/exp324_*.py"
      - "tests/test_exp324_*.py"
      - ".github/workflows/v017-exp324-contract.yml"
      - ".github/workflows/exp324-family-isolated-learnability.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Verify frozen preregistration
        run: >-
          python scripts/verify_exp324_contract.py
          --json protocols/v017/exp324_preregistration_v1.json
          --sha256 protocols/v017/exp324_preregistration_v1.sha256
      - name: Run complete EXP-324 pure contract/freeze/workflow court
        run: pytest -q tests/test_exp324_*.py
      - run: python -m compileall -q src scripts
