name: EXP-336 C_NRS full-32 Stage-A projection-inheritance court
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: marker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve sealed identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path("marker/protocols/v017/exp336_execution_identity_v1.json")
          s=Path("marker/protocols/v017/exp336_execution_identity_v1.sha256")
          claimed=s.read_text().split()[0]
          observed=hashlib.sha256(p.read_bytes()).hexdigest()
          if claimed != observed: raise SystemExit("EXP-336 identity sidecar mismatch")
          payload=json.loads(p.read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"source_sha={payload['source_commit_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - name: Verify frozen source, workflow and preregistration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=frozen/src python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from nolane_ai.experiments.exp336_identity import Exp336ExecutionIdentity, validate_execution_identity
          from nolane_ai.protocol.identity import source_tree_digest
          p=json.loads(Path("marker/protocols/v017/exp336_execution_identity_v1.json").read_text())
          identity=Exp336ExecutionIdentity(**p)
          validate_execution_identity(identity)
          if source_tree_digest("frozen") != identity.source_tree_digest:
              raise SystemExit("EXP-336 source tree mismatch")
          workflow=Path("frozen/.github/workflows/exp336-cnrs-full32-stage-a.yml").read_bytes()
          if hashlib.sha256(workflow).hexdigest() != identity.workflow_sha256:
              raise SystemExit("EXP-336 workflow mismatch")
          prereg=Path("frozen/protocols/v017/exp336_preregistration_v1.json").read_bytes()
          if hashlib.sha256(prereg).hexdigest() != "6090e7423332756998b8199cc77d56b7e40a296b401f63dbcc6cabecf97feeab":
              raise SystemExit("EXP-336 preregistration bytes mismatch")
          sidecar=Path("frozen/protocols/v017/exp336_preregistration_v1.sha256").read_text().split()[0]
          if sidecar != "491899f5f613b3d80b36689e7882e8c72875fb268a6886e1a40542eb09dc33ce":
              raise SystemExit("EXP-336 preregistration canonical digest mismatch")
          closure=json.loads(Path("frozen/protocols/v017/exp335_final_closure_v1.json").read_text())
          if closure["final_reducer"]["decision"] != "AFIXED_FULL32_FOUNDATION_REENTRY_RESCUED_NO_REGRESSION":
              raise SystemExit("EXP-336 parent EXP-335 disposition mismatch")
          if closure["authoritative_final_artifact"]["evidence_digest"] != "6fcabeb87971a0cb5d5ef0d14029f5ab248f3e353b21bb55f42ac977a4ffe1af":
              raise SystemExit("EXP-336 parent EXP-335 evidence mismatch")
          PY
      - name: Verify immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          checks=(
            (10533822077,"exp319-stage-a-selection","sha256:ee65f07a5f63c5b7f472eba5aea5ab17a624697138c23266d515810024bfb559"),
            (10534076546,"exp319-stage-a-C_NRS_CORE-0.0003-c3","sha256:d88a9d85584476ec5226321479560a1255f0d015122827d4be75f67a6f337755"),
            (10590026763,"exp335-full32-foundation-reentry-final-35445927525","sha256:ae4ab3bc0b8ce064ece92655fd578a896fe3ed6f27fffd411b9b14d0fc1729a5"),
            (10595335243,"exp335-frozen-independent-final-audit-35445927525","sha256:0ae527b905d92e51d6ec62553fdaa0098ebde9432f7d0201baa6d773c2782b7d"),
          )
          for artifact_id,name,digest in checks:
              req=urllib.request.Request(
                f"https://api.github.com/repos/Nolane-x/Nolane-AIv2/actions/artifacts/{artifact_id}",
                headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json",
                         "X-GitHub-Api-Version":"2022-11-28","User-Agent":"exp336"},
              )
              with urllib.request.urlopen(req) as response: item=json.load(response)
              if item["name"] != name or item.get("expired") is not False or item.get("digest") != digest:
                  raise SystemExit(f"artifact authority mismatch {artifact_id}: {item.get('name')} {item.get('digest')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp336-identity-${{ github.run_id }}
          path: |
            marker/protocols/v017/exp336_execution_identity_v1.json
            marker/protocols/v017/exp336_execution_identity_v1.sha256
          if-no-files-found: error
          retention-days: 90

  chunk0:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download frozen EXP-319 Stage-A selection
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10533822077"
          path: parent-selection
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35311529822"
      - name: Download selected C_NRS checkpoint
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10534076546"
          path: parent-cnrs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35311529822"
      - name: Verify immutable parent member bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum parent-selection/stage-a-selection.json | awk '{print $1}')" = "4da236ea06a76df94ab6aa3e8141c6855a97f427f0b8614fc380d5c71e88e34a"
          test "$(sha256sum parent-cnrs/checkpoint.pt | awk '{print $1}')" = "bd58607a0e49bb32f45124689d11880a13040afa702bf0524cce115d947f650b"
          test "$(sha256sum parent-cnrs/receipt.json | awk '{print $1}')" = "cea3fb3d0b94e5d7cbec59813cfa3a1611dec0883a14acd6b2d0e46a23db3e4d"
          test "$(sha256sum parent-cnrs/summary.json | awk '{print $1}')" = "32131c058049a27c24ac215cc04b77d5e1432cbda41fda71f8724f6723dfea23"
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 0 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 0 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "d88a9d85584476ec5226321479560a1255f0d015122827d4be75f67a6f337755" \
            --output-dir evidence/chunk0 \
            --parent-checkpoint parent-cnrs/checkpoint.pt \
            --parent-receipt parent-cnrs/receipt.json \
            --parent-summary parent-cnrs/summary.json \
            --parent-selection parent-selection/stage-a-selection.json
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-0-${{ github.run_id }}
          path: evidence/chunk0
          if-no-files-found: error
          retention-days: 90

  chunk1:
    needs: [prepare, chunk0]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-0-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 1 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk0.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 1 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk0.outputs.artifact_digest }}" \
            --output-dir evidence/chunk1 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-1-${{ github.run_id }}
          path: evidence/chunk1
          if-no-files-found: error
          retention-days: 90

  chunk2:
    needs: [prepare, chunk1]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-1-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 2 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk1.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 2 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk1.outputs.artifact_digest }}" \
            --output-dir evidence/chunk2 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-2-${{ github.run_id }}
          path: evidence/chunk2
          if-no-files-found: error
          retention-days: 90

  chunk3:
    needs: [prepare, chunk2]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-2-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 3 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk2.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 3 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk2.outputs.artifact_digest }}" \
            --output-dir evidence/chunk3 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-3-${{ github.run_id }}
          path: evidence/chunk3
          if-no-files-found: error
          retention-days: 90

  chunk4:
    needs: [prepare, chunk3]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-3-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 4 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk3.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 4 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk3.outputs.artifact_digest }}" \
            --output-dir evidence/chunk4 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-4-${{ github.run_id }}
          path: evidence/chunk4
          if-no-files-found: error
          retention-days: 90

  chunk5:
    needs: [prepare, chunk4]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-4-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 5 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk4.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 5 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk4.outputs.artifact_digest }}" \
            --output-dir evidence/chunk5 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-5-${{ github.run_id }}
          path: evidence/chunk5
          if-no-files-found: error
          retention-days: 90

  chunk6:
    needs: [prepare, chunk5]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-5-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 6 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk5.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 6 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk5.outputs.artifact_digest }}" \
            --output-dir evidence/chunk6 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-6-${{ github.run_id }}
          path: evidence/chunk6
          if-no-files-found: error
          retention-days: 90

  chunk7:
    needs: [prepare, chunk6]
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download previous immutable chunk
        uses: actions/download-artifact@v5
        with:
          name: exp336-chunk-6-${{ github.run_id }}
          path: previous
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Execute EXP-336 chunk 7 court
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          test -n "${{ needs.chunk6.outputs.artifact_digest }}"
          python frozen/scripts/exp336_run_chunk.py --chunk-index 7 \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --code-root frozen \
            --parent-artifact-digest "${{ needs.chunk6.outputs.artifact_digest }}" \
            --output-dir evidence/chunk7 \
            --previous-dir previous
      - name: Upload immutable chunk
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: exp336-chunk-7-${{ github.run_id }}
          path: evidence/chunk7
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: [prepare, chunk0, chunk1, chunk2, chunk3, chunk4, chunk5, chunk6, chunk7]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce one-shot run attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: frozen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          name: exp336-identity-${{ github.run_id }}
          path: identity
      - name: Download frozen EXP-319 Stage-A selection
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10533822077"
          path: parent-selection
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35311529822"
      - name: Download selected C_NRS checkpoint
        uses: actions/download-artifact@v5
        with:
          artifact-ids: "10534076546"
          path: parent-cnrs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35311529822"
      - name: Download all immutable EXP-336 chunks
        uses: actions/download-artifact@v5
        with:
          pattern: exp336-chunk-*-${{ github.run_id }}
          path: chunks-all
      - name: Normalize chunk directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chunks
          for i in 0 1 2 3 4 5 6 7; do
            src="chunks-all/exp336-chunk-$i-${GITHUB_RUN_ID}"
            test -d "$src"
            mv "$src" "chunks/$i"
          done
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'
      - name: Finalize preregistered reducer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp336_finalize.py \
            --execution-identity identity/exp336_execution_identity_v1.json \
            --parent-checkpoint parent-cnrs/checkpoint.pt \
            --parent-receipt parent-cnrs/receipt.json \
            --parent-summary parent-cnrs/summary.json \
            --parent-selection parent-selection/stage-a-selection.json \
            --chunk-dir chunks/0 --chunk-dir chunks/1 --chunk-dir chunks/2 --chunk-dir chunks/3 \
            --chunk-dir chunks/4 --chunk-dir chunks/5 --chunk-dir chunks/6 --chunk-dir chunks/7 \
            --chunk-artifact-digest "${{ needs.chunk0.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk1.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk2.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk3.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk4.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk5.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk6.outputs.artifact_digest }}" \
            --chunk-artifact-digest "${{ needs.chunk7.outputs.artifact_digest }}" \
            --output evidence/exp336-final.json
      - name: Fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/exp336-final.json").read_text())
          allowed={
            "INVALID_CNRS_FULL32_STAGE_A",
            "PARENT_AUTHORITY_MISMATCH",
            "SHAM_CNRS_FULL32_MISMATCH",
            "CNRS_FULL32_STAGE_A_ESTABLISHED_BOTH",
            "CNRS_FULL32_STAGE_A_ESTABLISHED_CONTROL_ONLY_PROJECT_REGRESSION",
            "CNRS_BASELINE_FAILURE_WITHOUT_PROJECTOR_TRIGGER",
            "CNRS_FULL32_STAGE_A_RESCUED_BY_INHERITED_PROJECTOR_NO_REGRESSION",
            "CNRS_FULL32_STAGE_A_NOT_ESTABLISHED",
          }
          if p.get("decision") not in allowed: raise SystemExit("unknown EXP-336 reducer state")
          for key in (
              "exp302_implementation_authorized","exp320_implementation_authorized",
              "stage_b_implementation_authorized","stage_c_implementation_authorized",
              "scale_authorized","authorized_30m","authorized_100m",
          ):
              if p.get(key) is not False: raise SystemExit(f"forbidden authorization {key}")
          print("EXP-336 disposition:",p["decision"])
          print("evidence digest:",p["evidence_digest"])
          print("CONTROL failed worlds:",p["control_failed_worlds"])
          print("PROJECT failed worlds:",p["project_failed_worlds"])
          print("CONTROL aggregate pass:",p["control_aggregate_pass"])
          print("PROJECT aggregate pass:",p["project_aggregate_pass"])
          print("rescued CONTROL failures:",p["rescued_control_failures"])
          print("PROJECT regressions:",p["project_regressions"])
          print("projection updates:",p["projection_update_count"])
          print("projected targets:",p["projected_target_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp336-cnrs-full32-stage-a-final-${{ github.run_id }}
          path: evidence/exp336-final.json
          if-no-files-found: error
