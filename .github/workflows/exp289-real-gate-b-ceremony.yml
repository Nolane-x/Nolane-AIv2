name: exp289-real-gate-b-ceremony

on:
  push:
    branches: [exp289-real-gate-b-ceremony]
    paths:
      - .github/ceremony/exp289-real-gate-b-arm.json

permissions:
  actions: read
  contents: read

concurrency:
  group: exp289-real-gate-b-${{ github.ref }}
  cancel-in-progress: false

env:
  PROTOCOL_SHA: c010d90b9d626cfde4f7727b76fcd053f1ebf7f2f7aa201d7d13d2d828cef440
  CEREMONY_ID: EXP-289-REAL-GATE-B-2026-09-10
  ARM_PATH: .github/ceremony/exp289-real-gate-b-arm.json
  INFERENCE_MARKER_NAME: exp289-real-gate-b-inference-started-${{ github.sha }}
  RAW_NAME: exp289-real-gate-b-raw-${{ github.sha }}
  OUTCOME_NAME: exp289-real-gate-b-outcome-${{ github.sha }}
  EVIDENCE_NAME: exp289-real-gate-b-evidence-${{ github.sha }}

jobs:
  ceremony:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate arm-only commit and frozen scientific scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          arm = json.loads(Path(os.environ['ARM_PATH']).read_text(encoding='utf-8'))
          if arm.get('schema') != 'NLM-EXP-289-REAL-GATE-B-ARM-V1':
              raise SystemExit(f"invalid EXP-289 arm schema: {arm!r}")
          if arm.get('ceremony_id') != os.environ['CEREMONY_ID']:
              raise SystemExit(f"invalid EXP-289 ceremony id: {arm!r}")
          if arm.get('protocol_digest') != os.environ['PROTOCOL_SHA']:
              raise SystemExit(f"invalid EXP-289 protocol identity in arm marker: {arm!r}")
          if arm.get('armed') is not True:
              raise SystemExit('EXP-289 scientific lane is not armed')
          if os.environ.get('GITHUB_REF_NAME') != 'exp289-real-gate-b-ceremony':
              raise SystemExit('EXP-289 real ceremony must run only on immutable ceremony branch')
          baseline = arm.get('source_baseline_sha')
          if not isinstance(baseline, str) or len(baseline) != 40:
              raise SystemExit('EXP-289 source_baseline_sha missing or invalid')
          if arm.get('confirmatory_scope') != 'frozen-episode-local-exact-nogood-family':
              raise SystemExit('EXP-289 confirmatory scope marker mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'BASELINE_SHA={baseline}\n')
          PY
          test "${GITHUB_REF_NAME}" = "exp289-real-gate-b-ceremony"
          PARENT_SHA="$(git rev-parse HEAD^)"
          BASELINE_FROM_MARKER="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('.github/ceremony/exp289-real-gate-b-arm.json').read_text())['source_baseline_sha'])
          PY
          )"
          test "$PARENT_SHA" = "$BASELINE_FROM_MARKER"
          mapfile -t changed < <(git diff --name-only "$BASELINE_FROM_MARKER" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/ceremony/exp289-real-gate-b-arm.json"
          test -z "$(git diff --name-only "$BASELINE_FROM_MARKER" HEAD -- src scripts protocols/stage_a_v1.json protocols/stage_a_v1.sha256 protocols/exp289_authoritative_development_v1.json protocols/exp289_authoritative_development_v1.sha256)"
          test -z "$(git diff --name-only "$BASELINE_FROM_MARKER" HEAD -- .github/workflows/exp289-real-gate-b-ceremony.yml)"

      - name: Reject replay after authoritative inference or outcome
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in "$INFERENCE_MARKER_NAME" "$RAW_NAME" "$OUTCOME_NAME"; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" > /tmp/exp289-artifacts.json
            python - "$name" <<'PY'
          import json
          import sys
          from pathlib import Path

          name = sys.argv[1]
          payload = json.loads(Path('/tmp/exp289-artifacts.json').read_text(encoding='utf-8'))
          active = [
              artifact for artifact in payload.get('artifacts', [])
              if artifact.get('name') == name and not artifact.get('expired', False)
          ]
          if active:
              raise SystemExit(f'authoritative EXP-289 artifact already exists for exact arm SHA: {name}')
          PY
          done

      - name: Require exact baseline normal and focused CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          wait_run() {
            local workflow="$1"
            local endpoint="$2"
            local output="$3"
            local state=""
            for attempt in $(seq 1 120); do
              gh api "$endpoint" > /tmp/exp289-ci-runs.json
              state="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/exp289-ci-runs.json').read_text(encoding='utf-8'))
          sha = os.environ['BASELINE_SHA']
          runs = [
              run for run in payload.get('workflow_runs', [])
              if run.get('head_sha') == sha and run.get('event') == 'push'
          ]
          if not runs:
              print('WAIT')
          else:
              run = sorted(runs, key=lambda item: int(item['id']), reverse=True)[0]
              if run.get('status') != 'completed':
                  print('WAIT')
              elif run.get('conclusion') != 'success':
                  print(f"FAIL:{run['id']}:{run.get('conclusion')}")
              else:
                  print(f"RUN:{run['id']}")
          PY
          )"
              case "$state" in
                WAIT) sleep 15 ;;
                FAIL:*) echo "exact baseline CI failed: $workflow $state" >&2; exit 1 ;;
                RUN:*) printf '%s\n' "${state#RUN:}" > "$output"; return 0 ;;
                *) echo "unexpected CI state: $state" >&2; exit 1 ;;
              esac
            done
            echo "timed out waiting for exact baseline CI: $workflow" >&2
            exit 1
          }

          wait_run "ci.yml" "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${BASELINE_SHA}&event=push&per_page=20" /tmp/exp289-normal-ci-run-id.txt
          wait_run "exp289-confirmatory-ci.yml" "/repos/${GITHUB_REPOSITORY}/actions/workflows/exp289-confirmatory-ci.yml/runs?head_sha=${BASELINE_SHA}&event=push&per_page=20" /tmp/exp289-focused-ci-run-id.txt

          normal_run="$(cat /tmp/exp289-normal-ci-run-id.txt)"
          focused_run="$(cat /tmp/exp289-focused-ci-run-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${normal_run}/jobs?per_page=100" > /tmp/exp289-normal-ci-jobs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${focused_run}/jobs?per_page=100" > /tmp/exp289-focused-ci-jobs.json
          python - <<'PY'
          import json
          from pathlib import Path

          normal = json.loads(Path('/tmp/exp289-normal-ci-jobs.json').read_text(encoding='utf-8'))
          focused = json.loads(Path('/tmp/exp289-focused-ci-jobs.json').read_text(encoding='utf-8'))
          normal_observed = {job.get('name'): job.get('conclusion') for job in normal.get('jobs', [])}
          required_normal = ('core (3.11)', 'core (3.13)', 'model-smoke')
          failed = [name for name in required_normal if normal_observed.get(name) != 'success']
          if failed:
              raise SystemExit(f'EXP-289 exact baseline normal CI court failed: {failed!r}; observed={normal_observed!r}')
          focused_observed = {job.get('name'): job.get('conclusion') for job in focused.get('jobs', [])}
          if focused_observed.get('contract') != 'success':
              raise SystemExit(f"EXP-289 exact baseline focused CI court failed: observed={focused_observed!r}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,model]'

      - name: Verify canonical frozen Stage-A protocol
        run: python scripts/verify_protocol.py

      - name: Capture scientific source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from nolane_ai.protocol.identity import file_sha256, source_tree_digest

          protocol_digest = file_sha256('protocols/stage_a_v1.json')
          if protocol_digest != os.environ['PROTOCOL_SHA']:
              raise SystemExit(f'canonical Stage-A protocol drift: {protocol_digest}')
          payload = {
              'schema': 'NLM-EXP-289-REAL-GATE-B-SOURCE-IDENTITY-V1',
              'ceremony_id': os.environ['CEREMONY_ID'],
              'ceremony_sha': os.environ['GITHUB_SHA'],
              'scientific_baseline_sha': os.environ['BASELINE_SHA'],
              'protocol_digest': protocol_digest,
              'source_tree_digest': source_tree_digest(Path.cwd()),
              'normal_ci_run_id': int(Path('/tmp/exp289-normal-ci-run-id.txt').read_text().strip()),
              'focused_ci_run_id': int(Path('/tmp/exp289-focused-ci-run-id.txt').read_text().strip()),
          }
          Path('/tmp/exp289-source-identity.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Build locked authoritative EXP-289 DEVELOPMENT geometry
        run: >-
          python scripts/run_exp289_paired_dev.py
          --geometry-manifest protocols/exp289_authoritative_development_v1.json
          --geometry-digest-file protocols/exp289_authoritative_development_v1.sha256
          --output /tmp/exp289-development.json
          --registry-output /tmp/exp289-registry.json

      - name: Preflight sample-size readiness without beacon
        id: prep_state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_exp289_confirmatory_gate_a.py \
            --execution /tmp/exp289-development.json \
            --registry /tmp/exp289-registry.json \
            --output /tmp/exp289-preflight-prep.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prep = json.loads(Path('/tmp/exp289-preflight-prep.json').read_text(encoding='utf-8'))
          status = prep.get('status')
          allowed = {'CONFIRMATORY_GATE_A_PREPARED', 'NOT_READY_VARIANCE_EXCEEDS_MAX_N'}
          if status not in allowed:
              raise SystemExit(f'unexpected EXP-289 preflight status: {status!r}')
          if prep.get('evidence_level') != 'EV-E2' or prep.get('decision') != 'UNVERIFIED':
              raise SystemExit('EXP-289 preflight crossed EV-E2 boundary')
          if prep.get('confirmatory_data_consumed') is not False or prep.get('challenge_materialized') is not False:
              raise SystemExit('EXP-289 preflight consumed challenge evidence')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'status={status}\n')
          print(json.dumps({
              'status': status,
              'confirmatory_n': (prep.get('sample_size_freeze') or {}).get('confirmatory_n'),
              'unclamped_required_n': (prep.get('sample_size_freeze') or {}).get('unclamped_required_n'),
              'confirmatory_data_consumed': prep.get('confirmatory_data_consumed'),
              'challenge_materialized': prep.get('challenge_materialized'),
          }, sort_keys=True))
          PY

      - name: Stage authoritative NOT_READY result
        if: steps.prep_state.outputs.status != 'CONFIRMATORY_GATE_A_PREPARED'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/exp289-final-evidence
          cp /tmp/exp289-development.json /tmp/exp289-final-evidence/development-planning-baseline.json
          cp /tmp/exp289-registry.json /tmp/exp289-final-evidence/development-arm-registry.json
          cp /tmp/exp289-preflight-prep.json /tmp/exp289-final-evidence/gate-a-preflight-prep.json
          cp /tmp/exp289-source-identity.json /tmp/exp289-final-evidence/source-identity.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prep = json.loads(Path('/tmp/exp289-preflight-prep.json').read_text(encoding='utf-8'))
          source = json.loads(Path('/tmp/exp289-source-identity.json').read_text(encoding='utf-8'))
          summary = {
              'schema': 'NLM-EXP-289-REAL-GATE-B-CEREMONY-SUMMARY-V1',
              'ceremony_id': os.environ['CEREMONY_ID'],
              'ceremony_sha': os.environ['GITHUB_SHA'],
              'scientific_baseline_sha': os.environ['BASELINE_SHA'],
              'protocol_digest': source['protocol_digest'],
              'source_tree_digest': source['source_tree_digest'],
              'state': prep['status'],
              'evidence_level': 'EV-E2',
              'decision': 'UNVERIFIED',
              'scientific_evidence_eligible': False,
              'confirmatory_data_consumed': False,
              'challenge_materialized': False,
              'inference_started': False,
              'confirmatory_n': (prep.get('sample_size_freeze') or {}).get('confirmatory_n'),
              'scope_boundary': 'Frozen EXP-289 episode-local exact-nogood challenge family only; no lifelong lemma economy, learned-clause transfer, integrated NLM, or open-domain reasoning authority.',
          }
          Path('/tmp/exp289-final-evidence/ceremony-summary.json').write_text(
              json.dumps(summary, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
          (cd /tmp/exp289-final-evidence && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)

      - name: Freeze authoritative EXP-289 checkpoint and Gate A before beacon
        if: steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED'
        shell: bash
        run: |
          set -euo pipefail
          FREEZE_COMMIT_TIMESTAMP_RAW="$(git show -s --format=%cI "$BASELINE_SHA")"
          FREEZE_COMMIT_TIMESTAMP_UTC="$(FREEZE_COMMIT_TIMESTAMP_RAW="$FREEZE_COMMIT_TIMESTAMP_RAW" python - <<'PY'
          from datetime import datetime, timezone
          import os
          raw = os.environ['FREEZE_COMMIT_TIMESTAMP_RAW']
          normalized = datetime.fromisoformat(raw.replace('Z', '+00:00')).astimezone(timezone.utc)
          print(normalized.isoformat().replace('+00:00', 'Z'))
          PY
          )"
          python scripts/seal_exp289_confirmatory_gate_a.py \
            --execution /tmp/exp289-development.json \
            --registry /tmp/exp289-registry.json \
            --freeze-commit-sha "$BASELINE_SHA" \
            --freeze-commit-timestamp-utc "$FREEZE_COMMIT_TIMESTAMP_UTC" \
            --checkpoint-output /tmp/exp289-checkpoint.pt \
            --checkpoint-receipt-output /tmp/exp289-checkpoint-receipt.json \
            --prep-output /tmp/exp289-gate-a-prep.json \
            --authorization-output /tmp/exp289-gate-a-authorization.json \
            --seal-output /tmp/exp289-gate-a-seal.json
          python - <<'PY'
          import json
          from pathlib import Path
          from nolane_ai.experiments.exp289_checkpoint import validate_exp289_checkpoint_receipt
          from nolane_ai.experiments.exp289_confirmatory_ceremony import validate_exp289_confirmatory_gate_a_seal

          preflight = json.loads(Path('/tmp/exp289-preflight-prep.json').read_text())
          prep = json.loads(Path('/tmp/exp289-gate-a-prep.json').read_text())
          seal = json.loads(Path('/tmp/exp289-gate-a-seal.json').read_text())
          receipt = json.loads(Path('/tmp/exp289-checkpoint-receipt.json').read_text())
          if preflight.get('prep_digest') != prep.get('prep_digest'):
              raise SystemExit('EXP-289 Gate A prep differs from preflight sample-size freeze')
          if validate_exp289_checkpoint_receipt(receipt):
              raise SystemExit('EXP-289 checkpoint receipt failed validation')
          if validate_exp289_confirmatory_gate_a_seal(seal):
              raise SystemExit('EXP-289 Gate A seal failed validation')
          if seal.get('evidence_level') != 'EV-E2' or seal.get('decision') != 'UNVERIFIED':
              raise SystemExit('EXP-289 Gate A scientific boundary drift')
          if seal.get('confirmatory_data_consumed') is not False or seal.get('challenge_materialized') is not False:
              raise SystemExit('EXP-289 Gate A consumed challenge evidence')
          PY

      - name: Record first future public drand beacon after both freeze boundaries
        if: steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import math
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          from nolane_ai.experiments.exp289_beacon import validate_exp289_beacon_receipt
          from nolane_ai.protocol.evidence import canonical_sha256

          seal = json.loads(Path('/tmp/exp289-gate-a-seal.json').read_text(encoding='utf-8'))

          def parse_utc(value: str) -> datetime:
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          boundary = max(
              parse_utc(seal['freeze_commit_timestamp_utc']),
              parse_utc(seal['seal_created_at_utc']),
          )

          def fetch_json(url: str) -> dict:
              last = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers={'User-Agent': 'Nolane-AIv2-EXP289-GateB/1.0'})
                      with urlopen(request, timeout=20) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      if not isinstance(payload, dict):
                          raise RuntimeError(f'non-object JSON from {url}')
                      return payload
                  except Exception as exc:
                      last = exc
                      if attempt != 4:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f'failed to fetch {url}: {last}')

          info = fetch_json('https://api.drand.sh/info')
          genesis = int(info['genesis_time'])
          period = int(info['period'])
          target_round = math.floor((boundary.timestamp() - genesis) / period) + 2
          if target_round < 1:
              target_round = 1
          published_unix = genesis + (target_round - 1) * period
          published = datetime.fromtimestamp(published_unix, timezone.utc)
          if published <= boundary:
              raise RuntimeError('computed drand target round is not strictly after Gate A seal boundary')

          primary_url = f'https://api.drand.sh/public/{target_round}'
          mirror_url = f'https://api2.drand.sh/public/{target_round}'
          primary = None
          mirror = None
          observed_at = None
          for _ in range(90):
              try:
                  candidate_primary = fetch_json(primary_url)
                  candidate_mirror = fetch_json(mirror_url)
              except RuntimeError:
                  time.sleep(2)
                  continue
              if int(candidate_primary.get('round', -1)) != target_round:
                  time.sleep(2)
                  continue
              if int(candidate_mirror.get('round', -1)) != target_round:
                  time.sleep(2)
                  continue
              primary = candidate_primary
              mirror = candidate_mirror
              observed_at = datetime.now(timezone.utc)
              break
          if primary is None or mirror is None or observed_at is None:
              raise RuntimeError('first post-seal drand target round did not become available')
          for field in ('round', 'randomness', 'signature'):
              if primary.get(field) != mirror.get(field):
                  raise RuntimeError(f'drand primary/mirror mismatch for {field}')

          chain_hash = str(info.get('hash', 'unknown'))
          published_iso = published.isoformat().replace('+00:00', 'Z')
          receipt = {
              'schema': 'NLM-EXP-289-BEACON-RECEIPT-V1',
              'experiment_id': 'EXP-289',
              'source': 'drand-public-http-cross-recorded',
              'beacon_id': f'drand:{chain_hash}:{target_round}',
              'published_at_utc': published_iso,
              'entropy_hex': str(primary['randomness']).lower(),
              'evidence_reference': f'{primary_url};{mirror_url};chain={chain_hash}',
              'test_only': False,
              'scientific_evidence_eligible': True,
              'authenticity_status': 'EXTERNAL_EVIDENCE_RECORDED',
              'receipt_digest': '',
          }
          receipt['receipt_digest'] = canonical_sha256(
              {key: value for key, value in receipt.items() if key != 'receipt_digest'}
          )
          errors = validate_exp289_beacon_receipt(
              receipt,
              freeze_commit_timestamp_utc=seal['freeze_commit_timestamp_utc'],
              seal_created_at_utc=seal['seal_created_at_utc'],
          )
          if errors:
              raise RuntimeError('invalid EXP-289 real beacon receipt: ' + '; '.join(errors))

          external = {
              'schema': 'NLM-EXP-289-PUBLIC-BEACON-EXTERNAL-EVIDENCE-V1',
              'ceremony_sha': os.environ['GITHUB_SHA'],
              'scientific_baseline_sha': os.environ['BASELINE_SHA'],
              'observed_at_utc': observed_at.isoformat().replace('+00:00', 'Z'),
              'freeze_commit_timestamp_utc': seal['freeze_commit_timestamp_utc'],
              'seal_created_at_utc': seal['seal_created_at_utc'],
              'target_round_policy': 'first_drand_round_strictly_after_actual_gate_a_seal',
              'target_round': target_round,
              'primary_url': primary_url,
              'mirror_url': mirror_url,
              'chain_info_url': 'https://api.drand.sh/info',
              'chain_info': info,
              'primary_response': primary,
              'mirror_response': mirror,
              'signature_recorded': primary.get('signature'),
              'cross_source_fields_checked': ['round', 'randomness', 'signature'],
              'cryptographic_signature_verified_by_ceremony': False,
              'authenticity_status': 'EXTERNAL_EVIDENCE_RECORDED',
              'beacon_receipt_digest': receipt['receipt_digest'],
          }
          Path('/tmp/exp289-public-beacon-receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          Path('/tmp/exp289-public-beacon-external-evidence.json').write_text(
              json.dumps(external, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'beacon_id': receipt['beacon_id'],
              'published_at_utc': receipt['published_at_utc'],
              'target_round': target_round,
              'receipt_digest': receipt['receipt_digest'],
          }, sort_keys=True))
          PY

      - name: Materialize irreversible inference-start receipt
        if: steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path('/tmp/exp289-source-identity.json').read_text())
          seal = json.loads(Path('/tmp/exp289-gate-a-seal.json').read_text())
          checkpoint = json.loads(Path('/tmp/exp289-checkpoint-receipt.json').read_text())
          beacon = json.loads(Path('/tmp/exp289-public-beacon-receipt.json').read_text())
          payload = {
              'schema': 'NLM-EXP-289-REAL-GATE-B-INFERENCE-START-V1',
              'ceremony_id': os.environ['CEREMONY_ID'],
              'ceremony_sha': os.environ['GITHUB_SHA'],
              'scientific_baseline_sha': os.environ['BASELINE_SHA'],
              'protocol_digest': source['protocol_digest'],
              'source_tree_digest': source['source_tree_digest'],
              'seal_digest': seal['seal_digest'],
              'pre_beacon_binding_digest': seal['pre_beacon_binding_digest'],
              'checkpoint_receipt_digest': checkpoint['receipt_digest'],
              'checkpoint_scientific_identity_digest': checkpoint['scientific_identity_digest'],
              'beacon_receipt_digest': beacon['receipt_digest'],
              'confirmatory_n': seal['confirmatory_n'],
              'reserved_replicate_ids': seal['reserved_replicate_ids'],
              'inference_started': True,
              'challenge_materialized': False,
          }
          Path('/tmp/exp289-inference-started.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Publish irreversible inference-start replay barrier
        id: barrier
        if: steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED'
        uses: actions/upload-artifact@v4
        with:
          name: exp289-real-gate-b-inference-started-${{ github.sha }}
          path: /tmp/exp289-inference-started.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute frozen EXP-289 raw challenge once
        id: raw_execution
        if: steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from nolane_ai.experiments.exp289_confirmatory_executor import (
              execute_exp289_confirmatory_challenge,
              validate_exp289_confirmatory_raw,
          )
          from nolane_ai.protocol.identity import source_tree_digest

          seal = json.loads(Path('/tmp/exp289-gate-a-seal.json').read_text())
          beacon = json.loads(Path('/tmp/exp289-public-beacon-receipt.json').read_text())
          checkpoint = json.loads(Path('/tmp/exp289-checkpoint-receipt.json').read_text())
          code_digest = source_tree_digest(Path.cwd())
          raw = execute_exp289_confirmatory_challenge(
              seal=seal,
              beacon_receipt=beacon,
              checkpoint_path='/tmp/exp289-checkpoint.pt',
              checkpoint_receipt=checkpoint,
              current_source_tree_digest=code_digest,
              executor_code_digest=code_digest,
          )
          errors = validate_exp289_confirmatory_raw(
              raw,
              seal=seal,
              checkpoint_path='/tmp/exp289-checkpoint.pt',
              checkpoint_receipt=checkpoint,
          )
          if errors:
              raise RuntimeError('invalid EXP-289 scientific raw artifact: ' + '; '.join(errors))
          if raw.get('test_only') is not False or raw.get('scientific_evidence_eligible') is not True:
              raise RuntimeError('EXP-289 raw artifact lost scientific eligibility')
          if raw.get('confirmatory_data_consumed') is not True or raw.get('decision_rule_executed') is not False:
              raise RuntimeError('EXP-289 raw evidence boundary drift')
          Path('/tmp/exp289-confirmatory-raw.json').write_text(
              json.dumps(raw, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'status': raw['status'],
              'confirmatory_n': raw['confirmatory_n'],
              'confirmatory_data_consumed': raw['confirmatory_data_consumed'],
              'artifact_digest': raw['artifact_digest'],
          }, sort_keys=True))
          PY

      - name: Detect raw evidence
        id: raw_state
        if: ${{ always() && steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED' && steps.barrier.outcome == 'success' }}
        shell: bash
        run: |
          if test -f /tmp/exp289-confirmatory-raw.json; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable EXP-289 raw evidence before analysis
        id: raw_persistence
        if: steps.raw_state.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: exp289-real-gate-b-raw-${{ github.sha }}
          path: /tmp/exp289-confirmatory-raw.json
          if-no-files-found: error
          retention-days: 90

      - name: Analyze persisted EXP-289 raw evidence once
        id: analysis
        if: steps.raw_persistence.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from nolane_ai.experiments.exp289_confirmatory_analysis import (
              build_exp289_confirmatory_analysis,
              validate_exp289_confirmatory_analysis,
          )
          from nolane_ai.protocol.identity import source_tree_digest

          raw = json.loads(Path('/tmp/exp289-confirmatory-raw.json').read_text())
          seal = json.loads(Path('/tmp/exp289-gate-a-seal.json').read_text())
          checkpoint = json.loads(Path('/tmp/exp289-checkpoint-receipt.json').read_text())
          code_digest = source_tree_digest(Path.cwd())
          analysis = build_exp289_confirmatory_analysis(
              raw_artifact=raw,
              seal=seal,
              checkpoint_path='/tmp/exp289-checkpoint.pt',
              checkpoint_receipt=checkpoint,
              analysis_code_digest=code_digest,
          )
          errors = validate_exp289_confirmatory_analysis(
              analysis,
              raw_artifact=raw,
              seal=seal,
              checkpoint_path='/tmp/exp289-checkpoint.pt',
              checkpoint_receipt=checkpoint,
          )
          if errors:
              raise RuntimeError('invalid EXP-289 scientific analysis: ' + '; '.join(errors))
          if analysis.get('evidence_level') != 'EV-E3' or analysis.get('decision_rule_executed') is not True:
              raise RuntimeError('EXP-289 scientific analysis evidence boundary drift')
          if analysis.get('decision') not in {'PROMOTE_TO_NEXT_STAGE', 'HOLD_UNSTABLE', 'KILL_SUBSYSTEM'}:
              raise RuntimeError('EXP-289 frozen decision is invalid')
          Path('/tmp/exp289-confirmatory-analysis.json').write_text(
              json.dumps(analysis, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'status': analysis['status'],
              'evidence_level': analysis['evidence_level'],
              'decision': analysis['decision'],
              'analysis_digest': analysis['analysis_digest'],
          }, sort_keys=True))
          PY

      - name: Stage authoritative post-inference outcome
        if: ${{ always() && steps.prep_state.outputs.status == 'CONFIRMATORY_GATE_A_PREPARED' && steps.barrier.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/exp289-final-evidence
          cp /tmp/exp289-development.json /tmp/exp289-final-evidence/development-planning-baseline.json
          cp /tmp/exp289-registry.json /tmp/exp289-final-evidence/development-arm-registry.json
          cp /tmp/exp289-source-identity.json /tmp/exp289-final-evidence/source-identity.json
          cp /tmp/exp289-preflight-prep.json /tmp/exp289-final-evidence/gate-a-preflight-prep.json
          cp /tmp/exp289-gate-a-prep.json /tmp/exp289-final-evidence/gate-a-prep.json
          cp /tmp/exp289-checkpoint.pt /tmp/exp289-final-evidence/trained-checkpoint.pt
          cp /tmp/exp289-checkpoint-receipt.json /tmp/exp289-final-evidence/checkpoint-receipt.json
          cp /tmp/exp289-gate-a-authorization.json /tmp/exp289-final-evidence/gate-a-authorization.json
          cp /tmp/exp289-gate-a-seal.json /tmp/exp289-final-evidence/gate-a-seal.json
          cp /tmp/exp289-public-beacon-receipt.json /tmp/exp289-final-evidence/public-beacon-receipt.json
          cp /tmp/exp289-public-beacon-external-evidence.json /tmp/exp289-final-evidence/public-beacon-external-evidence.json
          cp /tmp/exp289-inference-started.json /tmp/exp289-final-evidence/inference-start-receipt.json
          test ! -f /tmp/exp289-confirmatory-raw.json || cp /tmp/exp289-confirmatory-raw.json /tmp/exp289-final-evidence/confirmatory-raw.json
          test ! -f /tmp/exp289-confirmatory-analysis.json || cp /tmp/exp289-confirmatory-analysis.json /tmp/exp289-final-evidence/confirmatory-analysis.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from nolane_ai.experiments.exp289_confirmatory_analysis import validate_exp289_confirmatory_analysis
          from nolane_ai.experiments.exp289_confirmatory_executor import validate_exp289_confirmatory_raw

          evidence = Path('/tmp/exp289-final-evidence')
          source = json.loads((evidence / 'source-identity.json').read_text())
          prep = json.loads((evidence / 'gate-a-prep.json').read_text())
          seal = json.loads((evidence / 'gate-a-seal.json').read_text())
          checkpoint = json.loads((evidence / 'checkpoint-receipt.json').read_text())
          beacon = json.loads((evidence / 'public-beacon-receipt.json').read_text())
          raw_path = evidence / 'confirmatory-raw.json'
          analysis_path = evidence / 'confirmatory-analysis.json'

          state = 'INVALID_RUN'
          decision = 'INVALID_RUN'
          evidence_level = 'EV-E2'
          scientific_eligible = False
          confirmatory_consumed = None
          challenge_materialized = None
          primary = None
          overprune = None
          solution = None
          diagnostics = {'integrity_errors': []}

          if not raw_path.is_file():
              diagnostics['integrity_errors'].append('post-inference execution failed before a raw artifact was durably created')
          else:
              raw = json.loads(raw_path.read_text(encoding='utf-8'))
              raw_errors = validate_exp289_confirmatory_raw(
                  raw,
                  seal=seal,
                  checkpoint_path=evidence / 'trained-checkpoint.pt',
                  checkpoint_receipt=checkpoint,
              )
              confirmatory_consumed = raw.get('confirmatory_data_consumed')
              challenge_materialized = raw.get('challenge_materialized')
              if raw_errors:
                  diagnostics['integrity_errors'].append('persisted raw validation failed: ' + '; '.join(raw_errors))
              elif not analysis_path.is_file():
                  state = 'RAW_PERSISTED_ANALYSIS_FAILED'
                  diagnostics['integrity_errors'].append('scientific raw evidence persisted, but frozen analysis did not produce a valid artifact')
              else:
                  analysis = json.loads(analysis_path.read_text(encoding='utf-8'))
                  analysis_errors = validate_exp289_confirmatory_analysis(
                      analysis,
                      raw_artifact=raw,
                      seal=seal,
                      checkpoint_path=evidence / 'trained-checkpoint.pt',
                      checkpoint_receipt=checkpoint,
                  )
                  if analysis_errors:
                      diagnostics['integrity_errors'].append('analysis validation failed: ' + '; '.join(analysis_errors))
                  elif analysis.get('decision') not in {'PROMOTE_TO_NEXT_STAGE', 'HOLD_UNSTABLE', 'KILL_SUBSYSTEM'}:
                      diagnostics['integrity_errors'].append(f"unexpected frozen scientific decision: {analysis.get('decision')!r}")
                  elif analysis.get('evidence_level') != 'EV-E3' or analysis.get('decision_rule_executed') is not True:
                      diagnostics['integrity_errors'].append('scientific analysis evidence boundary drift')
                  else:
                      state = 'EXECUTED_AND_ANALYZED'
                      decision = analysis['decision']
                      evidence_level = analysis['evidence_level']
                      scientific_eligible = analysis.get('scientific_evidence_eligible') is True
                      confirmatory_consumed = analysis.get('confirmatory_data_consumed')
                      challenge_materialized = raw.get('challenge_materialized')
                      primary = analysis.get('primary_endpoint')
                      overprune = analysis.get('protected_overprune')
                      solution = analysis.get('protected_solution_rate')
                      diagnostics = {'integrity_errors': []}

          summary = {
              'schema': 'NLM-EXP-289-REAL-GATE-B-CEREMONY-SUMMARY-V1',
              'ceremony_id': os.environ['CEREMONY_ID'],
              'ceremony_sha': os.environ['GITHUB_SHA'],
              'scientific_baseline_sha': os.environ['BASELINE_SHA'],
              'protocol_digest': source['protocol_digest'],
              'source_tree_digest': source['source_tree_digest'],
              'state': state,
              'evidence_level': evidence_level,
              'decision': decision,
              'scientific_evidence_eligible': scientific_eligible,
              'confirmatory_data_consumed': confirmatory_consumed,
              'challenge_materialized': challenge_materialized,
              'inference_started': True,
              'confirmatory_n': seal.get('confirmatory_n'),
              'reserved_replicate_ids': seal.get('reserved_replicate_ids'),
              'prep_digest': prep.get('prep_digest'),
              'seal_digest': seal.get('seal_digest'),
              'checkpoint_receipt_digest': checkpoint.get('receipt_digest'),
              'beacon_id': beacon.get('beacon_id'),
              'beacon_receipt_digest': beacon.get('receipt_digest'),
              'beacon_authenticity_status': beacon.get('authenticity_status'),
              'primary_endpoint': primary,
              'protected_overprune': overprune,
              'protected_solution_rate': solution,
              'diagnostics': diagnostics,
              'scope_boundary': 'Frozen EXP-289 episode-local exact-nogood challenge family only; no lifelong lemma economy, learned-clause transfer, integrated NLM, or open-domain reasoning authority.',
          }
          (evidence / 'ceremony-summary.json').write_text(
              json.dumps(summary, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'state': state,
              'decision': decision,
              'evidence_level': evidence_level,
              'confirmatory_n': seal.get('confirmatory_n'),
          }, sort_keys=True))
          PY
          (cd /tmp/exp289-final-evidence && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)

      - name: Publish authoritative EXP-289 outcome marker
        if: ${{ always() && (steps.prep_state.outputs.status != 'CONFIRMATORY_GATE_A_PREPARED' || steps.barrier.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: exp289-real-gate-b-outcome-${{ github.sha }}
          path: /tmp/exp289-final-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Publish outcome-agnostic EXP-289 evidence bundle
        if: ${{ always() && (steps.prep_state.outputs.status != 'CONFIRMATORY_GATE_A_PREPARED' || steps.barrier.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: exp289-real-gate-b-evidence-${{ github.sha }}
          path: /tmp/exp289-final-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce post-inference ceremony completion
        if: ${{ always() && steps.barrier.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/exp289-final-evidence/ceremony-summary.json').read_text())
          if summary.get('state') != 'EXECUTED_AND_ANALYZED':
              raise SystemExit(f"EXP-289 post-inference ceremony did not close validly: {summary!r}")
          if summary.get('evidence_level') != 'EV-E3':
              raise SystemExit('EXP-289 completed scientific ceremony did not reach EV-E3 analysis boundary')
          if summary.get('decision') not in {'PROMOTE_TO_NEXT_STAGE', 'HOLD_UNSTABLE', 'KILL_SUBSYSTEM'}:
              raise SystemExit('EXP-289 completed ceremony decision invalid')
          PY
