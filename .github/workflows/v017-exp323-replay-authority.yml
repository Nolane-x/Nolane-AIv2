name: v017-exp323-replay-authority

on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp323_*.py"
      - "scripts/verify_exp323_replay.py"
      - "protocols/v017/exp323_preregistration_v1.json"
      - ".github/workflows/v017-exp323-replay-authority.yml"
      - ".github/workflows/exp323-second-decay-convergence.yml"

permissions:
  contents: read
  actions: read

jobs:
  replay-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable parent artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          checks = (
              (
                  35339004168,
                  10544985252,
                  "exp322-teacher-forced-intervention-35339004168",
                  "sha256:18eb23aa09086aea89bf9ab96e07c52270069b75e8dc276f7610148b46b2e4cc",
              ),
              (
                  35311529822,
                  10534351390,
                  "exp319-stage-a-A_FIXED-0.0001-c3",
                  "sha256:ee07280fee8379f39ccea16d38f1ff31482975cb39780a75a0592916e8d154c3",
              ),
          )
          for run_id, expected_id, expected_name, expected_digest in checks:
              url = (
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?"
                  + urllib.parse.urlencode({"name": expected_name})
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exp323-replay-authority",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              matches = [a for a in payload["artifacts"] if int(a["id"]) == expected_id]
              if len(matches) != 1:
                  raise SystemExit(f"EXP-323 replay artifact id mismatch: {expected_name}")
              artifact = matches[0]
              if artifact["name"] != expected_name or artifact.get("expired") is not False:
                  raise SystemExit(f"EXP-323 replay artifact metadata mismatch: {expected_name}")
              if artifact.get("digest") != expected_digest:
                  raise SystemExit(f"EXP-323 replay artifact digest mismatch: {expected_name}")
          PY

      - name: Download sealed EXP-322 evidence
        uses: actions/download-artifact@v4
        with:
          name: exp322-teacher-forced-intervention-35339004168
          path: parent-exp322
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35339004168

      - name: Download immutable selected A_FIXED checkpoint
        uses: actions/download-artifact@v4
        with:
          name: exp319-stage-a-A_FIXED-0.0001-c3
          path: input
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35311529822

      - name: Install exact PR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e '.[dev,model]'

      - name: Replay only through exact step 2048
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_exp323_replay.py \
            --checkpoint input/checkpoint.pt \
            --receipt input/receipt.json \
            --parent-exp322 parent-exp322/exp322-final.json \
            --output evidence/exp323-replay-authority.json

      - name: Assert replay receipt and zero post-2048 steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("evidence/exp323-replay-authority.json").read_text())
          expected = {
              "schema": "EXP323-REPLAY-AUTHORITY-RECEIPT-V1",
              "verified": True,
              "completed_step": 2048,
              "model_state_digest": "4d3b848d193e6e465473dab7346edaafa3ee0ffc870eac600c6c46952ca880fc",
              "optimizer_state_digest": "9b32588f0bc63881aa974df54829c4cda1d9e4913aa0fcc40cff5d5f2cddeb79",
              "rng_state_digest": "e293380e9776eb9e373bd0c3d3ab6a8aa4d0ab3b6764dc582bc859efc12fca07",
              "nonfinite_events": 0,
              "post_2048_optimizer_steps": 0,
          }
          if p != expected:
              raise SystemExit("EXP-323 replay authority receipt mismatch")
          PY

      - name: Upload replay authority receipt
        uses: actions/upload-artifact@v4
        with:
          name: exp323-replay-authority-${{ github.run_id }}
          path: evidence/exp323-replay-authority.json
          if-no-files-found: error
          retention-days: 90
