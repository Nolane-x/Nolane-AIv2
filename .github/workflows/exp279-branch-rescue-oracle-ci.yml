name: exp279-branch-rescue-oracle-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-branch-rescue-oracle-ci.yml
      - src/nolane_ai/experiments/exp279_branch_rescue_oracle.py
      - scripts/run_exp279_branch_rescue_oracle_dev.py
      - tests/test_exp279_branch_rescue_oracle_import.py
      - tests/test_exp279_branch_rescue_oracle.py
      - docs/superpowers/plans/2026-09-11-exp279-branch-rescue-oracle.md

permissions:
  contents: read

jobs:
  fast-import-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run fast branch-rescue import contract
        run: pytest -q tests/test_exp279_branch_rescue_oracle_import.py

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run branch-rescue oracle contract
        run: pytest -q tests/test_exp279_branch_rescue_oracle.py
