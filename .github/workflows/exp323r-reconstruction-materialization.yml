name: EXP-323R reconstruction materialization (locked historical helper)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable parent artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          checks = (
              (
                  35339004168,
                  10544985252,
                  "exp322-teacher-forced-intervention-35339004168",
                  "sha256:18eb23aa09086aea89bf9ab96e07c52270069b75e8dc276f7610148b46b2e4cc",
              ),
              (
                  35311529822,
                  10534351390,
                  "exp319-stage-a-A_FIXED-0.0001-c3",
                  "sha256:ee07280fee8379f39ccea16d38f1ff31482975cb39780a75a0592916e8d154c3",
              ),
          )
          for run_id, expected_id, expected_name, expected_digest in checks:
              url = (
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?"
                  + urllib.parse.urlencode({"name": expected_name})
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exp323r-reconstruction-materialization",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              matches = [a for a in payload["artifacts"] if int(a["id"]) == expected_id]
              if len(matches) != 1:
                  raise SystemExit(f"EXP-323R artifact id mismatch: {expected_name}")
              artifact = matches[0]
              if artifact["name"] != expected_name or artifact.get("expired") is not False:
                  raise SystemExit(f"EXP-323R artifact metadata mismatch: {expected_name}")
              if artifact.get("digest") != expected_digest:
                  raise SystemExit(f"EXP-323R artifact digest mismatch: {expected_name}")
          PY

      - name: Download sealed EXP-322 evidence
        uses: actions/download-artifact@v4
        with:
          name: exp322-teacher-forced-intervention-35339004168
          path: parent-exp322
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35339004168

      - name: Download immutable selected A_FIXED checkpoint
        uses: actions/download-artifact@v4
        with:
          name: exp319-stage-a-A_FIXED-0.0001-c3
          path: input
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35311529822

      - name: Install exact repair runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e '.[dev,model]'

      - name: Attempt exact reconstruction
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          out="attempt-${{ matrix.attempt }}"
          python scripts/exp323r_materialize_reconstruction.py \
            --checkpoint input/checkpoint.pt \
            --receipt input/receipt.json \
            --parent-exp322 parent-exp322/exp322-final.json \
            --output-dir "$out" \
            --attempt-index "${{ matrix.attempt }}"
          if test -f "$out/reconstruction.pt"; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload exact reconstruction candidate
        if: steps.replay.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exp323r-reconstruction-candidate-${{ github.run_id }}-${{ matrix.attempt }}
          path: |
            attempt-${{ matrix.attempt }}/reconstruction.pt
            attempt-${{ matrix.attempt }}/reconstruction-receipt.json
            attempt-${{ matrix.attempt }}/diagnostic.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload per-attempt diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: exp323r-reconstruction-diagnostic-${{ github.run_id }}-${{ matrix.attempt }}
          path: attempt-${{ matrix.attempt }}/diagnostic.json
          if-no-files-found: error
          retention-days: 90

  require-candidate:
    needs: materialize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp323r-reconstruction-materialization",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          candidates = sorted(
              a for a in payload["artifacts"]
              if a["name"].startswith("exp323r-reconstruction-candidate-")
          )
          if not candidates:
              raise SystemExit("EXP-323R bounded reconstruction pool produced no exact candidate")
          print(json.dumps([
              {"id": a["id"], "name": a["name"], "digest": a.get("digest")}
              for a in candidates
          ], sort_keys=True))
          PY
