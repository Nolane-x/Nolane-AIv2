name: cancel-exp335-duplicate-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-exp335-duplicate-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel accidental duplicate EXP-335 run
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN_ID: "35447261711"
          PRIMARY_RUN_ID: "35445927525"
        shell: bash
        run: |
          set -euo pipefail
          primary_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRIMARY_RUN_ID}" --jq '.status')"
          duplicate_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DUPLICATE_RUN_ID}" --jq '.status')"
          echo "primary=${PRIMARY_RUN_ID} status=${primary_status}"
          echo "duplicate=${DUPLICATE_RUN_ID} status=${duplicate_status}"
          if [ "${duplicate_status}" = "queued" ] || [ "${duplicate_status}" = "in_progress" ] || [ "${duplicate_status}" = "waiting" ] || [ "${duplicate_status}" = "pending" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${DUPLICATE_RUN_ID}/cancel"
            echo "duplicate cancellation requested"
          else
            echo "duplicate no longer cancellable; no action"
          fi
