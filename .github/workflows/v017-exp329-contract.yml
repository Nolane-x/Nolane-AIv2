name: v017-exp329-contract
on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp329_*.py"
      - "scripts/exp329_run.py"
      - "protocols/v017/exp329_*"
      - "tests/test_exp329_*.py"
      - ".github/workflows/exp329-p02-cross-update-interference.yml"
      - ".github/workflows/v017-exp329-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_exp329_contract.py tests/test_exp329_runtime_surface.py tests/test_exp329_workflow.py
