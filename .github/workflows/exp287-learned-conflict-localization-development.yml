name: exp287-learned-conflict-localization-development

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - protocols/exp287-learned-conflict-localization-release.lock

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require marker-only frozen EXP-287 release at exact PR head
        run: |
          set -euo pipefail
          MARKER=protocols/exp287-learned-conflict-localization-release.lock
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          LAST_TOUCH=$(git log -1 --format=%H -- "$MARKER")
          test "$LAST_TOUCH" = "${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED < <(git diff --name-only HEAD^ HEAD)
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "$MARKER"
          PRE_MARKER=$(git rev-parse HEAD^)
          export PRE_MARKER
          python - <<'PY'
          import os
          from pathlib import Path

          pre_marker = os.environ["PRE_MARKER"]
          expected = f"""EXP287_LEARNED_CONFLICT_LOCALIZATION_RELEASE_V1
          canonical_indices=0,1,2,3
          train_replicates=64
          eval_replicates=32
          eval_start_replicate=10000
          batch_size=8
          d_model=64
          hidden_size=48
          target_parameters=500000
          timesteps=4
          variables=8
          decoys=3
          max_search_steps=16
          noise_std=0.05
          lr=0.002
          weight_decay=0.0
          top_k=2
          capture_threshold=0.5
          precision_threshold=0.5
          solution_rate_floor_delta=-0.005
          root_prefix=20260913-exp287-learned-conflict-localization-v1-dev
          protocol_digest=c010d90b9d626cfde4f7727b76fcd053f1ebf7f2f7aa201d7d13d2d828cef440
          geometry_digest=096a78bd6d7922c19943e1f3a249737fb5f3eff3325c5e7753d765e0b66e0dac
          authority_scope=DEVELOPMENT_EV_E2_ONLY
          pre_marker_head={pre_marker}
          """
          expected = "\n".join(line.strip() for line in expected.splitlines() if line.strip()) + "\n"
          actual = Path("protocols/exp287-learned-conflict-localization-release.lock").read_text(encoding="utf-8")
          if actual != expected:
              raise SystemExit("EXP-287 release marker content mismatch")
          PY
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Verify frozen EXP-287 geometry identity
        run: |
          test "$(sha256sum protocols/exp287_development_v1.json | awk '{print $1}')" = "$(tr -d '\n' < protocols/exp287_development_v1.sha256)"
          PYTHONPATH=src python - <<'PY'
          from nolane_ai.experiments.exp287_development_geometry import load_exp287_development_geometry
          geometry, digest = load_exp287_development_geometry(
              "protocols/exp287_development_v1.json",
              "protocols/exp287_development_v1.sha256",
              protocol_digest="c010d90b9d626cfde4f7727b76fcd053f1ebf7f2f7aa201d7d13d2d828cef440",
          )
          assert geometry["canonical_indices"] == [0, 1, 2, 3]
          assert geometry["train_replicates"] == 64
          assert geometry["eval_replicates"] == 32
          assert digest == "096a78bd6d7922c19943e1f3a249737fb5f3eff3325c5e7753d765e0b66e0dac"
          PY

  root:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        canonical_index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run frozen EXP-287 canonical root
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CANONICAL_INDEX: ${{ matrix.canonical_index }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          WORK=/tmp/exp287-root-${CANONICAL_INDEX}
          mkdir -p "$WORK"
          python scripts/run_exp287_learned_conflict_localization_dev.py \
            --canonical-index "$CANONICAL_INDEX" \
            --output "$WORK/receipt.json"
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from pathlib import Path
          from nolane_ai.protocol.identity import source_tree_digest

          work = Path(f"/tmp/exp287-root-{os.environ['CANONICAL_INDEX']}")
          identity = {
              "schema": "NLM-EXP-287-DEVELOPMENT-EXECUTION-IDENTITY-V1",
              "canonical_index": int(os.environ["CANONICAL_INDEX"]),
              "repository_head_sha": os.environ["PR_HEAD"],
              "github_event_sha": os.environ["GITHUB_SHA"],
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_tree_digest": source_tree_digest(Path.cwd()),
              "protocol_digest": "c010d90b9d626cfde4f7727b76fcd053f1ebf7f2f7aa201d7d13d2d828cef440",
          }
          work.joinpath("execution-identity.json").write_text(
              json.dumps(identity, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify root receipt and sidecar before upload
        env:
          CANONICAL_INDEX: ${{ matrix.canonical_index }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from nolane_ai.experiments.exp287_receipts import canonical_json_bytes, validate_exp287_root_receipt

          work = Path(f"/tmp/exp287-root-{os.environ['CANONICAL_INDEX']}")
          receipt = work / "receipt.json"
          payload = receipt.read_bytes()
          expected_sha = hashlib.sha256(payload).hexdigest() + "\n"
          assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8") == expected_sha
          data = json.loads(payload)
          assert payload == canonical_json_bytes(data)
          validate_exp287_root_receipt(data)
          assert data["canonical_index"] == int(os.environ["CANONICAL_INDEX"])
          assert data["scientific_evidence_eligible"] is False
          assert data["confirmatory_data_consumed"] is False
          assert data["challenge_materialized"] is False
          assert data["promotion_claimed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp287-root-${{ matrix.canonical_index }}-${{ github.sha }}
          path: /tmp/exp287-root-${{ matrix.canonical_index }}
          if-no-files-found: error
          retention-days: 90

  cross:
    needs: root
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only reducer environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: exp287-root-*-${{ github.sha }}
          path: /tmp/exp287-roots
      - name: Verify exactly four roots and reduce cross-root court
        run: |
          set -euo pipefail
          mapfile -t ROOTS < <(find /tmp/exp287-roots -type f -name receipt.json | sort)
          test "${#ROOTS[@]}" -eq 4
          WORK=/tmp/exp287-cross
          mkdir -p "$WORK"
          python scripts/reduce_exp287_learned_conflict_localization_dev.py \
            --root-receipts "${ROOTS[0]}" "${ROOTS[1]}" "${ROOTS[2]}" "${ROOTS[3]}" \
            --output "$WORK/receipt.json"
      - name: Verify sealed cross receipt and boundaries
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from nolane_ai.experiments.exp287_receipts import canonical_json_bytes, validate_exp287_cross_receipt
          from nolane_ai.protocol.identity import source_tree_digest

          work = Path("/tmp/exp287-cross")
          receipt = work / "receipt.json"
          payload = receipt.read_bytes()
          assert receipt.with_name("receipt.json.sha256").read_text(encoding="utf-8") == hashlib.sha256(payload).hexdigest() + "\n"
          data = json.loads(payload)
          assert payload == canonical_json_bytes(data)
          validate_exp287_cross_receipt(data)
          assert data["scientific_evidence_eligible"] is False
          assert data["confirmatory_data_consumed"] is False
          assert data["challenge_materialized"] is False
          assert data["promotion_claimed"] is False
          identity = {
              "schema": "NLM-EXP-287-DEVELOPMENT-CROSS-EXECUTION-IDENTITY-V1",
              "repository_head_sha": os.environ["PR_HEAD"],
              "github_event_sha": os.environ["GITHUB_SHA"],
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_tree_digest": source_tree_digest(Path.cwd()),
              "protocol_digest": data["protocol_digest"],
              "cross_artifact_digest": data["artifact_digest"],
          }
          work.joinpath("execution-identity.json").write_text(
              json.dumps(identity, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp287-cross-${{ github.sha }}
          path: /tmp/exp287-cross
          if-no-files-found: error
          retention-days: 90
