name: Dispatch sealed EXP-336 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp336-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: exp336-cnrs-full32-stage-a-projection-inheritance-design
      EXPECTED_MARKER_SHA: 08e2caebca4c1b7e4b197f6d2190ef90e94468fd
      EXPECTED_IDENTITY_SHA256: a8f81a0494ba00658d0e8eeea4c0112f1a0547e436783a557b1e70ec9091a190
      TARGET_WORKFLOW: exp336-cnrs-full32-stage-a.yml
    steps:
      - name: Verify exact sealed marker and zero prior dispatches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$actual_sha" = "$EXPECTED_MARKER_SHA"

          gh api "repos/${GITHUB_REPOSITORY}/contents/protocols/v017/exp336_execution_identity_v1.json?ref=${TARGET_BRANCH}"             --jq '.content' | tr -d '\n' | base64 -d > /tmp/exp336-identity.json
          observed_identity="$(sha256sum /tmp/exp336-identity.json | awk '{print $1}')"
          test "$observed_identity" = "$EXPECTED_IDENTITY_SHA256"

          prior="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100"               --jq '.total_count'
          )"
          test "$prior" = "0"

      - name: Dispatch exact sealed EXP-336 branch once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh api
          --method POST
          "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches"
          -f "ref=${TARGET_BRANCH}"
