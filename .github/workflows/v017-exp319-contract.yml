name: v017-exp319-contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v017-exp319-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-contract:
    if: github.event.pull_request.head.ref == 'exp319-learnability-foundation-design'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Verify frozen EXP-319 preregistration
        run: >-
          python scripts/verify_exp319_contract.py
          --protocol protocols/v017/exp319_preregistration_v1.json
          --digest-file protocols/v017/exp319_preregistration_v1.sha256
      - name: Verify EXP-319 contract, identity, freeze, CLI, and workflow surfaces
        run: >-
          pytest -q
          tests/test_exp319_contract.py
          tests/test_exp319_worlds.py
          tests/test_exp319_metrics.py
          tests/test_exp319_training.py
          tests/test_exp319_stage_b_train_metric.py
          tests/test_exp319_selection.py
          tests/test_exp319_challenge.py
          tests/test_exp319_evidence.py
          tests/test_exp319_identity.py
          tests/test_exp319_freeze.py
          tests/test_exp319_cli.py
          tests/test_exp319_workflow.py
          tests/test_exp301_training.py
      - run: python -m compileall -q src scripts
