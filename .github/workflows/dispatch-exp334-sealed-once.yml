name: Dispatch sealed EXP-334 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp334-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-334 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp334-higher-order-conflict-subspace-rescue.yml/dispatches
          -f ref=exp334-higher-order-conflict-subspace-rescue
