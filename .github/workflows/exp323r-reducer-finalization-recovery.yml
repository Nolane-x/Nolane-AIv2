name: EXP-323R reducer finalization recovery

on:
  pull_request:
    paths:
      - ".github/workflows/exp323r-reducer-finalization-recovery.yml"
      - "docs/superpowers/specs/2026-09-18-exp323r-reducer-finalization-recovery.md"
      - "tests/test_exp323r_finalization_recovery.py"

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "35354410137"
  SOURCE_MARKER_SHA: "217477a911aabbb764741e76cca38e54013e7da6"
  FROZEN_SOURCE_SHA: "471d211e15b4840d06536e9b2edbc404958612b2"
  EXECUTION_DIGEST: "70ebb1bda4c91f457aae1007df0d939f2f2a144257dfebf5481ee6dc55b10cd9"

jobs:
  recover-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: recovery

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify procedural-only recovery surface
        shell: bash
        run: |
          set -euo pipefail
          cd recovery
          git diff --name-only "$SOURCE_MARKER_SHA" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/exp323r-reducer-finalization-recovery.yml' \
            'docs/superpowers/specs/2026-09-18-exp323r-reducer-finalization-recovery.md' \
            'tests/test_exp323r_finalization_recovery.py' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          python -m pip install -e '.[dev]'
          pytest -q tests/test_exp323r_finalization_recovery.py

      - name: Verify immutable source run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          run=os.environ["SOURCE_RUN_ID"]
          headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"exp323r-finalization-recovery",
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)
          base=f"https://api.github.com/repos/{repo}/actions/runs/{run}"
          info=get(base)
          if info["status"]!="completed" or info["conclusion"]!="failure":
              raise SystemExit("source run status mismatch")
          if info["event"]!="workflow_dispatch" or info["head_sha"]!=os.environ["SOURCE_MARKER_SHA"]:
              raise SystemExit("source run identity mismatch")
          if int(info["run_number"])!=1:
              raise SystemExit("source run number mismatch")
          jobs=get(base+"/jobs?per_page=100")["jobs"]
          observed={j["name"]:j["conclusion"] for j in jobs}
          expected={
              "intervention (HOLD_5E5)":"success",
              "intervention (DECAY_2P5E5)":"success",
              "reduce":"failure",
          }
          if observed!=expected:
              raise SystemExit(f"source job geometry mismatch: {observed}")
          PY

      - name: Verify exact source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          expected={
            10551422072:("exp323r-HOLD_5E5-35354410137","sha256:c71ff48acfe7de3e3b6a96b7a967e391a7746948385e707efaaf1b3598b12093"),
            10551321837:("exp323r-DECAY_2P5E5-35354410137","sha256:eda5e2fb46ecbe6b7e1bc6c8b6a3f014bfe4c72df31fad9e96d121163b516708"),
          }
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN_ID']}/artifacts"
          req=urllib.request.Request(url,headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"exp323r-finalization-recovery",
          })
          with urllib.request.urlopen(req) as r: payload=json.load(r)
          by_id={int(a["id"]):a for a in payload["artifacts"]}
          for aid,(name,digest) in expected.items():
              a=by_id.get(aid)
              if a is None or a["name"]!=name or a.get("digest")!=digest or a.get("expired") is not False:
                  raise SystemExit(f"artifact metadata mismatch: {aid}")
          PY

      - name: Checkout exact frozen scientific source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE_SHA }}
          fetch-depth: 1
          path: frozen

      - name: Checkout exact sealed marker
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_MARKER_SHA }}
          fetch-depth: 1
          path: marker

      - name: Verify frozen source identity binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          marker=json.loads(Path("marker/protocols/v017/exp323r_execution_identity_v1.json").read_text())
          if marker["source_commit_sha"]!=os.environ["FROZEN_SOURCE_SHA"]:
              raise SystemExit("frozen source SHA mismatch")
          if marker["exp323r_execution_digest"]!=os.environ["EXECUTION_DIGEST"]:
              raise SystemExit("execution digest mismatch")
          workflow=Path("frozen/.github/workflows/exp323r-second-decay-convergence.yml").read_bytes()
          if hashlib.sha256(workflow).hexdigest()!=marker["workflow_sha256"]:
              raise SystemExit("frozen workflow digest mismatch")
          PY

      - name: Download immutable HOLD evidence
        uses: actions/download-artifact@v4
        with:
          name: exp323r-HOLD_5E5-35354410137
          path: hold
          repository: Nolane-x/Nolane-AIv2
          run-id: 35354410137
          github-token: ${{ github.token }}

      - name: Download immutable DECAY evidence
        uses: actions/download-artifact@v4
        with:
          name: exp323r-DECAY_2P5E5-35354410137
          path: decay
          repository: Nolane-x/Nolane-AIv2
          run-id: 35354410137
          github-token: ${{ github.token }}

      - name: Verify immutable evidence-file hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum hold/evidence.json | awk '{print $1}')" = "4cb2296f8c7a40727f5087ed6da5b01b4379f84111668a107c5b23ad25caa0d1"
          test "$(sha256sum decay/evidence.json | awk '{print $1}')" = "a05cc80410e3c7281122bfee7cde343262690a2c04cf8085188d75914ff9c451"

      - name: Install exact frozen reducer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e './frozen[dev,model]'

      - name: Reduce immutable arm evidence with unchanged frozen reducer
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/frozen/src"
          python frozen/scripts/exp323r_reduce.py \
            --hold hold/evidence.json \
            --decay decay/evidence.json \
            --output recovered/exp323r-final.json

      - name: Verify recovered final evidence and write recovery receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def canonical(v):
              return json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          final_path=Path("recovered/exp323r-final.json")
          final=json.loads(final_path.read_text())
          materialized=dict(final)
          claimed=materialized.pop("evidence_digest")
          if hashlib.sha256(canonical(materialized)).hexdigest()!=claimed:
              raise SystemExit("final evidence digest mismatch")
          if final.get("decision")!="NO_REGISTERED_RESCUE":
              raise SystemExit(f"unexpected frozen reducer decision: {final.get('decision')}")
          if final.get("selection_lock_digest")!="f74a22e4b3202f5157f0ca71faceedf69cbbf172f04a88aeaf8206f03066d011":
              raise SystemExit("selection lock mismatch")
          if final.get("arm_evidence_digests")!={
              "HOLD_5E5":"34326f59ceb05030403bad187c09b29f5b103e711551b451c60680858efe2946",
              "DECAY_2P5E5":"e91840bc531f74bf7899e0ddb587c55330df4b60610e9ba29e28879e76d88ac6",
          }:
              raise SystemExit("arm evidence digest mismatch")
          identity=final.get("execution_identity",{})
          if identity.get("exp323r_execution_digest")!=os.environ["EXECUTION_DIGEST"]:
              raise SystemExit("execution identity mismatch")
          for key in (
              "exp302_implementation_authorized","exp320_implementation_authorized",
              "scale_authorized","authorized_30m","authorized_100m",
          ):
              if final.get(key) is not False:
                  raise SystemExit(f"forbidden authorization: {key}")
          receipt={
              "schema":"EXP323R-REDUCER-FINALIZATION-RECOVERY-RECEIPT-V1",
              "source_run_id":int(os.environ["SOURCE_RUN_ID"]),
              "source_marker_sha":os.environ["SOURCE_MARKER_SHA"],
              "frozen_source_sha":os.environ["FROZEN_SOURCE_SHA"],
              "execution_digest":os.environ["EXECUTION_DIGEST"],
              "hold_artifact_id":10551422072,
              "hold_artifact_zip_digest":"c71ff48acfe7de3e3b6a96b7a967e391a7746948385e707efaaf1b3598b12093",
              "hold_evidence_file_sha256":"4cb2296f8c7a40727f5087ed6da5b01b4379f84111668a107c5b23ad25caa0d1",
              "hold_arm_evidence_digest":"34326f59ceb05030403bad187c09b29f5b103e711551b451c60680858efe2946",
              "decay_artifact_id":10551321837,
              "decay_artifact_zip_digest":"eda5e2fb46ecbe6b7e1bc6c8b6a3f014bfe4c72df31fad9e96d121163b516708",
              "decay_evidence_file_sha256":"a05cc80410e3c7281122bfee7cde343262690a2c04cf8085188d75914ff9c451",
              "decay_arm_evidence_digest":"e91840bc531f74bf7899e0ddb587c55330df4b60610e9ba29e28879e76d88ac6",
              "recovery_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "recovery_execution_sha":os.environ["GITHUB_SHA"],
              "final_evidence_digest":claimed,
              "decision":final["decision"],
              "exp302_implementation_authorized":False,
              "exp320_implementation_authorized":False,
              "scale_authorized":False,
              "authorized_30m":False,
              "authorized_100m":False,
          }
          receipt["receipt_digest"]=hashlib.sha256(canonical(receipt)).hexdigest()
          Path("recovered/exp323r-recovery-receipt.json").write_bytes(canonical(receipt)+b"\n")
          print("Recovered decision:",final["decision"])
          print("Final evidence digest:",claimed)
          print("Recovery receipt digest:",receipt["receipt_digest"])
          PY

      - name: Upload recovered final EXP-323R evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp323r-final-recovered-run-35354410137
          path: recovered
          if-no-files-found: error
          retention-days: 90
