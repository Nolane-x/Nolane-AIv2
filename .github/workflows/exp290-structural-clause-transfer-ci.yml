name: exp290-structural-clause-transfer-ci

on:
  pull_request:
    paths:
      - 'docs/superpowers/specs/2026-09-13-exp290-structural-clause-transfer-design.md'
      - 'docs/superpowers/plans/2026-09-13-exp290-structural-clause-transfer-implementation.md'
      - 'protocols/exp290_structural_clause_transfer_v1.json'
      - 'protocols/exp290_structural_clause_transfer_v1.sha256'
      - 'src/nolane_ai/experiments/exp290_*.py'
      - 'src/nolane_ai/experiments/matched_clause_transfer_arms.py'
      - 'scripts/*exp290*.py'
      - 'tests/test_exp290_*.py'
      - '.github/workflows/exp290-structural-clause-transfer-*.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Run EXP-290 focused contract
        run: pytest -q tests/test_exp290_*.py
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
