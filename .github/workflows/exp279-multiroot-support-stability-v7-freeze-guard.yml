name: exp279-multiroot-support-stability-v7-freeze-guard

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  cancel-duplicate-v7-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SCIENTIFIC_RUN_ID: '34673221095'
      SOURCE_RECOVERY_RUN_ID: '34674074776'
      V7_WORKFLOW_ID: '356295561'
      RECOVERY_WORKFLOW_ID: '356303191'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel duplicate scientific and recovery runs
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          protected = {
              int(os.environ['SOURCE_SCIENTIFIC_RUN_ID']),
              int(os.environ['SOURCE_RECOVERY_RUN_ID']),
          }
          workflow_ids = (
              int(os.environ['V7_WORKFLOW_ID']),
              int(os.environ['RECOVERY_WORKFLOW_ID']),
          )

          cancelled = []
          observed = []
          for workflow_id in workflow_ids:
              payload = subprocess.check_output(
                  [
                      'gh', 'api',
                      f'repos/{repo}/actions/workflows/{workflow_id}/runs?event=pull_request&per_page=100',
                  ],
                  text=True,
              )
              for run in json.loads(payload)['workflow_runs']:
                  run_id = int(run['id'])
                  status = run['status']
                  observed.append({'id': run_id, 'workflow_id': workflow_id, 'status': status})
                  if run_id in protected or status not in {'queued', 'in_progress', 'pending', 'requested', 'waiting'}:
                      continue
                  completed = subprocess.run(
                      [
                          'gh', 'api', '--method', 'POST',
                          f'repos/{repo}/actions/runs/{run_id}/cancel',
                      ],
                      text=True,
                      capture_output=True,
                  )
                  if completed.returncode != 0:
                      raise SystemExit(
                          f'failed to cancel V7 duplicate run {run_id}: {completed.stderr.strip()}'
                      )
                  cancelled.append(run_id)

          print(json.dumps({
              'schema': 'NLM-EXP-279-V7-FREEZE-GUARD-V1',
              'protected_source_scientific_run_id': int(os.environ['SOURCE_SCIENTIFIC_RUN_ID']),
              'protected_source_recovery_run_id': int(os.environ['SOURCE_RECOVERY_RUN_ID']),
              'cancelled_duplicate_run_ids': sorted(cancelled),
              'observed_runs': observed,
          }, sort_keys=True))
          PY
