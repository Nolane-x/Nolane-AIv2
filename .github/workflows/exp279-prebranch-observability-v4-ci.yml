name: exp279-prebranch-observability-v4-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-prebranch-observability-v4-ci.yml
      - src/nolane_ai/experiments/exp279_prebranch_observability_v4.py
      - src/nolane_ai/experiments/exp279_prebranch_observability_v4_cross_cell.py
      - scripts/run_exp279_prebranch_observability_v4_dev.py
      - tests/test_exp279_prebranch_observability_v4.py
      - tests/test_exp279_prebranch_observability_v4_cli.py
      - tests/test_exp279_prebranch_observability_v4_cross_cell.py
      - docs/superpowers/specs/2026-09-11-exp279-prebranch-observability-v4-design.md
      - docs/superpowers/plans/2026-09-11-exp279-prebranch-observability-v4.md

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run V4 focused contract
        run: |
          pytest -q \
            tests/test_exp279_prebranch_observability_v4.py \
            tests/test_exp279_prebranch_observability_v4_cli.py
      - name: Compile analysis surface
        run: python -m compileall -q src scripts
