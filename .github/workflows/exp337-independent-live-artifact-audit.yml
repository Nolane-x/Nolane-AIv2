name: EXP-337 independent live artifact audit

on:
  push:
    branches: [exp337-live-audit-runner]
    paths:
      - ".github/workflows/exp337-independent-live-artifact-audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUTHORITATIVE_RUN_ID: "35503733893"
      SEALED_MARKER_SHA: "ec5f98a636e9395a76509493800b6b9f06a33271"
      FROZEN_AUDITOR_SHA: "debc13fd4ec8f8ed443302ef0352d751661faafc"
    steps:
      - name: Checkout frozen auditor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_AUDITOR_SHA }}
          path: auditor
          fetch-depth: 1
      - name: Checkout authority records
        uses: actions/checkout@v4
        with:
          ref: main
          path: authority
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover and hash current authoritative chunks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-input audit-output
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path

          repo=os.environ["GITHUB_REPOSITORY"]
          run_id=int(os.environ["AUTHORITATIVE_RUN_ID"])
          token=os.environ["GH_TOKEN"]
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"exp337-independent-live-audit",
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as response: return json.load(response)

          run=get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          assert run["head_sha"]==os.environ["SEALED_MARKER_SHA"]
          assert run["event"]=="workflow_dispatch"
          assert int(run["run_attempt"])==1
          assert run["path"]==".github/workflows/exp337-self-rollin-stage-a.yml"

          lock=json.loads(Path("authority/protocols/v017/exp337_authoritative_run_lock_v1.json").read_text())
          receipt=json.loads(Path("authority/protocols/v017/exp337_authoritative_run_lock_receipt_v1.json").read_text())
          assert int(lock["authoritative_run"]["id"])==run_id
          assert lock["authoritative_run"]["head_sha"]==os.environ["SEALED_MARKER_SHA"]
          assert receipt["run_lock_git_blob_sha"]=="f9d96d59628eea8765814c1fba1d7cb8898ea221"

          listing=get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          by_name={x["name"]:x for x in listing.get("artifacts",[])}
          identity_name=f"exp337-identity-{run_id}"
          identity_present=identity_name in by_name

          chunks=[]
          for index in range(8):
              name=f"exp337-chunk-{index}-{run_id}"
              if name not in by_name:
                  break
              chunks.append((index,by_name[name]))
          first_missing=len(chunks)
          for index in range(first_missing+1,8):
              if f"exp337-chunk-{index}-{run_id}" in by_name:
                  raise SystemExit(f"EXP-337 non-consecutive chunk artifacts: gap before {index}")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,response_headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def download(item,dst):
              request=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{item['id']}/zip",
                  headers=headers,
              )
              try:
                  opener.open(request)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301,302,303,307,308): raise
                  location=exc.headers.get("Location")
              else:
                  raise RuntimeError("artifact endpoint did not redirect")
              if not location: raise RuntimeError("artifact redirect missing Location")
              with urllib.request.urlopen(
                  urllib.request.Request(location,headers={"User-Agent":"exp337-independent-live-audit"})
              ) as response:
                  data=response.read()
              observed=hashlib.sha256(data).hexdigest()
              expected=str(item["digest"]).removeprefix("sha256:")
              if observed!=expected:
                  raise SystemExit(f"raw ZIP SHA mismatch {item['name']}: {observed} != {expected}")
              Path(dst).write_bytes(data)
              return observed

          manifest=[]
          for index,item in chunks:
              digest=download(item,f"audit-input/chunk{index}.zip")
              manifest.append({
                  "chunk_index":index,
                  "artifact_id":item["id"],
                  "artifact_name":item["name"],
                  "artifact_sha256":digest,
                  "size_in_bytes":item["size_in_bytes"],
                  "created_at":item["created_at"],
              })

          state={
              "schema":"EXP337-LIVE-DISCOVERY-V1",
              "authoritative_run_id":run_id,
              "identity_artifact_present":identity_present,
              "verified_download_count":len(manifest),
              "chunk_manifest":manifest,
              "run_status":run["status"],
              "run_conclusion":run["conclusion"],
          }
          Path("audit-input/discovered-chunks.json").write_text(json.dumps(state,sort_keys=True,indent=2)+"\n")
          Path("audit-input/chunk-count.txt").write_text(str(len(manifest)))
          print(json.dumps(state,sort_keys=True,indent=2))
          PY
      - name: Run frozen auditor over currently available consecutive chunks
        shell: bash
        run: |
          set -euo pipefail
          count="$(cat audit-input/chunk-count.txt)"
          if [ "$count" = "0" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          discovery=json.loads(Path("audit-input/discovered-chunks.json").read_text())
          report={
              "schema":"EXP337-INDEPENDENT-LIVE-CHAIN-AUDIT-V1",
              "authoritative_run_id":discovery["authoritative_run_id"],
              "verified_chunk_count":0,
              "complete_chunk_chain":False,
              "chunks":[],
              "note":"No authoritative EXP-337 chunk artifact exists yet; no scientific interpretation assigned.",
          }
          Path("audit-output/exp337-independent-live-chain-audit.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True,indent=2))
          PY
          else
            args=()
            for ((i=0;i<count;i++)); do args+=(--chunk-zip "audit-input/chunk$i.zip"); done
            PYTHONPATH=auditor/src python auditor/scripts/exp337_audit_chain.py \
              --execution-identity auditor/protocols/v017/exp337_execution_identity_v1.json \
              "${args[@]}" \
              --output audit-output/exp337-independent-live-chain-audit.json
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("audit-output/exp337-independent-live-chain-audit.json").read_text())
          chain=report["chain"]
          summary={
              "verified_chunk_count":chain["verified_chunk_count"],
              "complete_chunk_chain":chain["complete_chunk_chain"],
              "last_artifact_sha256":chain["last_artifact_sha256"],
              "pass_counts":[c["pass_counts"] for c in chain["chunks"]],
              "aggregate_pass":[c["aggregate_pass"] for c in chain["chunks"]],
              "self_rollin_divergent_update_count":[c["self_rollin_divergent_update_count"] for c in chain["chunks"]],
          }
          print(json.dumps(summary,sort_keys=True,indent=2))
          PY
          fi
          sha256sum audit-output/exp337-independent-live-chain-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp337-independent-live-chain-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            audit-input/discovered-chunks.json
            audit-output/exp337-independent-live-chain-audit.json
          if-no-files-found: error
          retention-days: 90
