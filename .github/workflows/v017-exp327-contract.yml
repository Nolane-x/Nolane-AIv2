name: v017-exp327-contract
on:
  pull_request:
    paths:
      - "protocols/v017/exp327_*"
      - "src/nolane_ai/experiments/exp327_*.py"
      - "scripts/exp327_*.py"
      - "scripts/verify_exp327_*.py"
      - "tests/test_exp327_*.py"
      - ".github/workflows/v017-exp327-contract.yml"
      - ".github/workflows/exp327-iterative-minimal-subset.yml"
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e '.[dev,model]'
      - run: pytest -q tests/test_exp327_contract.py
