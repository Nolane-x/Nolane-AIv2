name: exp279-stop-path-ablation-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-stop-path-ablation-ci.yml
      - src/nolane_ai/experiments/exp279_stop_path_ablation.py
      - scripts/analyze_exp279_stop_path_ablation.py
      - tests/test_exp279_stop_path_ablation.py
      - docs/superpowers/plans/2026-09-11-exp279-stop-path-cost-decomposition.md

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run stop-path decomposition contract
        run: pytest -q tests/test_exp279_stop_path_ablation.py
      - name: Compile analysis surface
        run: python -m compileall -q src scripts

  pr40-preserved-artifact-decomposition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Download PR40 train=15 DEVELOPMENT artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 34571430104
          name: exp279-development-training-15-9c1aeecbd147665515d8c701520b351bcf3bf37c
          path: /tmp/exp279-pr40/15
      - name: Download PR40 train=60 DEVELOPMENT artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 34571430104
          name: exp279-development-training-60-9c1aeecbd147665515d8c701520b351bcf3bf37c
          path: /tmp/exp279-pr40/60
      - name: Download PR40 train=120 DEVELOPMENT artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 34571430104
          name: exp279-development-training-120-9c1aeecbd147665515d8c701520b351bcf3bf37c
          path: /tmp/exp279-pr40/120
      - name: Decompose preserved zero-route sweep
        run: |
          python scripts/analyze_exp279_stop_path_ablation.py \
            --input /tmp/exp279-pr40/15/development.json \
            --input /tmp/exp279-pr40/60/development.json \
            --input /tmp/exp279-pr40/120/development.json \
            --output /tmp/exp279-stop-path-decomposition/sweep.json
      - name: Assert DEVELOPMENT boundary and sweep lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/exp279-stop-path-decomposition/sweep.json').read_text())
          assert payload['schema'] == 'NLM-EXP-279-STOP-PATH-SWEEP-DEV-V1'
          assert payload['evidence_level'] == 'EV-E2'
          assert payload['decision'] == 'UNVERIFIED'
          assert payload['scientific_evidence_eligible'] is False
          assert payload['training_replicate_counts'] == [15, 60, 120]
          assert payload['evaluation_lineage'] == {'start_replicate': 20000, 'replicates': 33}
          assert payload['all_hybrid_routes_zero'] is True
          assert payload['challenge_materialized'] is False
          assert payload['confirmatory_data_consumed'] is False
          assert payload['promotion_claimed'] is False
          for item in payload['analyses']:
              assert item['all_hybrid_routes_zero'] is True
              assert item['max_route_fraction'] == 0.0
              assert abs(item['utility_reconstruction_error']) < 1e-12
          print(json.dumps(payload, sort_keys=True))
          PY
      - name: Upload descriptive decomposition receipt
        uses: actions/upload-artifact@v4
        with:
          name: exp279-stop-path-decomposition-${{ github.sha }}
          path: /tmp/exp279-stop-path-decomposition
          if-no-files-found: error
          retention-days: 90
