name: exp279-stop-path-ablation-ci

on:
  pull_request:
    paths:
      - .github/workflows/exp279-stop-path-ablation-ci.yml
      - src/nolane_ai/experiments/exp279_stop_path_ablation.py
      - scripts/run_exp279_stop_path_ablation.py
      - tests/test_exp279_stop_path_ablation.py
      - src/nolane_ai/experiments/exp279_paired_runner.py
      - src/nolane_ai/experiments/matched_routing_arms.py
  push:
    branches:
      - exp279-stop-path-fairness-ablation
    paths:
      - .github/workflows/exp279-stop-path-ablation-ci.yml
      - src/nolane_ai/experiments/exp279_stop_path_ablation.py
      - scripts/run_exp279_stop_path_ablation.py
      - tests/test_exp279_stop_path_ablation.py

permissions:
  contents: read

jobs:
  ablation-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,model]'
      - name: Verify frozen Stage-A protocol
        run: python scripts/verify_protocol.py
      - name: Run stop-path ablation contract
        run: pytest -q tests/test_exp279_stop_path_ablation.py
      - name: Compile source
        run: python -m compileall -q src scripts
