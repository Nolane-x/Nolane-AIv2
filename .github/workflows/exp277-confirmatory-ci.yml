name: exp277-confirmatory-ci

on:
  pull_request:
    paths:
      - 'src/nolane_ai/experiments/exp277_*.py'
      - 'scripts/*exp277*.py'
      - 'tests/test_exp277_*.py'
      - 'tests/test_matched_cbrf_arms.py'
      - '.github/workflows/exp277-confirmatory-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/nolane_ai/experiments/exp277_*.py'
      - 'scripts/*exp277*.py'
      - 'tests/test_exp277_*.py'
      - 'tests/test_matched_cbrf_arms.py'
      - '.github/workflows/exp277-confirmatory-ci.yml'

concurrency:
  group: exp277-confirmatory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Run EXP-277 focused contract
        run: pytest -q tests/test_exp277_*.py tests/test_matched_cbrf_arms.py
      - run: python scripts/verify_protocol.py
      - run: python -m compileall -q src scripts
