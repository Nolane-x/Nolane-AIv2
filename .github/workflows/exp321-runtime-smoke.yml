name: exp321-runtime-smoke

on:
  push:
    branches:
      - exp321-runtime-smoke-helper-v2
    paths:
      - .github/workflows/exp321-runtime-smoke.yml

permissions:
  contents: read
  actions: read

jobs:
  reproduce-sealed-exp319-anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EXP-321 helper lineage
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable checkpoint artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "Nolane-x/Nolane-AIv2"
          run_id = 35311529822
          expected_id = 10534351390
          expected_name = "exp319-stage-a-A_FIXED-0.0001-c3"
          expected_digest = "sha256:ee07280fee8379f39ccea16d38f1ff31482975cb39780a75a0592916e8d154c3"
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?"
              + urllib.parse.urlencode({"name": expected_name})
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "exp321-runtime-smoke",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          matches = [a for a in payload["artifacts"] if int(a["id"]) == expected_id]
          if len(matches) != 1:
              raise SystemExit("sealed checkpoint artifact identity mismatch")
          artifact = matches[0]
          if artifact["name"] != expected_name:
              raise SystemExit("sealed checkpoint artifact name mismatch")
          if artifact.get("expired") is not False:
              raise SystemExit("sealed checkpoint artifact is expired")
          if artifact.get("digest") != expected_digest:
              raise SystemExit("sealed checkpoint artifact digest mismatch")
          PY

      - name: Download immutable selected A_FIXED checkpoint
        uses: actions/download-artifact@v4
        with:
          name: exp319-stage-a-A_FIXED-0.0001-c3
          path: input
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AIv2
          run-id: 35311529822

      - name: Install development runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e '.[dev,model]'

      - name: Run EXP-321 implementation smoke without publishing outcome
        run: |
          set -euo pipefail
          python scripts/exp321_localize_checkpoint.py             --checkpoint input/checkpoint.pt             --receipt input/receipt.json             --output /tmp/exp321-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("/tmp/exp321-smoke.json").read_text(encoding="utf-8"))
          if p.get("reproduction_valid") is not True:
              raise SystemExit("EXP-321 failed to reproduce sealed EXP-319 anchors")
          for key in (
              "exp302_implementation_authorized",
              "exp320_implementation_authorized",
              "scale_authorized",
              "authorized_30m",
              "authorized_100m",
          ):
              if p.get(key) is not False:
                  raise SystemExit(f"forbidden authorization: {key}")
          if len(p.get("records", [])) != 128:
              raise SystemExit("EXP-321 effort/world measurement geometry mismatch")
          Path("/tmp/exp321-smoke.json").unlink()
          PY

      - name: Run focused EXP-321 tests
        run: |
          pytest -q tests/test_exp321_contract.py tests/test_exp321_measurement_surface.py
