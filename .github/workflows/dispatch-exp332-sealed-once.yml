name: Dispatch sealed EXP-332 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp332-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-332 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp332-portable-pair-lattice-confirmation.yml/dispatches
          -f ref=exp332-portable-pair-lattice-confirmation
