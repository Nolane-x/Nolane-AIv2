name: Dispatch sealed EXP-323R once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-exp323r-sealed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact sealed EXP-323R branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/exp323r-second-decay-convergence.yml/dispatches
          -f ref=exp323r-materialized-reconstruction-repair
