name: v017-exp332-contract
on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp332_*.py"
      - "scripts/exp332_run.py"
      - "protocols/v017/exp332_*"
      - "tests/test_exp332_*.py"
      - ".github/workflows/exp332-portable-pair-lattice-confirmation.yml"
      - ".github/workflows/v017-exp332-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_exp332_contract.py tests/test_exp332_runtime_surface.py tests/test_exp332_workflow.py
