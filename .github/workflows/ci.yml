name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -k 'not model and not neural and not training and not pilot'
      - run: python scripts/verify_protocol.py
      - run: python scripts/run_stage_a.py --replicates 2 --bootstrap-samples 100 --output /tmp/stage-a-smoke.json
      - run: python -m compileall -q src scripts

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - run: >-
          pytest -q
          tests/test_model.py
          tests/test_stage_a_neural_regions.py
          tests/test_model_audit.py
          tests/test_training.py
          tests/test_pilot_budget.py
          tests/test_functional_optimizer.py
          tests/test_curriculum.py
          tests/test_pilot_trainer.py
          tests/test_pilot_cli.py
          tests/test_neural_evaluation.py
          tests/test_neural_eval_cli.py
          tests/test_heldout_artifact.py
      - run: python scripts/audit_model.py > /tmp/model-audit.json
      - run: python scripts/audit_stage_a_pilot.py > /tmp/stage-a-pilot-audit.json
      - run: >-
          python scripts/train_stage_a_pilot.py
          --tiny
          --steps 1
          --batch-size 2
          --variables 3
          --constraints 2
          --output-dir /tmp/nlm-stage-a-pilot
      - run: >-
          python scripts/evaluate_stage_a_pilot.py
          --tiny
          --train-steps 2
          --eval-batches 2
          --batch-size 2
          --variables 3
          --constraints 2
          --eval-start-replicate 100
          --output /tmp/nlm-stage-a-heldout.json
      - run: python -m compileall -q src scripts
