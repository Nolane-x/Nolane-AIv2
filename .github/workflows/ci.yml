name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -k 'not model and not neural and not training'
      - run: python scripts/verify_protocol.py
      - run: python scripts/run_stage_a.py --replicates 2 --bootstrap-samples 100 --output /tmp/stage-a-smoke.json
      - run: python -m compileall -q src scripts

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - run: pytest -q tests/test_model.py tests/test_stage_a_neural_regions.py tests/test_model_audit.py tests/test_training.py
      - run: python scripts/audit_model.py > /tmp/model-audit.json
      - run: python -m compileall -q src scripts
