name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -k 'not model and not neural and not training and not pilot'
      - run: python scripts/verify_protocol.py
      - run: python scripts/run_stage_a.py --replicates 2 --bootstrap-samples 100 --output /tmp/stage-a-smoke.json
      - run: python -m compileall -q src scripts

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - run: >-
          pytest -q
          tests/test_model.py
          tests/test_stage_a_neural_regions.py
          tests/test_model_audit.py
          tests/test_training.py
          tests/test_pilot_budget.py
          tests/test_functional_optimizer.py
          tests/test_curriculum.py
          tests/test_pilot_trainer.py
          tests/test_pilot_cli.py
          tests/test_neural_evaluation.py
          tests/test_neural_eval_cli.py
          tests/test_heldout_artifact.py
          tests/test_multiseed_heldout.py
          tests/test_multiseed_cli.py
          tests/test_neural_arm_registry.py
          tests/test_matched_belief_arms.py
          tests/test_exp282_compute_ledger.py
          tests/test_exp282_partial_observability.py
          tests/test_exp282_paired_runner.py
          tests/test_exp282_paired_cli.py
          tests/test_exp282_confirmatory_prep.py
          tests/test_exp282_confirmatory_prep_cli.py
          tests/test_exp282_confirmatory_execution_court.py
          tests/test_exp282_reconstruction_court.py
          tests/test_exp282_confirmatory_executor.py
          tests/test_exp282_confirmatory_executor_cli.py
          tests/test_exp282_confirmatory_analysis.py
          tests/test_exp282_confirmatory_analysis_cli.py
          tests/test_exp282_confirmatory_ceremony.py
      - run: python scripts/audit_model.py > /tmp/model-audit.json
      - run: python scripts/audit_stage_a_pilot.py > /tmp/stage-a-pilot-audit.json
      - run: >-
          python scripts/train_stage_a_pilot.py
          --tiny
          --steps 1
          --batch-size 2
          --variables 3
          --constraints 2
          --output-dir /tmp/nlm-stage-a-pilot
      - run: >-
          python scripts/evaluate_stage_a_pilot.py
          --tiny
          --train-steps 2
          --eval-batches 2
          --batch-size 2
          --variables 3
          --constraints 2
          --eval-start-replicate 100
          --output /tmp/nlm-stage-a-heldout.json
      - run: >-
          python scripts/run_multiseed_heldout.py
          --tiny
          --seeds 2
          --train-steps 1
          --eval-batches 1
          --batch-size 2
          --variables 2
          --constraints 2
          --bootstrap-samples 50
          --output /tmp/nlm-stage-a-multiseed.json
      - run: >-
          python scripts/run_exp282_paired_dev.py
          --tiny
          --train-replicates 1
          --eval-replicates 32
          --batch-size 2
          --timesteps 3
          --variables 2
          --output /tmp/nlm-exp282-paired.json
          --registry-output /tmp/nlm-neural-arm-registry.json
      - run: >-
          python scripts/prepare_exp282_confirmatory_open.py
          --execution /tmp/nlm-exp282-paired.json
          --registry /tmp/nlm-neural-arm-registry.json
          --output /tmp/nlm-exp282-confirmatory-prep.json
      - run: python -m compileall -q src scripts
