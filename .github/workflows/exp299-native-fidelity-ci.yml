name: exp299-native-fidelity-ci

on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp299_*.py"
      - "src/nolane_ai/experiments/matched_native_fidelity_arms.py"
      - "tests/test_exp299_*.py"
      - "scripts/run_exp299_native_fidelity_dev.py"
      - "protocols/exp299_*"
      - "docs/superpowers/specs/*exp299*"
      - "docs/superpowers/plans/*exp299*"
      - ".github/workflows/exp299-native-fidelity-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,model]'
      - name: Structural encoder contract
        run: pytest -q tests/test_exp299_structural_encoding.py
      - name: Matched native arm contract
        run: pytest -q tests/test_exp299_native_arms.py
      - name: Remaining EXP-299 contracts
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/test_exp299_*.py)
          selected=()
          for file in "${files[@]}"; do
            case "$file" in
              tests/test_exp299_structural_encoding.py|tests/test_exp299_native_arms.py) ;;
              *) selected+=("$file") ;;
            esac
          done
          if (( ${#selected[@]} )); then
            pytest -q "${selected[@]}"
          fi
      - run: python scripts/verify_protocol.py
      - run: python -m compileall -q src scripts
