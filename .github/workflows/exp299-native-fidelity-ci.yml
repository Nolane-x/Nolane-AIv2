name: exp299-native-fidelity-ci

on:
  pull_request:
    paths:
      - "src/nolane_ai/experiments/exp299_*.py"
      - "src/nolane_ai/experiments/matched_native_fidelity_arms.py"
      - "tests/test_exp299_*.py"
      - "scripts/run_exp299_native_fidelity_dev.py"
      - "protocols/exp299_*"
      - "docs/superpowers/specs/*exp299*"
      - "docs/superpowers/plans/*exp299*"
      - ".github/workflows/exp299-native-fidelity-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only model stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.7'
          python -m pip install -e '.[dev]'
      - name: Structural encoder contract
        run: pytest -q tests/test_exp299_structural_encoding.py
      - name: Matched native arm contract
        run: pytest -q tests/test_exp299_native_arms.py
      - name: Remaining EXP-299 contracts
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/test_exp299_*.py)
          selected=()
          for file in "${files[@]}"; do
            case "$file" in
              tests/test_exp299_structural_encoding.py|tests/test_exp299_native_arms.py) ;;
              *) selected+=("$file") ;;
            esac
          done
          if (( ${#selected[@]} )); then
            pytest -q "${selected[@]}"
          fi
      - run: python scripts/verify_protocol.py
      - run: python -m compileall -q src scripts
      - name: Emit frozen pre-release identity
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from nolane_ai.experiments.exp299_structural_encoding import structural_encoder_contract
          from nolane_ai.protocol.evidence import canonical_sha256
          from nolane_ai.protocol.identity import source_tree_digest

          geometry_digest = Path("protocols/exp299_native_fidelity_geometry_v1.sha256").read_text(encoding="ascii").strip()
          identity = {
              "schema": "NLM-EXP-299-PRE-RELEASE-IDENTITY-V1",
              "repository_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_tree_digest": source_tree_digest(Path.cwd()),
              "geometry_digest": geometry_digest,
              "structural_encoder_contract_digest": canonical_sha256(structural_encoder_contract()),
              "protocol_digest": Path("protocols/stage_a_v1.sha256").read_text(encoding="ascii").strip(),
          }
          print("EXP299_PRE_RELEASE_IDENTITY=" + json.dumps(identity, sort_keys=True))
          PY
